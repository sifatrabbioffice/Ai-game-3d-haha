              // MARK: – Detailed AKM / AK-style assault rifle
              private func buildWeapon() {
                  guard let socket = weaponSocket else { return }

                  let weaponRoot = SCNNode()
                  weaponRoot.name = "AKM_Root"
                  weaponRoot.eulerAngles = SCNVector3(-Float.pi/2 + 0.15, 0, 0)
                  socket.addChildNode(weaponRoot)

                  // Receiver body
                  let receiver = boxNode(0.065, 0.072, 0.48, [gunMetalMat], pos: SCNVector3(0, 0, -0.10))
                  weaponRoot.addChildNode(receiver)

                  // Barrel
                  let barrel = cylNode(0.022, 0.42, [gunMetalMat],
                                       pos: SCNVector3(0, 0.005, -0.42))
                  barrel.eulerAngles = SCNVector3(Float.pi/2, 0, 0)
                  weaponRoot.addChildNode(barrel)

                  // Muzzle device / compensator
                  let muzzle = cylNode(0.030, 0.06, [gunMetalMat],
                                       pos: SCNVector3(0, 0.005, -0.64))
                  muzzle.eulerAngles = SCNVector3(Float.pi/2, 0, 0)
                  weaponRoot.addChildNode(muzzle)

                  // Front sight post
                  let frontSight = boxNode(0.012, 0.055, 0.012, [gunMetalMat], pos: SCNVector3(0, 0.065, -0.55))
                  weaponRoot.addChildNode(frontSight)

                  // Rear sight
                  let rearSight = boxNode(0.040, 0.040, 0.012, [gunMetalMat], pos: SCNVector3(0, 0.065, -0.14))
                  weaponRoot.addChildNode(rearSight)

                  // Wooden stock
                  let stock = boxNode(0.048, 0.055, 0.28, [gunStockMat], pos: SCNVector3(0, -0.022, 0.20))
                  weaponRoot.addChildNode(stock)

                  // Pistol grip
                  let grip = boxNode(0.042, 0.12, 0.048, [gunStockMat], pos: SCNVector3(0, -0.10, 0.06))
                  weaponRoot.addChildNode(grip)

                  // Curved banana magazine
                  let mag = boxNode(0.040, 0.20, 0.085, [gunMetalMat], pos: SCNVector3(0, -0.14, -0.05))
                  weaponRoot.addChildNode(mag)

                  // Handguard (foregrip)
                  let handguard = boxNode(0.062, 0.055, 0.20, [gunStockMat], pos: SCNVector3(0, -0.010, -0.34))
                  weaponRoot.addChildNode(handguard)

                  // Scope / red dot (tactical)
                  let scopeBase = boxNode(0.032, 0.028, 0.090, [gunMetalMat], pos: SCNVector3(0, 0.060, -0.18))
                  weaponRoot.addChildNode(scopeBase)

                  let scopeBody = cylNode(0.022, 0.072, [gunMetalMat], pos: SCNVector3(0, 0.075, -0.18))
                  scopeBody.eulerAngles = SCNVector3(Float.pi/2, 0, 0)
                  weaponRoot.addChildNode(scopeBody)

                  // Scope lens (red dot glow)
                  let lensMat = SCNMaterial()
                  lensMat.diffuse.contents  = UIColor(red: 0.95, green: 0.05, blue: 0.05, alpha: 0.75)
                  lensMat.emission.contents = UIColor(red: 1.00, green: 0.10, blue: 0.10, alpha: 1.0)
                  lensMat.lightingModel     = .constant
                  let lensGeo = SCNCylinder(radius: 0.018, height: 0.004)
                  lensGeo.materials = [lensMat]
                  let lens = SCNNode(geometry: lensGeo)
                  lens.eulerAngles = SCNVector3(Float.pi/2, 0, 0)
                  lens.position    = SCNVector3(0, 0.075, -0.218)
                  weaponRoot.addChildNode(lens)
              }

              // MARK: – Procedural animation: Walk / Run / Idle / Shoot
              func animate(isMoving: Bool, isRunning: Bool, isShooting: Bool, dt: Float) {
                  if isMoving {
                      let spd: Float = isRunning ? 2.8 : 1.6
                      animTime += dt * spd * 10.0

                      let leg  = sin(animTime) * (isRunning ? 0.60 : 0.38)
                      let shin = max(0, sin(animTime + .pi * 0.5)) * (isRunning ? 0.75 : 0.45)
                      let arm  = sin(animTime) * (isRunning ? 0.45 : 0.28)

                      // Thigh swing
                      leftThigh?.eulerAngles.x  =  leg
                      rightThigh?.eulerAngles.x = -leg

                      // Shin kick (only backward swing)
                      leftShin?.eulerAngles.x   = shin
                      rightShin?.eulerAngles.x  = shin * (sin(animTime) > 0 ? 0 : 1)

                      // Arm counter-swing
                      leftUpperArm?.eulerAngles.x  = -arm
                      rightUpperArm?.eulerAngles.x =  arm * 0.35  // gun side moves less

                      // Spine sway
                      spineNode?.eulerAngles.z = sin(animTime * 0.5) * (isRunning ? 0.08 : 0.04)
                      chestNode?.eulerAngles.x = isRunning ? -0.18 : -0.06  // lean forward when running

                      // Head bob
                      headNode?.position.y = abs(sin(animTime)) * (isRunning ? 0.04 : 0.018)

                  } else {
                      animTime = 0
                      // Idle breathing animation
                      let breathCycle = Float(Date().timeIntervalSinceReferenceDate)
                      let breath = sin(breathCycle * 1.2) * 0.012
                      chestNode?.eulerAngles.x    = -0.04 + breath
                      spineNode?.eulerAngles.z    = 0
                      leftThigh?.eulerAngles.x    = 0
                      rightThigh?.eulerAngles.x   = 0
                      leftShin?.eulerAngles.x     = 0
                      rightShin?.eulerAngles.x    = 0
                      leftUpperArm?.eulerAngles.x = 0
                      rightUpperArm?.eulerAngles.x = 0
                      headNode?.position.y        = 0
                  }

                  // Shooting arm raise + recoil
                  if isShooting {
                      rightUpperArm?.eulerAngles.x = -Float.pi * 0.28
                      rightForeArm?.eulerAngles.x  = Float.pi * 0.14
                      // Micro recoil on chest
                      chestNode?.eulerAngles.x = (chestNode?.eulerAngles.x ?? 0) + 0.06
                  } else {
                      if !isMoving {
                          rightUpperArm?.eulerAngles.x = -0.15
                          rightForeArm?.eulerAngles.x  = 0.12
                      }
                  }
              }
          }
          SWIFT_EOF

      # ── EnemyNode (PUBG-Style FBX Humanoid Enemies) ──────────────────────────
      - name: EnemyNode.swift
        run: |
          cat > SV3D/Sources/EnemyNode.swift << 'SWIFT_EOF'
          import SceneKit
          import UIKit

          class EnemyNode: SCNNode {
              let kind:    EnemyKind
              var hp:      Float
              var isAlive: Bool = true
              var lastAttackTime: TimeInterval = 0
              private var character: FBXCharacterNode!
              private var hpBarNode: SCNNode!

              init(kind: EnemyKind) {
                  self.kind = kind
                  self.hp   = kind.health
                  super.init()
                  buildCharacter()
                  buildPhysics()
                  buildHPBar()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func buildCharacter() {
                  character = FBXCharacterNode()
                  // Tint the character to enemy faction colors
                  tintCharacter(character, color: kind.bodyColor, uniform: kind.uniformColor)
                  if kind == .boss {
                      character.scale = SCNVector3(2.0, 2.0, 2.0)
                      // Boss spinning crown
                      addBossEffects()
                  }
                  addChildNode(character)
              }

              private func tintCharacter(_ char: FBXCharacterNode, color: UIColor, uniform: UIColor) {
                  // Override key materials for faction coloring
                  func recolor(_ node: SCNNode?, _ c: UIColor) {
                      guard let n = node else { return }
                      n.geometry?.materials.forEach { m in
                          if (m.diffuse.contents as? UIColor) != nil {
                              m.diffuse.contents = c
                          }
                      }
                  }
                  // Head tint (bloodied)
                  if let skull = char.headNode?.childNodes.first {
                      skull.geometry?.materials.first?.diffuse.contents = color
                  }
              }

              private func addBossEffects() {
                  // Glowing aura
                  let aura = SCNLight()
                  aura.type    = .omni
                  aura.color   = UIColor(red: 1, green: 0, blue: 0, alpha: 1)
                  aura.intensity = 400
                  aura.attenuationStartDistance = 1
                  aura.attenuationEndDistance   = 8
                  let auraNode = SCNNode(); auraNode.light = aura
                  addChildNode(auraNode)

                  // Pulsing scale
                  character.runAction(SCNAction.repeatForever(SCNAction.sequence([
                      SCNAction.scale(to: 2.10, duration: 0.6),
                      SCNAction.scale(to: 1.90, duration: 0.6)
                  ])))
              }

              private func buildHPBar() {
                  // Floating HP bar above head
                  let bgGeo = SCNBox(width: 0.8, height: 0.08, length: 0.04, chamferRadius: 0.02)
                  let bgMat = SCNMaterial(); bgMat.diffuse.contents = UIColor(white:0.1, alpha:0.85); bgMat.lightingModel = .constant
                  bgGeo.materials = [bgMat]
                  let bg = SCNNode(geometry: bgGeo)
                  bg.position = SCNVector3(0, kind.height * 1.25 + (kind == .boss ? 1.2 : 0), 0)

                  let fgGeo = SCNBox(width: 0.78, height: 0.06, length: 0.05, chamferRadius: 0.01)
                  let fgMat = SCNMaterial(); fgMat.diffuse.contents = UIColor(red:0.1, green:0.85, blue:0.1, alpha:1); fgMat.lightingModel = .constant
                  fgGeo.materials = [fgMat]
                  hpBarNode = SCNNode(geometry: fgGeo)
                  hpBarNode.position = SCNVector3(0, kind.height * 1.25 + (kind == .boss ? 1.2 : 0.01), 0)
                  addChildNode(bg)
                  addChildNode(hpBarNode)
              }

              private func buildPhysics() {
                  let scale: Float = kind == .boss ? 2.0 : 1.0
                  let geo   = SCNCapsule(capRadius: CGFloat(kind.radius * scale), height: CGFloat(kind.height * scale))
                  let shape = SCNPhysicsShape(geometry: geo, options: nil)
                  let body  = SCNPhysicsBody(type: .kinematic, shape: shape)
                  body.categoryBitMask    = PhysicsMask.enemy
                  body.contactTestBitMask = PhysicsMask.bullet | PhysicsMask.player
                  body.collisionBitMask   = PhysicsMask.wall | PhysicsMask.ground
                  physicsBody = body
              }

              func takeDamage(_ amount: Float) {
                  guard isAlive else { return }
                  hp -= amount
                  updateHPBar()
                  flashHit()
                  if hp <= 0 { isAlive = false; die() }
              }

              private func updateHPBar() {
                  let ratio = Float(max(0, hp / kind.health))
                  SCNTransaction.begin()
                  SCNTransaction.animationDuration = 0.1
                  hpBarNode.scale = SCNVector3(ratio, 1, 1)
                  let mat = hpBarNode.geometry?.materials.first
                  if ratio > 0.5      { mat?.diffuse.contents = UIColor(red:0.1, green:0.85, blue:0.1, alpha:1) }
                  else if ratio > 0.25 { mat?.diffuse.contents = UIColor(red:0.9, green:0.6, blue:0.0, alpha:1) }
                  else                { mat?.diffuse.contents = UIColor(red:0.9, green:0.1, blue:0.1, alpha:1) }
                  SCNTransaction.commit()
              }

              private func flashHit() {
                  let white = SCNAction.run { node in
                      node.enumerateChildNodes { n, _ in n.geometry?.materials.forEach { $0.emission.contents = UIColor.white } }
                  }
                  let restore = SCNAction.run { node in
                      node.enumerateChildNodes { n, _ in n.geometry?.materials.forEach { $0.emission.contents = UIColor.black } }
                  }
                  runAction(SCNAction.sequence([white, SCNAction.wait(duration:0.07), restore]))
              }

              private func die() {
                  physicsBody = nil
                  hpBarNode.isHidden = true
                  // Ragdoll-style tumble and shrink
                  runAction(SCNAction.sequence([
                      SCNAction.group([
                          SCNAction.rotateBy(x: CGFloat.random(in: 1...2), y: CGFloat.random(in: 0...4), z: CGFloat.random(in: -1...1), duration: 0.5),
                          SCNAction.scale(to: 0.01, duration: 0.5),
                          SCNAction.fadeOut(duration: 0.5)
                      ]),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              func moveToward(target: SCNVector3, dt: Float) {
                  guard isAlive else { return }
                  let dx   = target.x - position.x
                  let dz   = target.z - position.z
                  let dist = sqrt(dx * dx + dz * dz)
                  let isMoving = dist > kind.attackRange * 0.8
                  if isMoving {
                      let spd = kind.speed * dt
                      position.x += dx / dist * spd
                      position.z += dz / dist * spd
                  }
                  eulerAngles.y = atan2(dx, dz)
                  character?.animate(isMoving: isMoving, isRunning: kind == .runner, isShooting: false, dt: dt)
              }

              func distanceTo(_ p: SCNVector3) -> Float {
                  let dx = position.x - p.x; let dz = position.z - p.z
                  return sqrt(dx*dx + dz*dz)
              }

              func canAttack(at t: TimeInterval) -> Bool {
                  return t - lastAttackTime >= kind.attackInterval
              }
          }
          SWIFT_EOF

