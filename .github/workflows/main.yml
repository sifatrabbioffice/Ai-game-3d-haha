name: 🎮 Shadow Village 3D – High-Res Third Person iOS Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build High-Res IPA
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Create Directories
        run: |
          mkdir -p SV3D/Sources
          mkdir -p SV3D/Resources/Assets.xcassets/AppIcon.appiconset

      # ── AppDelegate ──────────────────────────────────────────────────────────
      - name: AppDelegate.swift
        run: |
          cat > SV3D/Sources/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = GameViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

      # ── Types ────────────────────────────────────────────────────────────────
      - name: Types.swift
        run: |
          cat > SV3D/Sources/Types.swift << 'SWIFT_EOF'
          import UIKit

          struct PhysicsMask {
              static let none:   Int = 0
              static let player: Int = 1 << 0
              static let enemy:  Int = 1 << 1
              static let bullet: Int = 1 << 2
              static let wall:   Int = 1 << 3
              static let ground: Int = 1 << 4
              static let item:   Int = 1 << 5
          }

          enum EnemyKind {
              case walker, brute, runner, cultist, boss

              var health: Float {
                  switch self {
                  case .walker:  return 120
                  case .brute:   return 450
                  case .runner:  return 70
                  case .cultist: return 110
                  case .boss:    return 2500
                  }
              }
              var speed: Float {
                  switch self {
                  case .walker:  return 2.5
                  case .brute:   return 1.4
                  case .runner:  return 4.8
                  case .cultist: return 2.2
                  case .boss:    return 1.9
                  }
              }
              var damage: Float {
                  switch self {
                  case .walker:  return 12
                  case .brute:   return 35
                  case .runner:  return 8
                  case .cultist: return 20
                  case .boss:    return 55
                  }
              }
              var attackRange: Float {
                  switch self {
                  case .walker:  return 1.2
                  case .brute:   return 1.6
                  case .runner:  return 1.0
                  case .cultist: return 1.3
                  case .boss:    return 3.0
                  }
              }
              var scoreValue: Int {
                  switch self {
                  case .walker:  return 150
                  case .brute:   return 400
                  case .runner:  return 200
                  case .cultist: return 250
                  case .boss:    return 5000
                  }
              }
              var attackInterval: TimeInterval { return self == .boss ? 0.6 : 1.1 }
              var radius: Float {
                  switch self {
                  case .walker:  return 0.38
                  case .brute:   return 0.72
                  case .runner:  return 0.28
                  case .cultist: return 0.35
                  case .boss:    return 1.50
                  }
              }
              var height: Float { return radius * 4.2 }
              
              var baseColor: UIColor {
                  switch self {
                  case .walker:  return UIColor(red: 0.22, green: 0.28, blue: 0.24, alpha: 1)
                  case .brute:   return UIColor(red: 0.42, green: 0.10, blue: 0.10, alpha: 1)
                  case .runner:  return UIColor(red: 0.48, green: 0.12, blue: 0.42, alpha: 1)
                  case .cultist: return UIColor(red: 0.18, green: 0.04, blue: 0.28, alpha: 1)
                  case .boss:    return UIColor(red: 0.08, green: 0.08, blue: 0.10, alpha: 1)
                  }
              }
          }
          SWIFT_EOF

      # ── JoystickView ─────────────────────────────────────────────────────────
      - name: JoystickView.swift
        run: |
          cat > SV3D/Sources/JoystickView.swift << 'SWIFT_EOF'
          import UIKit

          class JoystickView: UIView {
              private let ring = UIView()
              private let knob = UIView()
              let radius: CGFloat
              var velocity: SIMD2<Float> = .zero
              var isActive: Bool = false
              weak var trackingTouch: UITouch?

              init(radius: CGFloat) {
                  self.radius = radius
                  super.init(frame: CGRect(x: 0, y: 0, width: radius * 2, height: radius * 2))
                  isUserInteractionEnabled = false
                  alpha = 0.82

                  ring.frame               = bounds
                  ring.layer.cornerRadius  = radius
                  ring.backgroundColor     = UIColor(white: 0.03, alpha: 0.40)
                  ring.layer.borderColor   = UIColor(white: 1.0, alpha: 0.35)
                  ring.layer.borderWidth   = 2
                  addSubview(ring)

                  let kR                   = radius * 0.38
                  knob.frame               = CGRect(x: radius - kR, y: radius - kR, width: kR * 2, height: kR * 2)
                  knob.layer.cornerRadius  = kR
                  knob.backgroundColor     = UIColor(white: 1.0, alpha: 0.45)
                  knob.layer.borderColor   = UIColor(white: 1.0, alpha: 0.75)
                  knob.layer.borderWidth   = 2
                  addSubview(knob)
              }
              required init?(coder: NSCoder) { fatalError() }

              func moveTouch(_ touch: UITouch, in parentView: UIView) {
                  let pt   = touch.location(in: parentView)
                  let cx   = frame.midX, cy = frame.midY
                  let dx   = Float(pt.x - cx), dy = Float(pt.y - cy)
                  let dist = sqrt(dx * dx + dy * dy)
                  let maxD = Float(radius)
                  let f    = dist <= maxD ? 1.0 : maxD / dist
                  knob.center = CGPoint(x: cx + CGFloat(dx * f), y: cy + CGFloat(dy * f))
                  velocity    = SIMD2<Float>(dx * f / maxD, dy * f / maxD)
                  isActive    = dist > maxD * 0.08
              }

              func reset() {
                  knob.center   = CGPoint(x: radius, y: radius)
                  velocity      = .zero
                  isActive      = false
                  trackingTouch = nil
              }
          }
          SWIFT_EOF

      # ── HUDOverlay ───────────────────────────────────────────────────────────
      - name: HUDOverlay.swift
        run: |
          cat > SV3D/Sources/HUDOverlay.swift << 'SWIFT_EOF'
          import UIKit

          class HUDOverlay: UIView {
              private let hpBg      = UIView()
              private let hpBar     = UIView()
              private let ammoLbl   = UILabel()
              private let scoreLbl  = UILabel()
              private let waveLbl   = UILabel()
              private let msgLbl    = UILabel()
              private let reloadLbl = UILabel()
              private(set) var shootBtn = UIButton(type: .custom)
              let barW: CGFloat = 220

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  isUserInteractionEnabled = false
                  buildUI()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func monoFont(_ size: CGFloat, bold: Bool = false) -> UIFont {
                  let name  = bold ? "Courier-Bold" : "Courier"
                  let found = UIFont(name: name, size: size)
                  return found ?? (bold ? UIFont.boldSystemFont(ofSize: size) : UIFont.systemFont(ofSize: size))
              }

              private func buildUI() {
                  hpBg.frame            = CGRect(x: 20, y: 20, width: barW + 4, height: 22)
                  hpBg.backgroundColor  = UIColor(white: 0.1, alpha: 0.6)
                  hpBg.layer.cornerRadius = 2
                  addSubview(hpBg)

                  hpBar.frame             = CGRect(x: 22, y: 22, width: barW, height: 18)
                  hpBar.backgroundColor   = UIColor(red: 0.15, green: 0.75, blue: 0.15, alpha: 1)
                  hpBar.layer.cornerRadius = 1
                  addSubview(hpBar)

                  scoreLbl.frame            = CGRect(x: 0, y: 20, width: bounds.width, height: 26)
                  scoreLbl.autoresizingMask = [.flexibleWidth]
                  scoreLbl.text             = "SCORE: 000000"
                  scoreLbl.textColor        = .white
                  scoreLbl.font             = monoFont(16, bold: true)
                  scoreLbl.textAlignment    = .center
                  addSubview(scoreLbl)

                  waveLbl.frame            = CGRect(x: 0, y: 46, width: bounds.width, height: 20)
                  waveLbl.autoresizingMask = [.flexibleWidth]
                  waveLbl.text             = "PHASE 01"
                  waveLbl.textColor        = UIColor(white: 0.7, alpha: 1)
                  waveLbl.font             = monoFont(12, bold: true)
                  waveLbl.textAlignment    = .center
                  addSubview(waveLbl)

                  ammoLbl.frame            = CGRect(x: bounds.width - 180, y: bounds.height - 80, width: 150, height: 40)
                  ammoLbl.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  ammoLbl.text             = "30/120"
                  ammoLbl.textColor        = .white
                  ammoLbl.font             = monoFont(22, bold: true)
                  ammoLbl.textAlignment    = .right
                  addSubview(ammoLbl)

                  reloadLbl.frame            = CGRect(x: bounds.width - 220, y: bounds.height - 115, width: 190, height: 26)
                  reloadLbl.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  reloadLbl.text             = "RELOADING"
                  reloadLbl.textColor        = UIColor(red: 0.9, green: 0.1, blue: 0.1, alpha: 1)
                  reloadLbl.font             = monoFont(14, bold: true)
                  reloadLbl.textAlignment    = .right
                  reloadLbl.isHidden         = true
                  addSubview(reloadLbl)

                  msgLbl.frame            = CGRect(x: 0, y: bounds.height * 0.35, width: bounds.width, height: 50)
                  msgLbl.autoresizingMask = [.flexibleWidth, .flexibleTopMargin, .flexibleBottomMargin]
                  msgLbl.textColor        = .white
                  msgLbl.font             = monoFont(26, bold: true)
                  msgLbl.textAlignment    = .center
                  msgLbl.alpha            = 0
                  addSubview(msgLbl)

                  addSubview(makeCrosshair())

                  let sbS: CGFloat = 85
                  shootBtn.frame = CGRect(x: bounds.width - sbS - 40, y: bounds.height - sbS - 40, width: sbS, height: sbS)
                  shootBtn.autoresizingMask       = [.flexibleLeftMargin, .flexibleTopMargin]
                  shootBtn.backgroundColor        = UIColor(white: 0.12, alpha: 0.45)
                  shootBtn.layer.cornerRadius     = sbS / 2
                  shootBtn.layer.borderColor      = UIColor(white: 1.0, alpha: 0.55).cgColor
                  shootBtn.layer.borderWidth      = 1.5
                  shootBtn.setTitle("⚡", for: .normal)
                  shootBtn.titleLabel?.font       = UIFont.systemFont(ofSize: 30)
                  shootBtn.isUserInteractionEnabled = true
                  addSubview(shootBtn)
              }

              private func makeCrosshair() -> UIView {
                  let s: CGFloat = 16, g: CGFloat = 4, t: CGFloat = 1.5
                  let w = bounds.width / 2, h = bounds.height / 2
                  let col = UIColor(white: 1.0, alpha: 0.7)
                  let container = UIView(frame: bounds)
                  container.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  container.isUserInteractionEnabled = false
                  func bar(_ f: CGRect) -> UIView {
                      let b = UIView(frame: f)
                      b.backgroundColor = col
                      return b
                  }
                  container.addSubview(bar(CGRect(x: w - s - g / 2, y: h - t / 2, width: s, height: t)))
                  container.addSubview(bar(CGRect(x: w + g / 2,     y: h - t / 2, width: s, height: t)))
                  container.addSubview(bar(CGRect(x: w - t / 2,     y: h - s - g / 2, width: t, height: s)))
                  container.addSubview(bar(CGRect(x: w - t / 2,     y: h + g / 2, width: t, height: s)))
                  return container
              }

              func update(health: Float, maxHealth: Float, ammo: Int, totalAmmo: Int, score: Int, wave: Int, isReloading: Bool) {
                  let ratio = CGFloat(max(0, health / maxHealth))
                  UIView.animate(withDuration: 0.15) { self.hpBar.frame.size.width = self.barW * ratio }
                  hpBar.backgroundColor = ratio > 0.45 
                      ? UIColor(red: 0.2, green: 0.7, blue: 0.2, alpha: 1) 
                      : UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1)
                  
                  ammoLbl.text      = String(format: "%02d/%03d", ammo, totalAmmo)
                  scoreLbl.text     = String(format: "SCORE: %06d", score)
                  waveLbl.text      = String(format: "PHASE %02d", wave)
                  reloadLbl.isHidden = !isReloading
              }

              func showMessage(_ text: String, color: UIColor = .white, duration: TimeInterval = 2.0) {
                  msgLbl.text      = text.uppercased()
                  msgLbl.textColor = color
                  msgLbl.alpha     = 0
                  msgLbl.transform = CGAffineTransform(scaleX: 0.9, y: 0.9)
                  UIView.animate(withDuration: 0.25) {
                      self.msgLbl.alpha     = 1
                      self.msgLbl.transform = .identity
                  } completion: { _ in
                      UIView.animate(withDuration: 0.4, delay: duration - 0.4) {
                          self.msgLbl.alpha = 0
                      }
                  }
              }
          }
          SWIFT_EOF

      # ── EnemyNode (FIXED & FULL PBR ENGINE IMPLEMENTATION) ───────────────────
      - name: EnemyNode.swift
        run: |
          cat > SV3D/Sources/EnemyNode.swift << 'SWIFT_EOF'
          import SceneKit
          import UIKit

          class EnemyNode: SCNNode {
              let kind:    EnemyKind
              var hp:      Float
              var isAlive: Bool = true
              var lastAttackTime: TimeInterval = 0
              private var bodyMeshNode: SCNNode!
              private var armorPlate: SCNNode!

              init(kind: EnemyKind) {
                  self.kind = kind
                  self.hp   = kind.health
                  super.init()
                  buildHighResMesh()
                  buildPhysics()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func buildHighResMesh() {
                  let baseGeo = SCNCapsule(capRadius: CGFloat(kind.radius), height: CGFloat(kind.height))
                  baseGeo.radialSegmentCount = 48
                  baseGeo.heightSegmentCount = 32

                  let pbrMat = SCNMaterial()
                  pbrMat.lightingModel = .physicallyBased
                  pbrMat.diffuse.contents = kind.baseColor
                  pbrMat.metalness.contents = (kind == .boss) ? 0.85 : 0.20
                  pbrMat.roughness.contents = 0.65
                  
                  let modifier = "pragma body\n_geometry.position.xyz += _geometry.normal * (sin(_geometry.position.y * 12.0) * 0.03);"
                  baseGeo.shaderModifiers = [.geometry: modifier]
                  baseGeo.materials = [pbrMat]

                  bodyMeshNode = SCNNode(geometry: baseGeo)
                  bodyMeshNode.position = SCNVector3(0, CGFloat(kind.height * 0.5), 0)
                  addChildNode(bodyMeshNode)

                  for side: Float in [-1, 1] {
                      let eyeGeo = SCNSphere(radius: CGFloat(kind.radius * 0.22))
                      eyeGeo.segmentCount = 24
                      let eyeMat = SCNMaterial()
                      eyeMat.lightingModel = .constant
                      eyeMat.diffuse.contents = UIColor(red: 1.0, green: 0.0, blue: 0.1, alpha: 1)
                      eyeMat.emission.contents = UIColor(red: 0.9, green: 0.1, blue: 0.1, alpha: 1)
                      eyeGeo.materials = [eyeMat]

                      let eye = SCNNode(geometry: eyeGeo)
                      eye.position = SCNVector3(side * kind.radius * 0.45, kind.height * 0.84, -(kind.radius * 0.8))
                      addChildNode(eye)
                  }

                  let armorGeo = SCNBox(width: CGFloat(kind.radius * 1.3), height: CGFloat(kind.height * 0.4), length: CGFloat(kind.radius * 1.3), chamferRadius: 0.05)
                  let armMat = SCNMaterial()
                  armMat.lightingModel = .physicallyBased
                  armMat.diffuse.contents = UIColor(white: 0.12, alpha: 1)
                  armMat.metalness.contents = 0.9
                  armMat.roughness.contents = 0.15
                  armorGeo.materials = [armMat]

                  armorPlate = SCNNode(geometry: armorGeo)
                  armorPlate.position = SCNVector3(0, kind.height * 0.55, 0)
                  bodyMeshNode.addChildNode(armorPlate)

                  if kind == .boss {
                      bodyMeshNode.runAction(SCNAction.repeatForever(SCNAction.sequence([
                          SCNAction.scale(to: 1.04, duration: 0.4),
                          SCNAction.scale(to: 0.96, duration: 0.4)
                      ])))
                  }
              }

              private func buildPhysics() {
                  let geo   = SCNCapsule(capRadius: CGFloat(kind.radius), height: CGFloat(kind.height))
                  let shape = SCNPhysicsShape(geometry: geo, options: nil)
                  let body  = SCNPhysicsBody(type: .kinematic, shape: shape)
                  body.categoryBitMask    = PhysicsMask.enemy
                  body.contactTestBitMask = PhysicsMask.bullet | PhysicsMask.player
                  body.collisionBitMask   = PhysicsMask.wall | PhysicsMask.ground
                  physicsBody = body
              }

              func takeDamage(_ amount: Float) {
                  guard isAlive else { return }
                  hp -= amount
                  flashGlow()
                  if hp <= 0 { isAlive = false; die() }
              }

              private func flashGlow() {
                  let flashMat = SCNMaterial()
                  flashMat.lightingModel = .constant
                  flashMat.diffuse.contents = UIColor.red
                  bodyMeshNode.geometry?.materials = [flashMat]
                  
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.05) { [weak self] in
                      guard let s = self else { return }
                      let pbrMat = SCNMaterial()
                      pbrMat.lightingModel = .physicallyBased
                      pbrMat.diffuse.contents = s.kind.baseColor
                      pbrMat.metalness.contents = (s.kind == .boss) ? 0.85 : 0.20
                      pbrMat.roughness.contents = 0.65
                      s.bodyMeshNode.geometry?.materials = [pbrMat]
                  }
              }

              private func die() {
                  physicsBody = nil
                  runAction(SCNAction.sequence([
                      SCNAction.group([
                          SCNAction.rotateBy(x: 0.4, y: 0, z: .pi, duration: 0.35),
                          SCNAction.scale(to: 0.01, duration: 0.35),
                          SCNAction.fadeOut(duration: 0.35)
                      ]),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              func moveToward(target: SCNVector3, dt: Float) {
                  guard isAlive else { return }
                  let dx   = target.x - position.x
                  let dz   = target.z - position.z
                  let dist = sqrt(dx * dx + dz * dz)
                  guard dist > kind.attackRange * 0.85 else { return }
                  let spd = kind.speed * dt
                  position.x += dx / dist * spd
                  position.z += dz / dist * spd
                  eulerAngles.y = atan2(dx, dz)
              }

              func distanceTo(_ p: SCNVector3) -> Float {
                  let dx = position.x - p.x
                  let dz = position.z - p.z
                  return sqrt(dx * dx + dz * dz)
              }

              func canAttack(at t: TimeInterval) -> Bool {
                  return t - lastAttackTime >= kind.attackInterval
              }
          }
          SWIFT_EOF

      # ── GameViewController (ADVANCED SYSTEMS & SCREEN SHAKE INTEGRATION) ─────
      - name: GameViewController.swift
        run: |
          cat > SV3D/Sources/GameViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class GameViewController: UIViewController, SCNSceneRendererDelegate, SCNPhysicsContactDelegate {

              private var scnView: SCNView!
              private var scene:   SCNScene!

              private var playerNode: SCNNode!
              private var playerBody: SCNNode!
              private var cameraArm:  SCNNode!
              private var cameraNode: SCNNode!

              private var spineNode:    SCNNode!
              private var headNode:     SCNNode!
              private var leftThigh:    SCNNode!
              private var rightThigh:   SCNNode!
              private var leftShin:     SCNNode!
              private var rightShin:    SCNNode!
              private var leftArmNode:  SCNNode!
              private var rightArmNode: SCNNode!
              private var animationTime: Float = 0.0

              private var health      : Float        = 100
              private var maxHealth   : Float        = 100
              private var ammo        : Int          = 30
              private var totalAmmo   : Int          = 120
              private var score       : Int          = 0
              private var wave        : Int          = 0
              private var isReloading : Bool         = false
              private var canShoot    : Bool         = true
              private var isGameOver  : Bool         = false
              private var waveActive  : Bool         = false
              private var bossSpawned : Bool         = false
              private var waveTimer   : TimeInterval = 3.0
              private var lastTime    : TimeInterval = 0
              private var enemies     : [EnemyNode]  = []
              private var bullets     : [SCNNode]    = []
              private var lastShotTime: TimeInterval = 0
              
              // Screen Shake Engine
              private var shakeIntensity: Float = 0.0

              private var moveJoystick: JoystickView!
              private var aimJoystick:  JoystickView!
              private var hudView:      HUDOverlay!
              private var isShooting:   Bool    = false
              private var cameraYaw:    Float   = 0
              private let cameraPitch:  Float   = -0.25
              private weak var aimTouch: UITouch?
              private var lastAimPt:    CGPoint = .zero

              private let mapHalf: Float = 35.0

              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupScene()
                  buildWorld()
                  spawnRealisticPlayer()
                  setupCamera()
                  setupAdvancedLighting()
                  setupHUD()
                  setupJoysticks()
                  waveTimer = 3.0
              }

              override var prefersStatusBarHidden: Bool { return true }
              override var shouldAutorotate: Bool { return true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { return .landscape }

              private func setupScene() {
                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask        = [.flexibleWidth, .flexibleHeight]
                  scnView.backgroundColor         = UIColor.black
                  scnView.antialiasingMode         = .multisampling4X
                  scnView.preferredFramesPerSecond = 60
                  view.addSubview(scnView)

                  scene = SCNScene()
                  scene.physicsWorld.contactDelegate = self
                  scene.physicsWorld.gravity         = SCNVector3(0, -15, 0)
                  scnView.scene    = scene
                  scnView.delegate = self
                  scnView.isPlaying = true
              }

              private func buildWorld() {
                  buildPBRGround()
                  buildMonolithicBorders()
                  buildHighResStructures()
              }

              private func buildPBRGround() {
                  let floorGeo = SCNFloor()
                  let mat = SCNMaterial()
                  mat.lightingModel = .physicallyBased
                  mat.diffuse.contents = UIColor(white: 0.08, alpha: 1)
                  mat.roughness.contents = 0.45
                  mat.metalness.contents = 0.10
                  floorGeo.materials = [mat]
                  
                  let node = SCNNode(geometry: floorGeo)
                  node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                  node.physicsBody?.categoryBitMask  = PhysicsMask.ground
                  node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy
                  scene.rootNode.addChildNode(node)
              }

              private func buildMonolithicBorders() {
                  let h: Float = 12, t: Float = 2, s = mapHalf * 2
                  let walls: [(Float, Float, Float, Float, Float, Float)] = [
                      (0, h/2, -(mapHalf+t/2), s+t*2, h, t),
                      (0, h/2,  (mapHalf+t/2), s+t*2, h, t),
                      (-(mapHalf+t/2), h/2, 0, t, h, s),
                      ( (mapHalf+t/2), h/2, 0, t, h, s)
                  ]
                  for (x, y, z, w, hh, d) in walls {
                      let geo = SCNBox(width: CGFloat(w), height: CGFloat(hh), length: CGFloat(d), chamferRadius: 0.1)
                      let mat = SCNMaterial()
                      mat.lightingModel = .physicallyBased
                      mat.diffuse.contents = UIColor(white: 0.05, alpha: 1)
                      mat.roughness.contents = 0.8
                      geo.materials = [mat]
                      let node = SCNNode(geometry: geo)
                      node.position = SCNVector3(x, y, z)
                      node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                      node.physicsBody?.categoryBitMask = PhysicsMask.wall
                      scene.rootNode.addChildNode(node)
                  }
              }

              private func buildHighResStructures() {
                  let locations: [(Float, Float, Float, Float)] = [
                      (-15, -15, 6, 10), (15, -15, 5, 8), (-10, 15, 7, 12),
                      (18, 12, 6, 9), (-20, 0, 5, 11), (0, 20, 8, 14)
                  ]
                  for (x, z, w, h) in locations {
                      let geo = SCNBox(width: CGFloat(w), height: CGFloat(h), length: CGFloat(w), chamferRadius: 0.2)
                      geo.widthSegmentCount = 8
                      geo.heightSegmentCount = 16
                      
                      let mat = SCNMaterial()
                      mat.lightingModel = .physicallyBased
                      mat.diffuse.contents = UIColor(white: 0.10, alpha: 1)
                      mat.roughness.contents = 0.35
                      mat.metalness.contents = 0.40
                      geo.materials = [mat]
                      
                      let node = SCNNode(geometry: geo)
                      node.position = SCNVector3(x, h/2, z)
                      node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                      node.physicsBody?.categoryBitMask = PhysicsMask.wall
                      scene.rootNode.addChildNode(node)
                  }
              }

              private func spawnRealisticPlayer() {
                  playerNode = SCNNode()
                  playerNode.position = SCNVector3(0, 1.4, 0)

                  playerBody = SCNNode()
                  playerNode.addChildNode(playerBody)

                  let suitMat = SCNMaterial(); suitMat.lightingModel = .physicallyBased; suitMat.diffuse.contents = UIColor(white: 0.15, alpha: 1); suitMat.roughness.contents = 0.5
                  let skinMat = SCNMaterial(); skinMat.lightingModel = .physicallyBased; skinMat.diffuse.contents = UIColor(red: 0.88, green: 0.72, blue: 0.62, alpha: 1); skinMat.roughness.contents = 0.3
                  let armorMat = SCNMaterial(); armorMat.lightingModel = .physicallyBased; armorMat.diffuse.contents = UIColor(white: 0.25, alpha: 1); armorMat.metalness.contents = 0.85; armorMat.roughness.contents = 0.1

                  let spineGeo = SCNCylinder(radius: 0.18, height: 0.65)
                  spineGeo.radialSegmentCount = 32
                  spineGeo.materials = [suitMat]
                  spineNode = SCNNode(geometry: spineGeo)
                  spineNode.position = SCNVector3(0, 0.4, 0)
                  playerBody.addChildNode(spineNode)

                  let chestGeo = SCNBox(width: 0.48, height: 0.45, length: 0.32, chamferRadius: 0.06)
                  chestGeo.materials = [armorMat]
                  let chestNode = SCNNode(geometry: chestGeo)
                  chestNode.position = SCNVector3(0, 0.15, 0)
                  spineNode.addChildNode(chestNode)

                  let headGeo = SCNSphere(radius: 0.15)
                  headGeo.segmentCount = 32
                  headGeo.materials = [skinMat]
                  headNode = SCNNode(geometry: headGeo)
                  headNode.position = SCNVector3(0, 0.48, 0)
                  spineNode.addChildNode(headNode)

                  let thighGeo = SCNCylinder(radius: 0.08, height: 0.38)
                  thighGeo.materials = [suitMat]
                  let shinGeo = SCNCylinder(radius: 0.06, height: 0.38)
                  shinGeo.materials = [suitMat]

                  leftThigh = SCNNode(geometry: thighGeo)
                  leftThigh.pivot = SCNMatrix4MakeTranslation(0, 0.19, 0)
                  leftThigh.position = SCNVector3(-0.14, -0.15, 0)
                  playerBody.addChildNode(leftThigh)

                  leftShin = SCNNode(geometry: shinGeo)
                  leftShin.position = SCNVector3(0, -0.34, 0)
                  leftThigh.addChildNode(leftShin)

                  rightThigh = SCNNode(geometry: thighGeo)
                  rightThigh.pivot = SCNMatrix4MakeTranslation(0, 0.19, 0)
                  rightThigh.position = SCNVector3(0.14, -0.15, 0)
                  playerBody.addChildNode(rightThigh)

                  rightShin = SCNNode(geometry: shinGeo)
                  rightShin.position = SCNVector3(0, -0.34, 0)
                  rightThigh.addChildNode(rightShin)

                  let armGeo = SCNCylinder(radius: 0.06, height: 0.55)
                  armGeo.materials = [suitMat]

                  leftArmNode = SCNNode(geometry: armGeo)
                  leftArmNode.pivot = SCNMatrix4MakeTranslation(0, 0.27, 0)
                  leftArmNode.position = SCNVector3(-0.26, 0.25, 0)
                  spineNode.addChildNode(leftArmNode)

                  rightArmNode = SCNNode(geometry: armGeo)
                  rightArmNode.pivot = SCNMatrix4MakeTranslation(0, 0.27, 0)
                  rightArmNode.position = SCNVector3(0.26, 0.25, 0)
                  spineNode.addChildNode(rightArmNode)

                  let gunGeo = SCNBox(width: 0.06, height: 0.08, length: 0.65, chamferRadius: 0.01)
                  let metallicGunMat = SCNMaterial()
                  metallicGunMat.lightingModel = .physicallyBased
                  metallicGunMat.diffuse.contents = UIColor(white: 0.05, alpha: 1)
                  metallicGunMat.metalness.contents = 0.95
                  metallicGunMat.roughness.contents = 0.1
                  gunGeo.materials = [metallicGunMat]
                  
                  let gun = SCNNode(geometry: gunGeo)
                  gun.position = SCNVector3(0, -0.28, -0.22)
                  gun.eulerAngles = SCNVector3(-Float.pi / 2, 0, 0)
                  rightArmNode.addChildNode(gun)

                  let shape = SCNPhysicsShape(geometry: SCNCapsule(capRadius: 0.42, height: 1.65), options: nil)
                  let body  = SCNPhysicsBody(type: .kinematic, shape: shape)
                  body.categoryBitMask    = PhysicsMask.player
                  body.contactTestBitMask = PhysicsMask.enemy | PhysicsMask.item
                  body.collisionBitMask   = PhysicsMask.wall | PhysicsMask.ground
                  playerNode.physicsBody  = body
                  scene.rootNode.addChildNode(playerNode)
              }

              private func setupCamera() {
                  cameraArm = SCNNode()
                  cameraArm.position = SCNVector3(0, 1.8, 0)
                  playerNode.addChildNode(cameraArm)

                  cameraNode = SCNNode()
                  let cam    = SCNCamera()
                  cam.fieldOfView = 68
                  cam.zFar = 250
                  cam.wantsHDR = true
                  cameraNode.camera = cam
                  cameraNode.position = SCNVector3(0, 2.4, 6.5)
                  cameraNode.eulerAngles = SCNVector3(cameraPitch, 0, 0)
                  cameraArm.addChildNode(cameraNode)
                  scnView.pointOfView = cameraNode
              }

              private func setupAdvancedLighting() {
                  scnView.autoenablesDefaultLighting = false
                  
                  let keyLight = SCNLight()
                  keyLight.type = .directional
                  keyLight.color = UIColor(red: 0.60, green: 0.65, blue: 0.85, alpha: 1)
                  keyLight.intensity = 1200
                  keyLight.castsShadow = true
                  keyLight.shadowRadius = 4.0
                  keyLight.shadowMapSize = CGSize(width: 4096, height: 4096)
                  
                  let keyNode = SCNNode()
                  keyNode.light = keyLight
                  keyNode.eulerAngles = SCNVector3(-0.8, 0.5, 0)
                  scene.rootNode.addChildNode(keyNode)

                  let fillLight = SCNLight()
                  fillLight.type = .ambient
                  fillLight.color = UIColor(red: 0.08, green: 0.08, blue: 0.15, alpha: 1)
                  fillLight.intensity = 400
                  let fillNode = SCNNode()
                  fillNode.light = fillLight
                  scene.rootNode.addChildNode(fillNode)
              }

              private func setupHUD() {
                  hudView = HUDOverlay(frame: view.bounds)
                  hudView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  hudView.isUserInteractionEnabled = true
                  view.addSubview(hudView)
                  hudView.shootBtn.addTarget(self, action: #selector(shootDown), for: .touchDown)
                  hudView.shootBtn.addTarget(self, action: #selector(shootUp), for: [.touchUpInside, .touchUpOutside, .touchCancel])
              }

              @objc private func shootDown() { isShooting = true  }
              @objc private func shootUp()   { isShooting = false }

              private func setupJoysticks() {
                  let jR = view.bounds.height * 0.13
                  moveJoystick = JoystickView(radius: jR)
                  moveJoystick.center = CGPoint(x: jR + 35, y: view.bounds.height - jR - 35)
                  view.addSubview(moveJoystick)

                  aimJoystick = JoystickView(radius: jR)
                  aimJoystick.center = CGPoint(x: view.bounds.width - jR - 150, y: view.bounds.height - jR - 35)
                  view.addSubview(aimJoystick)
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if moveJoystick.frame.contains(pt) && moveJoystick.trackingTouch == nil {
                          moveJoystick.trackingTouch = t
                      } else if aimJoystick.frame.contains(pt) && aimJoystick.trackingTouch == nil {
                          aimJoystick.trackingTouch = t
                          aimTouch  = t
                          lastAimPt = pt
                      }
                  }
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if t === moveJoystick.trackingTouch {
                          moveJoystick.moveTouch(t, in: view)
                      } else if t === aimJoystick.trackingTouch {
                          aimJoystick.moveTouch(t, in: view)
                          cameraYaw -= Float(pt.x - lastAimPt.x) * 0.0060
                          lastAimPt  = pt
                      }
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === moveJoystick.trackingTouch { moveJoystick.reset() }
                      if t === aimJoystick.trackingTouch  { aimJoystick.reset(); aimTouch = nil }
                  }
              }

              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  touchesEnded(touches, with: event)
              }

              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  guard !isGameOver else { return }
                  let dt = lastTime == 0 ? 0 : Float(min(time - lastTime, 0.05))
                  lastTime = time

                  moveAndAnimatePlayer(dt: dt)
                  
                  // Compute Matrix Shaker Offset values
                  if shakeIntensity > 0.01 {
                      let sx = Float.random(in: -1...1) * shakeIntensity
                      let sy = Float.random(in: -1...1) * shakeIntensity
                      cameraNode.position = SCNVector3(sx, 2.4 + sy, 6.5)
                      shakeIntensity *= 0.90
                  } else {
                      cameraNode.position = SCNVector3(0, 2.4, 6.5)
                  }

                  cameraArm.eulerAngles.y = cameraYaw
                  if isShooting { tryShoot(time: time) }
                  updateEnemies(time: time, dt: dt)
                  updateWaves(dt: dt)

                  DispatchQueue.main.async { [weak self] in
                      guard let s = self else { return }
                      s.hudView.update(health: s.health, maxHealth: s.maxHealth, ammo: s.ammo, totalAmmo: s.totalAmmo, score: s.score, wave: s.wave, isReloading: s.isReloading)
                      if s.health <= 0 && !s.isGameOver { s.endGame(victory: false) }
                  }
              }

              private func moveAndAnimatePlayer(dt: Float) {
                  let mv  = moveJoystick.velocity
                  let len = sqrt(mv.x * mv.x + mv.y * mv.y)

                  guard len > 0.1 else {
                      executeProceduralSkeletonGait(moving: false, matrixFactor: 0, dt: dt)
                      return
                  }

                  let highVelocity = len > 0.72
                  let travelSpeed: Float = highVelocity ? 8.5 : 4.0
                  let matrixFactor: Float = highVelocity ? 2.6 : 1.4

                  let fwd = SIMD3<Float>(-sin(cameraYaw), 0, -cos(cameraYaw))
                  let rgt = SIMD3<Float>( cos(cameraYaw), 0, -sin(cameraYaw))
                  var dir = fwd * (-mv.y) + rgt * mv.x
                  let dLen = sqrt(dir.x * dir.x + dir.y * dir.y + dir.z * dir.z)
                  if dLen > 0 { dir = dir / dLen }

                  let deltaPos = dir * travelSpeed * dt
                  var finalPos = playerNode.simdPosition + deltaPos
                  let boundary = mapHalf - 2.0
                  finalPos.x = max(-boundary, min(boundary, finalPos.x))
                  finalPos.z = max(-boundary, min(boundary, finalPos.z))
                  playerNode.simdPosition = finalPos
                  playerBody.eulerAngles.y = atan2(dir.x, dir.z)

                  executeProceduralSkeletonGait(moving: true, matrixFactor: matrixFactor, dt: dt)
              }

              private func executeProceduralSkeletonGait(moving: Bool, matrixFactor: Float, dt: Float) {
                  if moving {
                      animationTime += dt * matrixFactor * 14.0
                      let primaryOscillation = sin(animationTime)
                      let secondaryOscillation = cos(animationTime)

                      leftThigh.eulerAngles.x = primaryOscillation * 0.55
                      leftShin.eulerAngles.x = max(0, secondaryOscillation * 0.40)
                      
                      rightThigh.eulerAngles.x = -primaryOscillation * 0.55
                      rightShin.eulerAngles.x = max(0, -secondaryOscillation * 0.40)

                      leftArmNode.eulerAngles.x = -primaryOscillation * 0.45
                      rightArmNode.eulerAngles.x = (primaryOscillation * 0.1) - 0.25
                  } else {
                      leftThigh.eulerAngles.x = 0; leftShin.eulerAngles.x = 0
                      rightThigh.eulerAngles.x = 0; rightShin.eulerAngles.x = 0
                      leftArmNode.eulerAngles.x = 0; rightArmNode.eulerAngles.x = -0.15
                      animationTime = 0
                  }
              }

              private func tryShoot(time: TimeInterval) {
                  guard canShoot, !isReloading, time - lastShotTime > 0.18 else { return }
                  guard ammo > 0 else { executeReloadSequence(); return }
                  
                  lastShotTime = time
                  ammo -= 1

                  let wt = cameraNode.presentation.worldTransform
                  let cPos = SCNVector3(wt.m41, wt.m42, wt.m43)
                  let fLen = sqrt(wt.m31 * wt.m31 + wt.m32 * wt.m32 + wt.m33 * wt.m33)
                  let fx = -wt.m31 / fLen; let fy = -wt.m32 / fLen; let fz = -wt.m33 / fLen

                  let tracerGeo = SCNCapsule(capRadius: 0.02, height: 0.5)
                  let tracerMat = SCNMaterial()
                  tracerMat.lightingModel = .constant
                  tracerMat.diffuse.contents = UIColor(red: 0.2, green: 0.6, blue: 1.0, alpha: 1)
                  tracerMat.emission.contents = UIColor(red: 0.5, green: 0.8, blue: 1.0, alpha: 1)
                  tracerGeo.materials = [tracerMat]

                  let bulletNode = SCNNode(geometry: tracerGeo)
                  bulletNode.position = SCNVector3(cPos.x + fx * 1.2, cPos.y + fy * 1.2, cPos.z + fz * 1.2)
                  
                  let bBody = SCNPhysicsBody(type: .dynamic, shape: SCNPhysicsShape(geometry: tracerGeo, options: nil))
                  bBody.categoryBitMask = PhysicsMask.bullet
                  bBody.contactTestBitMask = PhysicsMask.enemy | PhysicsMask.wall
                  bBody.collisionBitMask = PhysicsMask.none
                  bBody.isAffectedByGravity = false
                  bBody.velocity = SCNVector3(fx * 75, fy * 75, fz * 75)
                  bulletNode.physicsBody = bBody

                  scene.rootNode.addChildNode(bulletNode)
                  bullets.append(bulletNode)

                  bulletNode.runAction(SCNAction.sequence([
                      SCNAction.wait(duration: 2.0),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              private func executeReloadSequence() {
                  guard !isReloading, totalAmmo > 0 else { return }
                  isReloading = true
                  canShoot    = false
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.2) { [weak self] in
                      guard let s = self else { return }
                      let amount = min(30 - s.ammo, s.totalAmmo)
                      s.ammo += amount
                      s.totalAmmo -= amount
                      s.isReloading = false
                      s.canShoot = true
                  }
              }

              private func updateEnemies(time: TimeInterval, dt: Float) {
                  enemies = enemies.filter { $0.parent != nil && $0.isAlive }
                  for e in enemies {
                      e.moveToward(target: playerNode.position, dt: dt)
                      if e.distanceTo(playerNode.position) < e.kind.attackRange + 0.4 && e.canAttack(at: time) {
                          e.lastAttackTime = time
                          health -= e.kind.damage
                          shakeIntensity = 0.35
                          DispatchQueue.main.async { [weak self] in self?.flashScreenImpact() }
                      }
                  }
              }

              private func updateWaves(dt: Float) {
                  if waveActive {
                      if enemies.isEmpty {
                          waveActive = false
                          waveTimer = 3.5
                          score += 1000
                          if bossSpawned { endGame(victory: true); return }
                      }
                  } else {
                      waveTimer -= Double(dt)
                      if waveTimer <= 0 { startNextPhase() }
                  }
              }

              private func startNextPhase() {
                  wave += 1
                  waveActive = true
                  
                  if wave == 5 {
                      bossSpawned = true
                      spawnEnemy(kind: .boss, at: SCNVector3(-15, 0, -15))
                      return
                  }

                  let totalSpawn = 4 + wave * 3
                  for i in 0..<totalSpawn {
                      let kind: EnemyKind = i % 4 == 0 && wave > 2 ? .brute : (i % 3 == 0 ? .runner : .walker)
                      DispatchQueue.main.asyncAfter(deadline: .now() + Double(i) * 0.35) { [weak self] in
                          self?.spawnEnemy(kind: kind)
                      }
                  }
              }

              private func spawnEnemy(kind: EnemyKind, at pos: SCNVector3? = nil) {
                  let enemy = EnemyNode(kind: kind)
                  let boundary = mapHalf - 4.0
                  enemy.position = pos ?? SCNVector3(Float.random(in: -boundary...boundary), 0, Float.random(in: -boundary...boundary))
                  scene.rootNode.addChildNode(enemy)
                  enemies.append(enemy)
              }

              func physicsWorld(_ world: SCNPhysicsWorld, didBegin contact: SCNPhysicsContact) {
                  let nA = contact.nodeA, nB = contact.nodeB
                  let mA = nA.physicsBody?.categoryBitMask ?? 0
                  let mB = nB.physicsBody?.categoryBitMask ?? 0

                  if (mA == PhysicsMask.bullet && mB == PhysicsMask.enemy) || (mB == PhysicsMask.bullet && mA == PhysicsMask.enemy) {
                      let bullet = mA == PhysicsMask.bullet ? nA : nB
                      let enemy = (mA == PhysicsMask.enemy ? nA : nB) as? EnemyNode
                      
                      // Inject Spark Elements Programmatically
                      createSparksAt(position: bullet.position)
                      
                      bullet.removeFromParentNode()
                      enemy?.takeDamage(35)
                      if let e = enemy, !e.isAlive { score += e.kind.scoreValue }
                  }
              }
              
              private func createSparksAt(position: SCNVector3) {
                  for _ in 0..<6 {
                      let spark = SCNNode(geometry: SCNSphere(radius: 0.04))
                      spark.geometry?.firstMaterial?.lightingModel = .constant
                      spark.geometry?.firstMaterial?.diffuse.contents = UIColor.orange
                      spark.position = position
                      scene.rootNode.addChildNode(spark)
                      
                      let vx = Float.random(in: -3...3)
                      let vy = Float.random(in: 1...5)
                      let vz = Float.random(in: -3...3)
                      
                      spark.runAction(SCNAction.sequence([
                          SCNAction.group([
                              SCNAction.moveBy(x: CGFloat(vx), y: CGFloat(vy), z: CGFloat(vz), duration: 0.25),
                              SCNAction.scale(to: 0.01, duration: 0.25)
                          ]),
                          SCNAction.removeFromParentNode()
                      ]))
                  }
              }

              private func flashScreenImpact() {
                  let overlay = UIView(frame: view.bounds)
                  overlay.backgroundColor = UIColor(red: 0.8, green: 0.1, blue: 0.1, alpha: 0.3)
                  view.addSubview(overlay)
                  UIView.animate(withDuration: 0.2, animations: { overlay.alpha = 0 }) { _ in overlay.removeFromSuperview() }
              }

              private func endGame(victory: Bool) {
                  guard !isGameOver else { return }
                  isGameOver = true
                  DispatchQueue.main.async { [weak self] in self?.showGameOverScreen(victory: victory) }
              }

              private func showGameOverScreen(victory: Bool) {
                  let screen = UIView(frame: view.bounds)
                  screen.backgroundColor = UIColor(white: 0.02, alpha: 0.95)
                  view.addSubview(screen)

                  let title = UILabel(frame: CGRect(x: 0, y: screen.bounds.height * 0.3, width: screen.bounds.width, height: 60))
                  title.text = victory ? "SURVIVED" : "TERMINATED"
                  title.font = UIFont(name: "Courier-Bold", size: 36)
                  title.textColor = victory ? .green : .red
                  title.textAlignment = .center
                  screen.addSubview(title)
              }
          }
          SWIFT_EOF

