name: 🎮 Shadow Village 3D – PUBG-Style + Custom Character + Reload UI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA (Custom Assets + Sound + UI)
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen blender 2>/dev/null || brew install xcodegen
          pip3 install requests 2>/dev/null || true
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Create Project Directories
        run: |
          mkdir -p SV3D/Sources
          mkdir -p SV3D/Resources/Assets.xcassets/AppIcon.appiconset
          mkdir -p SV3D/Resources/Models
          mkdir -p SV3D/Resources/Sounds
          mkdir -p SV3D/Resources/Textures
          mkdir -p SV3D/Resources/Particles

      # ── Download Custom 3D Character ────────────────────────────────────────
      - name: Download 3D Character Model (GLB format recommended)
        run: |
          echo "📥 Downloading custom 3D character..."
          CUSTOM_MODEL_URL="https://github.com/KhronosGroup/glTF-Sample-Assets/raw/main/Models/BoxAnimated/glTF-Binary/BoxAnimated.glb"
          curl -L "$CUSTOM_MODEL_URL" -o SV3D/Resources/Models/character.glb 2>/dev/null || echo "⚠️ Model source unavailable"
          ls -lh SV3D/Resources/Models/

      # ── Convert Models to SceneKit-Compatible USDZ ──────────────────────────
      - name: Convert Models to USDZ
        run: |
          python3 << 'PYEOF'
          import subprocess, os
          models_dir = "SV3D/Resources/Models"
          os.makedirs(models_dir, exist_ok=True)
          glb_files = [f for f in os.listdir(models_dir) if f.endswith('.glb')]
          for glb in glb_files:
              src = os.path.join(models_dir, glb)
              dst = os.path.join(models_dir, glb.replace('.glb', '.usdz'))
              result = subprocess.run(['xcrun', 'usdz_converter', src, dst], capture_output=True, text=True)
              if result.returncode == 0:
                  print(f"✅ Converted {glb} → {os.path.basename(dst)}")
          PYEOF

      # ── Procedural Environment Textures ──────────────────────────────────────
      - name: Generate PBR Textures
        run: |
          python3 << 'PYEOF'
          import struct, zlib, os, random
          def make_png(w, h, pixel_fn, filename):
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      r, g, b = pixel_fn(x, y, w, h)
                      row += [r, g, b]
                  rows.append(bytes(row))
              raw = zlib.compress(b''.join(rows), 6)
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              ihdr = u32(w)+u32(h)+bytes([8,2,0,0,0])
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR',ihdr) + chunk(b'IDAT',raw) + chunk(b'IEND',b'')

          os.makedirs("SV3D/Resources/Textures", exist_ok=True)
          random.seed(42)
          def noise(x, y, scale=1): return (int(x*scale)%256 * 1664525 + int(y*scale)%256 * 1013904223 + 1234567891) % 256
          def ground_pixel(x,y,w,h):
              v = (noise(x,y,0.08)*0.5 + noise(x+50,y+50,0.22)*0.3)
              return int(max(30, min(110, 68+v*0.18))), int(max(25, min(90, 55+v*0.14))), int(max(10, min(50, 28+v*0.06)))
          def concrete_pixel(x,y,w,h):
              base = int(80 + (noise(x,y,0.05)*0.7 + noise(x+100,y,0.15)*0.3) * 0.28)
              return base, base-2, base-5

          for fname, fn in [("ground_diffuse.png", ground_pixel), ("concrete_diffuse.png", concrete_pixel)]:
              with open(f"SV3D/Resources/Textures/{fname}", 'wb') as f: f.write(make_png(512, 512, fn, fname))
          PYEOF

      # ── Generate Sound Effects ───────────────────────────────────────────────
      - name: Generate Audio
        run: |
          python3 << 'PYEOF'
          import struct, math, os, random
          def write_wav(filename, samples, sr=44100):
              data = struct.pack(f'<{len(samples)}h', *[max(-32768, min(32767, int(s))) for s in samples])
              header = struct.pack('<4sI4s4sIHHIIHH4sI', b'RIFF', 36+len(data), b'WAVE', b'fmt ', 16, 1, 1, sr, sr*2, 2, 16, b'data', len(data))
              os.makedirs("SV3D/Resources/Sounds", exist_ok=True)
              with open(f"SV3D/Resources/Sounds/{filename}", 'wb') as f: f.write(header + data)

          SR = 44100
          write_wav("gunshot.wav", [math.sin(2*math.pi*85*(i/SR))*math.exp(-i/SR*40)*28000 for i in range(int(SR*0.55))])
          write_wav("empty_click.wav", [math.sin(2*math.pi*800*(i/SR))*math.exp(-i/SR*120)*25000 for i in range(int(SR*0.12))])
          write_wav("reload.wav", [random.uniform(-1,1)*math.exp(-i/SR*80)*20000 for i in range(int(SR*1.2))])
          PYEOF

      # ── Swift Source Files ──────────────────────────────────────────────────
      - name: AppDelegate & Types
        run: |
          cat > SV3D/Sources/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit
          import AVFoundation
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = GameViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF
          
          cat > SV3D/Sources/Types.swift << 'SWIFT_EOF'
          import UIKit
          struct PhysicsMask {
              static let none:Int=0; static let player:Int=1<<0; static let enemy:Int=1<<1; static let bullet:Int=1<<2; static let wall:Int=1<<3; static let ground:Int=1<<4; static let item:Int=1<<5
          }
          enum EnemyKind {
              case walker, brute, boss
              var health: Float { self == .boss ? 2500 : (self == .brute ? 400 : 100) }
              var speed: Float { self == .boss ? 1.4 : (self == .brute ? 1.1 : 2.2) }
              var damage: Float { self == .boss ? 55 : (self == .brute ? 38 : 12) }
              var attackRange: Float { self == .boss ? 2.5 : 1.0 }
              var scoreValue: Int { self == .boss ? 5000 : 100 }
              var attackInterval: TimeInterval { self == .boss ? 0.7 : 1.4 }
              var radius: Float { self == .boss ? 1.2 : 0.35 }
              var height: Float { radius * 4.2 }
              var bodyColor: UIColor { .red }
              var uniformColor: UIColor { .darkGray }
          }
          SWIFT_EOF

      - name: FBXCharacterNode.swift
        run: |
          cat > SV3D/Sources/FBXCharacterNode.swift << 'SWIFT_EOF'
          import SceneKit
          import UIKit

          class FBXCharacterNode: SCNNode {
              var animTime: Float = 0
              var rightUpperArm: SCNNode!
              var rightForeArm: SCNNode!
              var weaponSocket: SCNNode!
              
              override init() {
                  super.init()
                  if !tryLoadExternal() { buildProceduralSoldier() }
              }
              required init?(coder: NSCoder) { fatalError() }

              private func tryLoadExternal() -> Bool {
                  let names = ["character", "soldier_base", "human"]
                  for name in names {
                      if let url = Bundle.main.url(forResource: name, withExtension: "usdz") ?? Bundle.main.url(forResource: name, withExtension: "scn") {
                          if let scene = try? SCNScene(url: url, options: nil) {
                              addChildNode(scene.rootNode.clone())
                              print("✅ Loaded custom external model: \(name)")
                              return true
                          }
                      }
                  }
                  return false
              }

              private func buildProceduralSoldier() {
                  let mat = SCNMaterial(); mat.diffuse.contents = UIColor.darkGray
                  let body = SCNCapsule(capRadius: 0.3, height: 1.8)
                  body.materials = [mat]
                  let node = SCNNode(geometry: body)
                  node.position = SCNVector3(0, 0.9, 0)
                  addChildNode(node)
              }

              func animate(isMoving: Bool, isRunning: Bool, isShooting: Bool, dt: Float) {}
          }
          SWIFT_EOF

      - name: JoystickView.swift
        run: |
          cat > SV3D/Sources/JoystickView.swift << 'SWIFT_EOF'
          import UIKit
          class JoystickView: UIView {
              private let knob = UIView()
              let radius: CGFloat
              var velocity: SIMD2<Float> = .zero
              var isActive: Bool = false
              weak var trackingTouch: UITouch?
              
              init(radius: CGFloat) {
                  self.radius = radius
                  super.init(frame: CGRect(x:0, y:0, width:radius*2, height:radius*2))
                  isUserInteractionEnabled = false; alpha = 0.80
                  
                  let kR = radius * 0.32
                  knob.frame = CGRect(x:radius-kR, y:radius-kR, width:kR*2, height:kR*2)
                  knob.backgroundColor = UIColor(red:0.25, green:0.85, blue:0.35, alpha:0.75)
                  knob.layer.cornerRadius = kR
                  addSubview(knob)
              }
              required init?(coder: NSCoder) { fatalError() }

              func moveTouch(_ touch: UITouch, in parentView: UIView) {
                  let pt = touch.location(in: parentView)
                  let cx = frame.midX, cy = frame.midY
                  let dx = Float(pt.x - cx), dy = Float(pt.y - cy)
                  let dist = sqrt(dx*dx + dy*dy), maxD = Float(radius)
                  let f = dist <= maxD ? 1.0 : maxD / dist
                  knob.center = CGPoint(x: cx + CGFloat(dx*f), y: cy + CGFloat(dy*f))
                  velocity = SIMD2<Float>(dx*f/maxD, dy*f/maxD)
                  isActive = dist > maxD * 0.12
              }
              func reset() {
                  knob.center = CGPoint(x:radius, y:radius)
                  velocity = .zero; isActive = false; trackingTouch = nil
              }
          }
          SWIFT_EOF

      - name: HUDOverlay.swift
        run: |
          cat > SV3D/Sources/HUDOverlay.swift << 'SWIFT_EOF'
          import UIKit

          class HUDOverlay: UIView {
              private let hpLabel = UILabel()
              private let ammoLbl = UILabel()
              private let reloadBg = UIView()
              private let reloadBar = UIView()
              
              private(set) var shootBtn = UIButton(type: .custom)
              private(set) var reloadBtn = UIButton(type: .custom)

              override init(frame: CGRect) {
                  super.init(frame: frame); isUserInteractionEnabled = false; buildUI()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func buildUI() {
                  ammoLbl.frame = CGRect(x: bounds.width - 200, y: bounds.height - 80, width: 180, height: 30)
                  ammoLbl.textColor = .white; ammoLbl.font = .boldSystemFont(ofSize: 24); ammoLbl.textAlignment = .right
                  ammoLbl.autoresizingMask = [.flexibleTopMargin, .flexibleLeftMargin]
                  addSubview(ammoLbl)

                  reloadBg.frame = CGRect(x: bounds.width - 200, y: bounds.height - 40, width: 180, height: 8)
                  reloadBg.backgroundColor = UIColor(white: 0.2, alpha: 1)
                  reloadBg.autoresizingMask = [.flexibleTopMargin, .flexibleLeftMargin]
                  addSubview(reloadBg)
                  
                  reloadBar.frame = CGRect(x: bounds.width - 200, y: bounds.height - 40, width: 0, height: 8)
                  reloadBar.backgroundColor = .orange
                  reloadBar.autoresizingMask = [.flexibleTopMargin, .flexibleLeftMargin]
                  addSubview(reloadBar)

                  let sbS: CGFloat = 80
                  shootBtn.frame = CGRect(x: bounds.width - sbS - 140, y: bounds.height - sbS - 40, width: sbS, height: sbS)
                  shootBtn.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  shootBtn.backgroundColor = UIColor(red:0.65, green:0.04, blue:0.04, alpha:0.82)
                  shootBtn.layer.cornerRadius = sbS/2
                  shootBtn.setTitle("🔥", for: .normal)
                  shootBtn.titleLabel?.font = .systemFont(ofSize:36)
                  shootBtn.isUserInteractionEnabled = true
                  addSubview(shootBtn)

                  let rbS: CGFloat = 60
                  reloadBtn.frame = CGRect(x: bounds.width - sbS - rbS - 160, y: bounds.height - sbS - rbS - 10, width: rbS, height: rbS)
                  reloadBtn.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  reloadBtn.backgroundColor = UIColor(red:0.1, green:0.5, blue:0.8, alpha:0.82)
                  reloadBtn.layer.cornerRadius = rbS/2
                  reloadBtn.setTitle("🔄", for: .normal)
                  reloadBtn.titleLabel?.font = .systemFont(ofSize:28)
                  reloadBtn.isUserInteractionEnabled = true
                  addSubview(reloadBtn)
                  
                  let cx = bounds.width/2, cy = bounds.height/2
                  let dot = UIView(frame: CGRect(x:cx-2, y:cy-2, width:4, height:4))
                  dot.backgroundColor = .red
                  addSubview(dot)
              }

              func update(ammo: Int, totalAmmo: Int, isReloading: Bool, reloadProgress: Float) {
                  ammoLbl.text = ammo == 0 ? "RELOAD!" : "\(ammo) | \(totalAmmo)"
                  reloadBg.isHidden = !isReloading
                  reloadBar.isHidden = !isReloading
                  if isReloading {
                      UIView.animate(withDuration: 0.1) { self.reloadBar.frame.size.width = 180 * CGFloat(reloadProgress) }
                  }
              }
          }
          SWIFT_EOF

      - name: GameViewController.swift
        run: |
          cat > SV3D/Sources/GameViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit
          import AVFoundation

          class GameViewController: UIViewController, SCNSceneRendererDelegate {
              private var scnView: SCNView!
              private var scene: SCNScene!
              private var playerNode: SCNNode!
              private var playerChar: FBXCharacterNode!
              private var cameraNode: SCNNode!
              
              private var ammo = 30
              private var totalAmmo = 210
              private var isReloading = false
              private var reloadProgress: Float = 0
              private var isShooting = false
              
              private var moveJoystick: JoystickView!
              private var aimJoystick: JoystickView!
              private var hudView: HUDOverlay!
              private var cameraYaw: Float = 0
              private var lastAimPt: CGPoint = .zero
              
              private var reloadTimer: Timer?
              private var reloadStart: Date = Date()

              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupScene()
                  spawnPlayer()
                  setupHUD()
                  setupJoysticks()
              }
              
              private func setupScene() {
                  scnView = SCNView(frame: view.bounds)
                  scnView.backgroundColor = .black
                  view.addSubview(scnView)
                  scene = SCNScene()
                  scnView.scene = scene
                  scnView.delegate = self
                  scnView.isPlaying = true
              }

              private func spawnPlayer() {
                  playerNode = SCNNode()
                  playerChar = FBXCharacterNode()
                  playerNode.addChildNode(playerChar)
                  scene.rootNode.addChildNode(playerNode)
                  
                  cameraNode = SCNNode()
                  cameraNode.camera = SCNCamera()
                  cameraNode.position = SCNVector3(0, 2.5, 5)
                  playerNode.addChildNode(cameraNode)
              }

              private func setupHUD() {
                  hudView = HUDOverlay(frame: view.bounds)
                  hudView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  hudView.isUserInteractionEnabled = true
                  view.addSubview(hudView)
                  
                  hudView.shootBtn.addTarget(self, action: #selector(shootDown), for: .touchDown)
                  hudView.shootBtn.addTarget(self, action: #selector(shootUp), for: [.touchUpInside, .touchUpOutside, .touchCancel])
                  hudView.reloadBtn.addTarget(self, action: #selector(triggerManualReload), for: .touchUpInside)
              }
              
              @objc private func shootDown() { isShooting = true }
              @objc private func shootUp() { isShooting = false }
              
              @objc private func triggerManualReload() {
                  if ammo < 30 && !isReloading && totalAmmo > 0 { reload() }
              }

              private func reload() {
                  guard !isReloading, totalAmmo > 0 else { return }
                  isReloading = true
                  reloadProgress = 0
                  reloadStart = Date()
                  let duration = 1.5
                  
                  reloadTimer = Timer.scheduledTimer(withTimeInterval: 0.05, repeats: true) { [weak self] t in
                      guard let s = self else { t.invalidate(); return }
                      s.reloadProgress = Float(Date().timeIntervalSince(s.reloadStart) / duration)
                      
                      if s.reloadProgress >= 1.0 {
                          t.invalidate()
                          let load = min(30 - s.ammo, s.totalAmmo)
                          s.ammo += load
                          s.totalAmmo -= load
                          s.isReloading = false
                          s.reloadProgress = 0
                      }
                  }
              }

              private func setupJoysticks() {
                  let jR = view.bounds.height * 0.15
                  moveJoystick = JoystickView(radius: jR)
                  moveJoystick.center = CGPoint(x: jR + 30, y: view.bounds.height - jR - 30)
                  view.addSubview(moveJoystick)
                  
                  aimJoystick = JoystickView(radius: jR)
                  aimJoystick.center = CGPoint(x: view.bounds.width - jR - 30, y: view.bounds.height - jR - 30)
                  view.addSubview(aimJoystick)
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if moveJoystick.frame.contains(pt) && moveJoystick.trackingTouch == nil {
                          moveJoystick.trackingTouch = t
                      } else if aimJoystick.frame.contains(pt) && aimJoystick.trackingTouch == nil {
                          aimJoystick.trackingTouch = t; lastAimPt = pt
                      }
                  }
              }
              
              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if t === moveJoystick.trackingTouch { moveJoystick.moveTouch(t, in: view) }
                      else if t === aimJoystick.trackingTouch {
                          aimJoystick.moveTouch(t, in: view)
                          cameraYaw -= Float(pt.x - lastAimPt.x) * 0.005
                          lastAimPt = pt
                      }
                  }
              }
              
              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === moveJoystick.trackingTouch { moveJoystick.reset() }
                      if t === aimJoystick.trackingTouch { aimJoystick.reset() }
                  }
              }
              
              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  DispatchQueue.main.async { [weak self] in
                      guard let s = self else { return }
                      s.hudView.update(ammo: s.ammo, totalAmmo: s.totalAmmo, isReloading: s.isReloading, reloadProgress: s.reloadProgress)
                  }
                  playerChar.eulerAngles.y = cameraYaw
              }
          }
          SWIFT_EOF

      # ── Project Configuration (FIXED INFO.PLIST) ─────────────────────────────
      - name: Generate Xcode Project
        run: |
          cat > SV3D/project.yml << 'YAML_EOF'
          name: ShadowVillage3D
          options: { bundleIdPrefix: com.shadowvillage3d, createIntermediateGroups: true }
          settings:
            base: { SWIFT_VERSION: "5.9", IPHONEOS_DEPLOYMENT_TARGET: "16.0", CODE_SIGN_IDENTITY: "", CODE_SIGNING_REQUIRED: "NO", CODE_SIGNING_ALLOWED: "NO" }
          targets:
            ShadowVillage3D:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [Sources]
              resources: [Resources]
              settings:
                base: { INFOPLIST_FILE: Resources/Info.plist, PRODUCT_NAME: ShadowVillage3D }
              frameworks: [{SDK: SceneKit.framework}, {SDK: UIKit.framework}, {SDK: AVFoundation.framework}]
          YAML_EOF
          
          cat > SV3D/Resources/Info.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.shadowvillage3d.game</string>
              <key>CFBundleExecutable</key>
              <string>ShadowVillage3D</string>
              <key>CFBundleName</key>
              <string>ShadowVillage3D</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          PLIST_EOF

          cd SV3D && xcodegen generate --spec project.yml --project .

      # ── Build & Package ──────────────────────────────────────────────────────
      - name: Build IPA
        run: |
          xcodebuild -project SV3D/ShadowVillage3D.xcodeproj -scheme ShadowVillage3D -configuration Release -sdk iphoneos -destination "generic/platform=iOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build SYMROOT="${{ github.workspace }}/build/sym"
          APP=$(find "${{ github.workspace }}/build/sym" -name "ShadowVillage3D.app" -type d | head -1)
          mkdir -p Payload; cp -r "$APP" Payload/ShadowVillage3D.app
          zip -r ShadowVillage3D-PUBG.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVillage3D-PUBG-Edition
          path: ShadowVillage3D-PUBG.ipa
