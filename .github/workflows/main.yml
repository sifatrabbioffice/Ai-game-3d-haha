                      p.birthRate          = 800
                      p.emissionDuration   = 0.035
                      p.particleLifeSpan   = 0.06
                      p.particleSize       = 0.18
                      p.particleColor      = UIColor(red:1, green:0.88, blue:0.2, alpha:1)
                      p.particleColorVariation = SCNVector4(0.1, 0.1, 0.3, 0)
                      p.blendMode          = .additive
                      p.isLightingEnabled  = false
                      p.emittingDirection  = SCNVector3(0, 0, -1)
                      p.spreadingAngle     = 28
                      p.particleVelocity   = 3.5
                      return p
                  }
                  spawnOnce(ps, at: position, in: scene)
              }

              func spawnBloodSplat(at position: SCNVector3, in scene: SCNScene) {
                  let ps = getOrBuild("blood_splat") {
                      let p = SCNParticleSystem()
                      p.birthRate        = 180
                      p.emissionDuration = 0.10
                      p.particleLifeSpan = 0.45
                      p.particleSize     = 0.07
                      p.particleColor    = UIColor(red:0.75, green:0.02, blue:0.02, alpha:1)
                      p.affectedByGravity = true
                      p.spreadingAngle   = 130
                      p.particleVelocity = 2.8
                      return p
                  }
                  spawnOnce(ps, at: position, in: scene)
              }

              func spawnBulletImpact(at position: SCNVector3, in scene: SCNScene) {
                  let ps = getOrBuild("dust_impact") {
                      let p = SCNParticleSystem()
                      p.birthRate        = 80
                      p.emissionDuration = 0.18
                      p.particleLifeSpan = 0.70
                      p.particleSize     = 0.12
                      p.particleColor    = UIColor(red:0.62, green:0.52, blue:0.36, alpha:0.7)
                      p.affectedByGravity = true
                      p.spreadingAngle   = 90
                      p.particleVelocity = 1.8
                      return p
                  }
                  spawnOnce(ps, at: position, in: scene)
              }

              private func getOrBuild(_ key: String, _ build: () -> SCNParticleSystem) -> SCNParticleSystem {
                  if let cached = cache[key] { return cached.copy() as! SCNParticleSystem }
                  let ps = build(); cache[key] = ps; return ps
              }

              private func spawnOnce(_ ps: SCNParticleSystem, at pos: SCNVector3, in scene: SCNScene) {
                  let node = SCNNode(); node.position = pos
                  node.addParticleSystem(ps)
                  scene.rootNode.addChildNode(node)
                  node.runAction(SCNAction.sequence([
                      SCNAction.wait(duration: 1.5),
                      SCNAction.removeFromParentNode()
                  ]))
              }
          }
