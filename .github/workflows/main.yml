                  weaponIcon.text  = "🔫"; weaponIcon.font = .systemFont(ofSize:22)
                  ammoPanel.addSubview(weaponIcon)

                  ammoLbl.frame         = CGRect(x:44, y:6, width:148, height:34)
                  ammoLbl.text          = "30 | 90"; ammoLbl.textColor = .white
