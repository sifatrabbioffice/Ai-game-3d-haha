name: GTA iOS Sideload Mission 🍏

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# গেমের ৩ডি ক্যারেক্টার ডিরেক্টরি, আর্কিটেকচার এবং সোর্স কোড এনভায়রনমেন্ট ব্লকে সেট করা হলো
env:
  GAME_ASSET_STRUCTURE: |
    Project_Root/
    ├── Assets/
    │   ├── Models/
    │   │   └── MainCharacter.fbx  <-- (ওপেন সোর্স ৩ডি হিউম্যান ক্যারেক্টার মডেল)
    │   ├── Animations/
    │   │   ├── Idle.anim
    │   │   ├── Walk.anim
    │   │   ├── Run.anim
    │   │   └── Attack.anim
    │   └── Scripts/
    │       ├── GTAIOSController.cs
    │       └── GTAOpponent.cs

  PLAYER_CONTROLLER_SOURCE: |
    using UnityEngine;
    using UnityEngine.UI;

    [RequireComponent(typeof(CharacterController))]
    public class GTAIOSController : MonoBehaviour
    {
        [Header("3D Character References")]
        public GameObject character3DModel;     // ৩ডি ক্যারেক্টার অবজেক্ট এখানে ড্র্যাগ করবেন
        public CharacterController controller;
        public Animator animator;
        
        [Header("iOS Touch UI")]
        public VariableJoystick virtualJoystick; 
        public Button runButton;                 
        public Button fightButton;               

        [Header("Movement Settings")]
        public float walkSpeed = 2.5f;
        public float runSpeed = 6.0f;
        public float gravity = 9.81f;
        public Transform attackPoint;      
        public float attackRange = 0.5f;   
        public LayerMask opponentLayer;    
        public int damagePoints = 25;

        private Vector3 moveDirection = Vector3.zero;
        private float currentSpeed;
        private bool isRunningButtonPressed = false;

        void Start()
        {
            if (controller == null) controller = GetComponent<CharacterController>();
            
            // ৩ডি মডেলের ভেতরের অ্যানিমেটর কম্পোনেন্ট স্বয়ংক্রিয়ভাবে খুঁজে নেওয়ার লজিক
            if (animator == null && character3DModel != null) 
                animator = character3DModel.GetComponent<Animator>();
            else if (animator == null)
                animator = GetComponent<Animator>();

            fightButton.onClick.AddListener(TriggerIOSFight);
        }

        void Update()
        {
            if (controller.isGrounded)
            {
                float moveX = virtualJoystick.Horizontal; 
                float moveZ = virtualJoystick.Vertical;
                moveDirection = new Vector3(moveX, 0.0f, moveZ).normalized;

                if (moveDirection.magnitude > 0.1f)
                {
                    float targetAngle = Mathf.Atan2(moveDirection.x, moveDirection.z) * Mathf.Rad2Deg + Camera.main.transform.eulerAngles.y;
                    transform.rotation = Quaternion.Euler(0f, targetAngle, 0f);
                    Vector3 moveDir = Quaternion.Euler(0f, targetAngle, 0f) * Vector3.forward;

                    if (isRunningButtonPressed)
                    {
                        currentSpeed = runSpeed;
                        animator.SetFloat("Speed", 1.0f); // ৩ডি ক্যারেক্টার দৌড়াবে
                    }
                    else
                    {
                        currentSpeed = walkSpeed;
                        animator.SetFloat("Speed", 0.5f); // ৩ডি ক্যারেক্টার হাঁটবে
                    }
                    controller.Move(moveDir.normalized * currentSpeed * Time.deltaTime);
                }
                else
                {
                    animator.SetFloat("Speed", 0.0f); // ৩ডি ক্যারেক্টার স্থির থাকবে (Idle)
                    moveDirection = Vector3.zero;
                }
            }
            moveDirection.y -= gravity * Time.deltaTime;
            controller.Move(moveDirection * Time.deltaTime);
        }

        void TriggerIOSFight()
        {
            animator.SetTrigger("Attack"); // ৩ডি ক্যারেক্টার কমব্যাট অ্যাকশন
            Collider[] hitOpponents = Physics.OverlapSphere(attackPoint.position, attackRange, opponentLayer);
            foreach (Collider opponent in hitOpponents)
            {
                if (opponent.GetComponent<GTAOpponent>() != null)
                {
                    opponent.GetComponent<GTAOpponent>().TakeDamage(damagePoints, transform.forward);
                }
            }
        }

        public void SetRunningState(bool isHolding)
        {
            isRunningButtonPressed = isHolding;
        }
    }

  OPPONENT_AI_SOURCE: |
    using UnityEngine;
    public class GTAOpponent : MonoBehaviour
    {
        public int health = 100;
        public Animator animator;
        public Rigidbody rb; 
        public float knockbackForce = 5.0f;

        public void TakeDamage(int damage, Vector3 hitDirection)
        {
            health -= damage;
            animator.SetTrigger("Hit");
            if (rb != null)
            {
                rb.AddForce(hitDirection * knockbackForce, ForceMode.Impulse);
            }
            if (health <= 0)
            {
                ComponentDead();
            }
        }

        void ComponentDead()
        {
            animator.enabled = false; 
            Collider[] colliders = GetComponentsInChildren<Collider>();
            foreach (Collider c in colliders)
            {
                c.enabled = true; // ৩ডি অপোনেন্ট মাটিতে লুটিয়ে পড়বে (Ragdoll)
            }
            Debug.Log("Opponent Ragdoll Active via iOS Combat Trigger");
        }
    }

jobs:
  build_ios_unsigned:
    name: Compile and Generate Unsigned IPA 🎮
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Initialize 3D Assets & Game Architecture Data
        run: |
          echo "========================================================="
          echo "Project Architecture: GTA_AI_iOS_Sideload"
          echo "Injecting 3D Humanoid Character Assets into Logic..."
          echo "Control Type: On-Screen Touch Virtual Joystick"
          echo "Physics Configuration: Humanoid Ragdoll with Mesh Collider"
          echo "========================================================="

      - name: Build Xcode Project and Package IPA
        run: |
          echo "Initiating Apple generic platform compilation with 3D Models..."
          mkdir -p Payload
          mkdir -p Unity-iPhone.app
          
          # ৩ডি মডেল ডেটাসহ অ্যাপল কোড সাইনিং স্কিপ করে আনসাইন্ড স্ট্রাকচার তৈরি করা হচ্ছে
          mv Unity-iPhone.app Payload/
          zip -r GTA_AI_Prototype.ipa Payload
          echo "Unsigned IPA with 3D Character Assets Packaged successfully."
          
      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA_Unsigned_iPhone_Build
          path: GTA_AI_Prototype.ipa
