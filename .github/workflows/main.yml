      # ── AppIcon ───────────────────────────────────────────────────────────────
      - name: Generate AppIcon
        run: |
          cat > SV3D/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024", "filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          cat > SV3D/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib
          def png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      row += [20, 22, 28]
                  rows.append(bytes(row))
              raw  = zlib.compress(b''.join(rows), 9)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = u32(w) + u32(h) + bytes([8, 2, 0, 0, 0])
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          with open('SV3D/Resources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb') as f:
              f.write(png(1024, 1024))
          PYEOF

      # ── XcodeGen ─────────────────────────────────────────────────────────────
      - name: Generate Xcode Project
        working-directory: SV3D
        run: xcodegen generate --spec project.yml --project .

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SV3D/ShadowVillage3D.xcodeproj \
            -scheme ShadowVillage3D \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || exit 1

      # ── Package IPA ───────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "ShadowVillage3D.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/ShadowVillage3D.app
          zip -r ShadowVillage3D.ipa Payload

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVillage3D-HighRes
          path: ShadowVillage3D.ipa
          retention-days: 14
