              required init?(coder: NSCoder) { fatalError() }

              // MARK: – External model loader (USDZ / SCN)
              private func tryLoadExternal() -> Bool {
                  let names = ["soldier_base", "character", "human"]
                  for name in names {
                      if let url = Bundle.main.url(forResource: name, withExtension: "usdz") ??
                                   Bundle.main.url(forResource: name, withExtension: "scn") {
                          if let scene = try? SCNScene(url: url, options: nil) {
                              let root = scene.rootNode.clone()
                              addChildNode(root)
                              // Wire up animation joints if skeleton found
                              headNode     = root.childNode(withName: "Head",     recursively: true) ?? root
                              chestNode    = root.childNode(withName: "Chest",    recursively: true) ?? root
                              leftThigh    = root.childNode(withName: "LeftUpLeg",  recursively: true)
                              rightThigh   = root.childNode(withName: "RightUpLeg", recursively: true)
                              leftUpperArm = root.childNode(withName: "LeftArm",    recursively: true)
                              rightUpperArm = root.childNode(withName: "RightArm",  recursively: true)
                              buildWeapon()
                              print("✅ Loaded external model: \(name)")
