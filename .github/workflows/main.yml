          import SceneKit
          import UIKit

          class ParticleManager {
              static let shared = ParticleManager()
              private var cache: [String: SCNParticleSystem] = [:]

              func spawnMuzzleFlash(at position: SCNVector3, in scene: SCNScene) {
                  let ps = getOrBuild("muzzle_flash") {
