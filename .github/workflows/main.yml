              var rightUpperArm: SCNNode!
              var rightForeArm : SCNNode!
              var leftThigh    : SCNNode!
              var leftShin     : SCNNode!
              var leftFoot     : SCNNode!
              var rightThigh   : SCNNode!
              var rightShin    : SCNNode!
              var rightFoot    : SCNNode!
              var weaponSocket : SCNNode!

              var animTime: Float = 0

              // MARK: – Materials
              private func mat(_ color: UIColor, rough: Double = 0.85, metal: Double = 0.0) -> SCNMaterial {
                  let m = SCNMaterial()
                  m.diffuse.contents   = color
                  m.roughness.contents = rough
                  m.metalness.contents = metal
                  m.lightingModel      = .physicallyBased
                  return m
              }

              private lazy var skinMat     : SCNMaterial = mat(UIColor(red:0.88, green:0.72, blue:0.60, alpha:1))
              private lazy var jacketMat   : SCNMaterial = mat(UIColor(red:0.28, green:0.35, blue:0.22, alpha:1), rough:0.92)
              private lazy var pantsMat    : SCNMaterial = mat(UIColor(red:0.22, green:0.26, blue:0.16, alpha:1), rough:0.90)
              private lazy var bootMat     : SCNMaterial = mat(UIColor(red:0.12, green:0.10, blue:0.08, alpha:1), rough:0.80)
              private lazy var vestMat     : SCNMaterial = mat(UIColor(red:0.20, green:0.22, blue:0.14, alpha:1), rough:0.88)
              private lazy var helmetMat   : SCNMaterial = mat(UIColor(red:0.18, green:0.20, blue:0.12, alpha:1), rough:0.70, metal:0.15)
              private lazy var eyeWhiteMat : SCNMaterial = mat(UIColor.white, rough:0.5)
              private lazy var eyePupilMat : SCNMaterial = mat(UIColor(red:0.06, green:0.05, blue:0.03, alpha:1), rough:0.3, metal:0.1)
              private lazy var gunMetalMat : SCNMaterial = mat(UIColor(red:0.12, green:0.13, blue:0.14, alpha:1), rough:0.38, metal:0.85)
              private lazy var gunStockMat : SCNMaterial = mat(UIColor(red:0.22, green:0.15, blue:0.10, alpha:1), rough:0.80)

              // MARK: – Build helpers
              private func capsuleNode(_ capR: CGFloat, _ h: CGFloat, _ mats: [SCNMaterial],
                                       pos: SCNVector3, pivot: SCNVector3? = nil) -> SCNNode {
                  let geo = SCNCapsule(capRadius: capR, height: h)
                  geo.materials = mats
                  let n = SCNNode(geometry: geo)
                  n.position = pos
                  if let piv = pivot { n.pivot = SCNMatrix4MakeTranslation(piv.x, piv.y, piv.z) }
                  return n
              }
              private func boxNode(_ w: CGFloat, _ h: CGFloat, _ d: CGFloat, _ mats: [SCNMaterial],
                                   pos: SCNVector3, pivot: SCNVector3? = nil) -> SCNNode {
                  let geo = SCNBox(width: w, height: h, length: d, chamferRadius: w * 0.08)
                  geo.materials = mats
                  let n = SCNNode(geometry: geo)
                  n.position = pos
                  if let piv = pivot { n.pivot = SCNMatrix4MakeTranslation(piv.x, piv.y, piv.z) }
                  return n
              }
              private func sphereNode(_ r: CGFloat, _ mats: [SCNMaterial], pos: SCNVector3) -> SCNNode {
                  let geo = SCNSphere(radius: r)
                  geo.materials = mats
                  let n = SCNNode(geometry: geo)
                  n.position = pos
                  return n
              }
              private func cylNode(_ r: CGFloat, _ h: CGFloat, _ mats: [SCNMaterial],
                                   pos: SCNVector3, pivot: SCNVector3? = nil) -> SCNNode {
                  let geo = SCNCylinder(radius: r, height: h)
                  geo.materials = mats
                  let n = SCNNode(geometry: geo)
                  n.position = pos
                  if let piv = pivot { n.pivot = SCNMatrix4MakeTranslation(piv.x, piv.y, piv.z) }
                  return n
              }

              // MARK: – Init
              override init() {
