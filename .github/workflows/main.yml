name: 🎮 Shadow Village 3D – Ultra High-Graphics Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Ultra High-Res Game IPA
    runs-on: macos-14
    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure Xcode Environment
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Development Packages
        run: |
          brew install xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Construct High-End Game Directories
        run: |
          mkdir -p SV3D_Engine/Sources
          mkdir -p SV3D_Engine/Resources/Assets.xcassets/AppIcon.appiconset

      # ── Engine Core Configurations & Layer Control ──────────────────────────
      - name: Create Engine Types Definitions
        run: |
          cat > SV3D_Engine/Sources/Types.swift << 'SWIFT_EOF'
          import UIKit

          struct PhysicsMask {
              static let none:   Int = 0
              static let player: Int = 1 << 0
              static let enemy:  Int = 1 << 1
              static let bullet: Int = 1 << 2
              static let wall:   Int = 1 << 3
              static let ground: Int = 1 << 4
          }

          enum EnemyClass {
              case wildman, brute, phantom, boss

              var maxHealth: Float {
                  switch self {
                  case .wildman: return 180
                  case .brute:   return 450
                  case .phantom: return 120
                  case .boss:    return 2500
                  }
              }
              var movementSpeed: Float {
                  switch self {
                  case .wildman: return 2.8
                  case .brute:   return 1.4
                  case .phantom: return 4.2
                  case .boss:    return 2.0
                  }
              }
              var attackPower: Float {
                  switch self {
                  case .wildman: return 18
                  case .brute:   return 40
                  case .phantom: return 12
                  case .boss:    return 65
                  }
              }
              var strikingRange: Float {
                  return self == .boss ? 2.5 : 1.2
              }
              var modelScale: Float {
                  switch self {
                  case .wildman: return 1.1
                  case .brute:   return 1.6
                  case .phantom: return 0.9
                  case .boss:    return 3.2
                  }
              }
          }
          SWIFT_EOF

      # ── UI/HUD Layer (AAA Tactical Style Overlay) ───────────────────────────
      - name: Create Immersive HUD Subsystem
          run: |
          cat > SV3D_Engine/Sources/HUDOverlay.swift << 'SWIFT_EOF'
          import UIKit

          class HUDOverlay: UIView {
              private let hpContainer = UIView()
              private let hpIndicator = UIView()
              private let statLabel   = UILabel()
              private let roundLabel  = UILabel()
              private(set) var fireControl = UIButton(type: .custom)

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  isUserInteractionEnabled = false
                  initializeGraphicsHUD()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func initializeGraphicsHUD() {
                  hpContainer.frame = CGRect(x: 24, y: 20, width: 224, height: 18)
                  hpContainer.backgroundColor = UIColor(white: 0.1, alpha: 0.8)
                  hpContainer.layer.cornerRadius = 4
                  addSubview(hpContainer)

                  hpIndicator.frame = CGRect(x: 26, y: 22, width: 220, height: 14)
                  hpIndicator.backgroundColor = UIColor(red: 0.15, green: 0.75, blue: 0.15, alpha: 1)
                  hpIndicator.layer.cornerRadius = 3
                  addSubview(hpIndicator)

                  statLabel.frame = CGRect(x: bounds.width - 200, y: 20, width: 176, height: 24)
                  statLabel.autoresizingMask = [.flexibleLeftMargin]
                  statLabel.text = "AMMO: 30 / 90"
                  statLabel.textColor = .white
                  statLabel.font = UIFont(name: "Courier-Bold", size: 18)
                  statLabel.textAlignment = .right
                  addSubview(statLabel)

                  roundLabel.frame = CGRect(x: 0, y: 20, width: bounds.width, height: 30)
                  roundLabel.autoresizingMask = [.flexibleWidth]
                  roundLabel.text = "DISTRICT ALPHA"
                  roundLabel.textColor = UIColor(red: 0.9, green: 0.1, blue: 0.1, alpha: 1)
                  roundLabel.font = UIFont(name: "HelveticaNeue-CondensedBold", size: 22)
                  roundLabel.textAlignment = .center
                  addSubview(roundLabel)

                  let triggerSize: CGFloat = 80
                  fireControl.frame = CGRect(x: bounds.width - triggerSize - 40, y: bounds.height - triggerSize - 40, width: triggerSize, height: triggerSize)
                  fireControl.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  fireControl.backgroundColor = UIColor(red: 0.8, green: 0.1, blue: 0.1, alpha: 0.6)
                  fireControl.layer.cornerRadius = triggerSize / 2
                  fireControl.layer.borderWidth = 3
                  fireControl.layer.borderColor = UIColor.white.cgColor
                  fireControl.setTitle("FIRE", for: .normal)
                  fireControl.titleLabel?.font = UIFont.boldSystemFont(ofSize: 16)
                  fireControl.isUserInteractionEnabled = true
                  addSubview(fireControl)
              }

              func refreshMatrix(health: Float, currentAmmo: Int, reserveAmmo: Int) {
                  let ratio = CGFloat(max(0, health / 100.0))
                  UIView.animate(withDuration: 0.1) {
                      self.hpIndicator.frame.size.width = 220 * ratio
                  }
                  statLabel.text = "AMMO: \(currentAmmo) / \(reserveAmmo)"
              }
          }
          SWIFT_EOF

      # ── Input System (Dual Axis Vector Joysticks) ───────────────────────────
      - name: Create Vector Input Engine
        run: |
          cat > SV3D_Engine/Sources/JoystickView.swift << 'SWIFT_EOF'
          import UIKit

          class JoystickView: UIView {
              private let basePlate = UIView()
              private let controlStick = UIView()
              let boundaryRadius: CGFloat
              var vectorAxis: SIMD2<Float> = .zero
              var isTracking: Bool = false
              weak var linkedTouch: UITouch?

              init(radius: CGFloat) {
                  self.boundaryRadius = radius
                  super.init(frame: CGRect(x: 0, y: 0, width: radius * 2, height: radius * 2))
                  isUserInteractionEnabled = false
                  alpha = 0.6

                  basePlate.frame = bounds
                  basePlate.layer.cornerRadius = radius
                  basePlate.backgroundColor = UIColor(white: 0.2, alpha: 0.4)
                  basePlate.layer.borderColor = UIColor.white.cgColor
                  basePlate.layer.borderWidth = 2
                  addSubview(basePlate)

                  let coreSize = radius * 0.4
                  controlStick.frame = CGRect(x: radius - coreSize, y: radius - coreSize, width: coreSize * 2, height: coreSize * 2)
                  controlStick.layer.cornerRadius = coreSize
                  controlStick.backgroundColor = UIColor.white
                  addSubview(controlStick)
              }
              required init?(coder: NSCoder) { fatalError() }

              func trackInput(touch: UITouch, hostView: UIView) {
                  let location = touch.location(in: hostView)
                  let deltaX = Float(location.x - frame.midX)
                  let deltaY = Float(location.y - frame.midY)
                  let distance = sqrt(deltaX * deltaX + deltaY * deltaY)
                  let limit = Float(boundaryRadius)
                  
                  let scaleFactor = distance <= limit ? 1.0 : limit / distance
                  controlStick.center = CGPoint(x: boundaryRadius + CGFloat(deltaX * scaleFactor), y: boundaryRadius + CGFloat(deltaY * scaleFactor))
                  vectorAxis = SIMD2<Float>(deltaX * scaleFactor / limit, deltaY * scaleFactor / limit)
                  isTracking = distance > limit * 0.1
              }

              func clearVector() {
                  controlStick.center = CGPoint(x: boundaryRadius, y: boundaryRadius)
                  vectorAxis = .zero
                  isTracking = false
                  linkedTouch = nil
              }
          }
          SWIFT_EOF

      # ── AI Monster Node Module (PBR Fallback + Custom Loader) ───────────────
      - name: Create Character & Enemy Rig Engine
        run: |
          cat > SV3D_Engine/Sources/EnemyNode.swift << 'SWIFT_EOF'
          import SceneKit
          import UIKit

          class EnemyNode: SCNNode {
              let enemyClass: EnemyClass
              var hitPoints:  Float
              var isAlive:    Bool = true
              var previousAttackTimestamp: TimeInterval = 0
              private var meshRigNode: SCNNode?

              init(enemyClass: EnemyClass) {
                  self.enemyClass = enemyClass
                  self.hitPoints  = enemyClass.maxHealth
                  super.init()
                  mountGraphicAssets()
                  compilePhysicsRig()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func mountGraphicAssets() {
                  let modelIdentifier: String
                  switch enemyClass {
                  case .wildman: modelIdentifier = "wildman_mesh"
                  case .brute:   modelIdentifier = "brute_mesh"
                  case .phantom: modelIdentifier = "phantom_mesh"
                  case .boss:    modelIdentifier = "boss_mesh"
                  }

                  if let loadedScene = SCNScene(named: "Resources/\(modelIdentifier).fbx") ?? SCNScene(named: "Resources/\(modelIdentifier).scn") {
                      let extractionNode = SCNNode()
                      for component in loadedScene.rootNode.childNodes {
                          extractionNode.addChildNode(component)
                      }
                      let renderScale = enemyClass.modelScale
                      extractionNode.scale = SCNVector3(renderScale, renderScale, renderScale)
                      self.meshRigNode = extractionNode
                      addChildNode(extractionNode)
                  } else {
                      // High-Quality Procedural Mesh Generator (If external assets are not baked yet)
                      let highPolyCapsule = SCNCapsule(capRadius: 0.4, height: 1.8)
                      let customMaterial = SCNMaterial()
                      customMaterial.lightingModel = .physicallyBased
                      customMaterial.diffuse.contents = UIColor.darkGray
                      customMaterial.metalness.contents = CGFloat(0.8)
                      customMaterial.roughness.contents = CGFloat(0.2)
                      highPolyCapsule.materials = [customMaterial]
                      
                      let backupNode = SCNNode(geometry: highPolyCapsule)
                      backupNode.position = SCNVector3(0, 0.9, 0)
                      let renderScale = enemyClass.modelScale
                      backupNode.scale = SCNVector3(renderScale, renderScale, renderScale)
                      self.meshRigNode = backupNode
                      addChildNode(backupNode)
                  }
              }

              private func compilePhysicsRig() {
                  let colliderShape = SCNPhysicsShape(geometry: SCNCapsule(capRadius: 0.4, height: 1.8), options: nil)
                  let rigidBody = SCNPhysicsBody(type: .kinematic, shape: colliderShape)
                  rigidBody.categoryBitMask = PhysicsMask.enemy
                  rigidBody.contactTestBitMask = PhysicsMask.bullet | PhysicsMask.player
                  self.physicsBody = rigidBody
              }

              func evaluateDamage(_ volume: Float) {
                  guard isAlive else { return }
                  hitPoints -= volume
                  triggerImpactFlash()
                  if hitPoints <= 0 { executeTerminationSequence() }
              }

              private func triggerImpactFlash() {
                  let flash = SCNAction.sequence([
                      SCNAction.run { node in node.geometry?.firstMaterial?.emission.contents = UIColor.red },
                      SCNAction.wait(duration: 0.05),
                      SCNAction.run { node in node.geometry?.firstMaterial?.emission.contents = UIColor.clear }
                  ])
                  meshRigNode?.runAction(flash)
              }

              private func executeTerminationSequence() {
                  isAlive = false
                  physicsBody = nil
                  runAction(SCNAction.sequence([
                      SCNAction.group([
                          SCNAction.moveBy(x: 0, y: -0.5, z: 0, duration: 0.3),
                          SCNAction.fadeOut(duration: 0.3)
                      ]),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              func executeAILogicLoop(targetMatrix: SCNVector3, executionDelta: Float) {
                  guard isAlive else { return }
                  let vectorX = targetMatrix.x - position.x
                  let vectorZ = targetMatrix.z - position.z
                  let magnitude = sqrt(vectorX * vectorX + vectorZ * vectorZ)
                  
                  if magnitude > enemyClass.strikingRange {
                      let normalizedSpeed = enemyClass.movementSpeed * executionDelta
                      position.x += (vectorX / magnitude) * normalizedSpeed
                      position.z += (vectorZ / magnitude) * normalizedSpeed
                      eulerAngles.y = atan2(vectorX, vectorZ)
                  }
              }
          }
          SWIFT_EOF

      # ── Main Game Runtime Engine Controller (AAA High Fidelity Simulation) ──
      - name: Create Master Engine Controller
        run: |
          cat > SV3D_Engine/Sources/GameViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class GameViewController: UIViewController, SCNSceneRendererDelegate, SCNPhysicsContactDelegate {
              private var graphicView: SCNView!
              private var masterScene: SCNScene!
              
              private var primePlayerNode: SCNNode!
              private var playerMeshContainer: SCNNode!
              private var auxiliaryCameraArm:  SCNNode!
              private var primaryRenderCamera: SCNNode!

              private var userHealth: Float = 100.0
              private var currentClipAmmo = 30
              private var tacticalReserveAmmo = 90
              private var isSystemReloading = false
              
              private var navigationJoystick: JoystickView!
              private var headsUpDisplay: HUDOverlay!
              private var systemFrameDelta: TimeInterval = 0
              private var isWeaponEngaged = false
              private var orientationYaw: Float = 0
              
              private var activeEnemyMatrix: [EnemyNode] = []

              override func viewDidLoad() {
                  super.viewDidLoad()
                  initializeHardwareViewport()
                  generateEnvironmentGeometry()
                  instantiateHighEndPlayer()
                  initializeTacticalCamera()
                  assembleInterfaceLayers()
              }

              override var prefersStatusBarHidden: Bool { return true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { return .landscape }

              private func initializeHardwareViewport() {
                  graphicView = SCNView(frame: view.bounds)
                  graphicView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  graphicView.backgroundColor = .black
                  graphicView.antialiasingMode = .multisampling4X
                  graphicView.preferredFramesPerSecond = 60
                  view.addSubview(graphicView)

                  masterScene = SCNScene()
                  masterScene.physicsWorld.contactDelegate = self
                  graphicView.scene = masterScene
                  graphicView.delegate = self
                  graphicView.isPlaying = true
              }

              private func generateEnvironmentGeometry() {
                  // Advanced High Fidelity Floor Generation
                  let landscapeFloor = SCNFloor()
                  let textureMaterial = SCNMaterial()
                  textureMaterial.lightingModel = .physicallyBased
                  textureMaterial.diffuse.contents = UIColor(white: 0.15, alpha: 1.0)
                  textureMaterial.roughness.contents = CGFloat(0.4)
                  landscapeFloor.materials = [textureMaterial]
                  
                  let floorNode = SCNNode(geometry: landscapeFloor)
                  floorNode.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                  floorNode.physicsBody?.categoryBitMask = PhysicsMask.ground
                  masterScene.rootNode.addChildNode(floorNode)

                  // Volumetric Atmospheric Environmental Configurations
                  masterScene.fogColor = UIColor(white: 0.05, alpha: 1.0)
                  masterScene.fogStartDistance = 10.0
                  masterScene.fogEndDistance = 45.0

                  // Intense Directional Light Array (Sun/Moon Simulation)
                  let globalLight = SCNLight()
                  globalLight.type = .directional
                  globalLight.intensity = 1200
                  globalLight.color = UIColor(red: 0.8, green: 0.85, blue: 1.0, alpha: 1)
                  
                  let lightRig = SCNNode()
                  lightRig.light = globalLight
                  lightRig.eulerAngles = SCNVector3(-0.8, 0.5, 0)
                  masterScene.rootNode.addChildNode(lightRig)
              }

              private func instantiateHighEndPlayer() {
                  primePlayerNode = SCNNode()
                  primePlayerNode.position = SCNVector3(0, 0, 0)

                  playerMeshContainer = SCNNode()
                  primePlayerNode.addChildNode(playerMeshContainer)

                  if let characterScene = SCNScene(named: "Resources/player_character.fbx") ?? SCNScene(named: "Resources/player_character.scn") {
                      let coreModel = SCNNode()
                      for nodeComponent in characterScene.rootNode.childNodes {
                          coreModel.addChildNode(nodeComponent)
                      }
                      playerMeshContainer.addChildNode(coreModel)
                  } else {
                      let proceduralBox = SCNBox(width: 0.6, height: 1.8, length: 0.6, chamferRadius: 0.1)
                      let meshMaterial = SCNMaterial()
                      meshMaterial.lightingModel = .physicallyBased
                      meshMaterial.diffuse.contents = UIColor.systemBlue
                      proceduralBox.materials = [meshMaterial]
                      
                      let standaloneMesh = SCNNode(geometry: proceduralBox)
                      standaloneMesh.position = SCNVector3(0, 0.9, 0)
                      playerMeshContainer.addChildNode(standaloneMesh)
                  }

                  let bodyCapsule = SCNPhysicsShape(geometry: SCNCapsule(capRadius: 0.4, height: 1.8), options: nil)
                  let kinematicRig = SCNPhysicsBody(type: .kinematic, shape: bodyCapsule)
                  kinematicRig.categoryBitMask = PhysicsMask.player
                  primePlayerNode.physicsBody = kinematicRig
                  masterScene.rootNode.addChildNode(primePlayerNode)
              }

              private func initializeTacticalCamera() {
                  auxiliaryCameraArm = SCNNode()
                  auxiliaryCameraArm.position = SCNVector3(0, 1.6, 0)
                  primePlayerNode.addChildNode(auxiliaryCameraArm)

                  primaryRenderCamera = SCNNode()
                  let optics = SCNCamera()
                  optics.fieldOfView = 65
                  optics.zFar = 150
                  primaryRenderCamera.camera = optics
                  primaryRenderCamera.position = SCNVector3(0, 2.0, 5.0)
                  primaryRenderCamera.eulerAngles = SCNVector3(-0.2, 0, 0)
                  auxiliaryCameraArm.addChildNode(primaryRenderCamera)
                  graphicView.pointOfView = primaryRenderCamera
              }

              private func assembleInterfaceLayers() {
                  headsUpDisplay = HUDOverlay(frame: view.bounds)
                  headsUpDisplay.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  view.addSubview(headsUpDisplay)

                  headsUpDisplay.fireControl.addTarget(self, action: #selector(engageWeaponTrigger), for: .touchDown)
                  headsUpDisplay.fireControl.addTarget(self, action: #selector(disengageWeaponTrigger), for: [.touchUpInside, .touchUpOutside, .touchCancel])

                  let joystickMetrics = view.bounds.height * 0.15
                  navigationJoystick = JoystickView(radius: joystickMetrics)
                  navigationJoystick.center = CGPoint(x: joystickMetrics + 40, y: view.bounds.height - joystickMetrics - 40)
                  view.addSubview(navigationJoystick)
                  
                  // Spawn Wildman Team Instantly
                  executeMonsterDeployment()
              }

              @objc private func engageWeaponTrigger() { isWeaponEngaged = true }
              @objc private func disengageWeaponTrigger() { isWeaponEngaged = false }

              private func executeMonsterDeployment() {
                  for offsetIndex in 0..<3 {
                      let spawnDistance = Float(12 + (offsetIndex * 4))
                      let spawnPosition = SCNVector3(sin(Float(offsetIndex)) * spawnDistance, 0, -cos(Float(offsetIndex)) * spawnDistance)
                      let monsterUnit = EnemyNode(enemyClass: .wildman)
                      monsterUnit.position = spawnPosition
                      masterScene.rootNode.addChildNode(monsterUnit)
                      activeEnemyMatrix.append(monsterUnit)
                  }
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for interactionTouch in touches {
                      let rawCoordinates = interactionTouch.location(in: view)
                      if navigationJoystick.frame.contains(rawCoordinates) && navigationJoystick.linkedTouch == nil {
                          navigationJoystick.linkedTouch = interactionTouch
                      }
                  }
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for interactionTouch in touches {
                      if interactionTouch === navigationJoystick.linkedTouch {
                          navigationJoystick.trackInput(touch: interactionTouch, hostView: view)
                      }
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for interactionTouch in touches {
                      if interactionTouch === navigationJoystick.linkedTouch { navigationJoystick.clearVector() }
                  }
              }

              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  let runtimeDelta = systemFrameDelta == 0 ? 0 : Float(min(time - systemFrameDelta, 0.033))
                  systemFrameDelta = time

                  processPlayerVectorMovement(runtimeDelta: runtimeDelta)
                  processAIExecutionLoop(runtimeDelta: runtimeDelta)
                  
                  if isWeaponEngaged { processBallisticDischarge(currentTime: time) }

                  DispatchQueue.main.async { [weak self] in
                      guard let engine = self else { return }
                      engine.headsUpDisplay.refreshMatrix(health: engine.userHealth, currentAmmo: engine.currentClipAmmo, reserveAmmo: engine.tacticalReserveAmmo)
                  }
              }

              private func processPlayerVectorMovement(runtimeDelta: Float) {
                  let motionVector = navigationJoystick.vectorAxis
                  let rawMagnitude = sqrt(motionVector.x * motionVector.x + motionVector.y * motionVector.y)
                  guard rawMagnitude > 0.1 else { return }

                  let movementVelocity: Float = 5.5
                  let forwardDirection = SIMD3<Float>(-sin(orientationYaw), 0, -cos(orientationYaw))
                  let lateralDirection = SIMD3<Float>(cos(orientationYaw), 0, -sin(orientationYaw))
                  
                  let integratedHeading = forwardDirection * (-motionVector.y) + lateralDirection * motionVector.x
                  let targetTranslation = integratedHeading * movementVelocity * runtimeDelta
                  
                  primePlayerNode.simdPosition += targetTranslation
                  playerMeshContainer.eulerAngles.y = atan2(integratedHeading.x, integratedHeading.z)
              }

              private func processAIExecutionLoop(runtimeDelta: Float) {
                  activeEnemyMatrix = activeEnemyMatrix.filter { $0.parent != nil && $0.isAlive }
                  for enemyUnit in activeEnemyMatrix {
                      enemyUnit.executeAILogicLoop(targetMatrix: primePlayerNode.position, executionDelta: runtimeDelta)
                  }
              }

              private func processBallisticDischarge(currentTime: TimeInterval) {
                  guard currentClipAmmo > 0, !isSystemReloading else { return }
                  currentClipAmmo -= 1
                  
                  let flashCapsule = SCNCapsule(capRadius: 0.05, height: 0.4)
                  let luminousMaterial = SCNMaterial()
                  luminousMaterial.emission.contents = UIColor.yellow
                  flashCapsule.materials = [luminousMaterial]
                  
                  let ballisticNode = SCNNode(geometry: flashCapsule)
                  ballisticNode.position = SCNVector3(primePlayerNode.position.x, 1.4, primePlayerNode.position.z)
                  
                  let internalBody = SCNPhysicsBody(type: .dynamic, shape: nil)
                  internalBody.categoryBitMask = PhysicsMask.bullet
                  internalBody.contactTestBitMask = PhysicsMask.enemy
                  internalBody.isAffectedByGravity = false
                  
                  let forwardHeadingX = -sin(playerMeshContainer.eulerAngles.y)
                  let forwardHeadingZ = -cos(playerMeshContainer.eulerAngles.y)
                  internalBody.velocity = SCNVector3(forwardHeadingX * 45, 0, forwardHeadingZ * 45)
                  
                  ballisticNode.physicsBody = internalBody
                  masterScene.rootNode.addChildNode(ballisticNode)
              }

              func physicsWorld(_ world: SCNPhysicsWorld, didBegin contact: SCNPhysicsContact) {
                  let identityA = contact.nodeA
                  let identityB = contact.nodeB
                  
                  let categoryA = identityA.physicsBody?.categoryBitMask ?? 0
                  let categoryB = identityB.physicsBody?.categoryBitMask ?? 0

                  if (categoryA == PhysicsMask.bullet && categoryB == PhysicsMask.enemy) ||
                     (categoryB == PhysicsMask.bullet && categoryA == PhysicsMask.enemy) {
                      let dynamicBullet = categoryA == PhysicsMask.bullet ? identityA : identityB
                      let impactedEnemy = (categoryA == PhysicsMask.enemy ? identityA : identityB) as? EnemyNode
                      
                      dynamicBullet.removeFromParentNode()
                      impactedEnemy?.evaluateDamage(35)
                  }
              }
          }
          SWIFT_EOF

      # ── Application Main Delegate ───────────────────────────────────────────
      - name: Create App Main Controller Delegate
        run: |
          cat > SV3D_Engine/Sources/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = GameViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

      # ── Project Declarative Model Specification (XcodeGen Spec) ──────────────
      - name: Create Declarative Specification Blueprint
        run: |
          cat > SV3D_Engine/project.yml << 'YAML_EOF'
          name: ShadowVillage3D
          options:
            bundleIdPrefix: com.shadowvillage3d
            createIntermediateGroups: true
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.9"
              PRODUCT_BUNDLE_IDENTIFIER: com.shadowvillage3d.game
              TARGETED_DEVICE_FAMILY: "1"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
          targets:
            ShadowVillage3D:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              resources:
                - path: Resources
              frameworks:
                - SDK: SceneKit.framework
                - SDK: UIKit.framework
          YAML_EOF

      # ── App Manifest Plist Structure ────────────────────────────────────────
      - name: Create Application Parameter Configurations
        run: |
          cat > SV3D_Engine/Resources/Info.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key><string>ShadowVillage3D</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
          </dict>
          </plist>
          PLIST_EOF

      # ── Asset Management & Icon Render Subsystem ────────────────────────────
      - name: Construct Application Structural Icon Spec
        run: |
          cat > SV3D_Engine/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024", "filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib
          def png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              rows = [bytes([0] + [25, 25, 35] * w) for _ in range(h)]
              raw  = zlib.compress(b''.join(rows), 9)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', u32(w) + u32(h) + bytes([8, 2, 0, 0, 0])) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          with open('SV3D_Engine/Resources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb') as f: f.write(png(1024, 1024))
          PYEOF

      # ── Project Compilation & Execution ─────────────────────────────────────
      - name: Execute Project Structural Assembly
        working-directory: SV3D_Engine
        run: xcodegen generate --spec project.yml --project .

      - name: Compile Application (Unsigned Release Target)
        run: |
          set -o pipefail
          xcodebuild \
            -project SV3D_Engine/ShadowVillage3D.xcodeproj \
            -scheme ShadowVillage3D \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log | xcpretty || \
            (echo "=== BUILD ERROR INTERCEPT ===" && grep "error:" build.log | head -n 30 && exit 1)

      - name: Package Binary into Consolidated IPA File
        run: |
          APP_PATH=$(find "${{ github.workspace }}/build/sym" -name "ShadowVillage3D.app" -type d | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/ShadowVillage3D.app
          zip -r ShadowVillage3D_UltraEngine.ipa Payload

      - name: Export Master Engine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVillage3D-HighResEngine
          path: ShadowVillage3D_UltraEngine.ipa
          retention-days: 14
