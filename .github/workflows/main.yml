      # ── AppIcon ───────────────────────────────────────────────────────────────
      - name: Generate AppIcon
        run: |
          cat > SV3D/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024","filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          cat > SV3D/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib, math, random
          def png(w, h):
              random.seed(99)
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d))+t+d+u32(zlib.crc32(t+d)&0xffffffff)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      cx, cy = x - w//2, y - h//2
                      dist = math.sqrt(cx*cx + cy*cy)
                      # Dark military background
                      r = max(0, int(12 - dist*0.008))
                      g = max(0, int(8  - dist*0.005))
                      b = max(0, int(6  - dist*0.004))
                      # Soldier silhouette
                      sx, sy = cx / (w*0.5), cy / (h*0.5)
                      # Head
                      if math.sqrt(sx**2 + (sy+0.45)**2) < 0.10:
                          r,g,b = 210, 175, 145
                      # Helmet
                      elif math.sqrt(sx**2 + (sy+0.52)**2) < 0.115 and sy < -0.40:
                          r,g,b = 45, 58, 32
                      # Body/torso
                      elif abs(sx) < 0.14 and -0.40 < sy < 0.02:
                          r,g,b = 58, 72, 42
                      # Arms
                      elif 0.13 < abs(sx) < 0.22 and -0.35 < sy < -0.05:
                          r,g,b = 50, 62, 36
                      # Legs
                      elif abs(sx) < 0.10 and 0.02 < sy < 0.48:
                          r,g,b = 38, 48, 28
                      # Weapon barrel
                      elif -0.38 < sx < -0.14 and -0.22 < sy < -0.18:
                          r,g,b = 22, 22, 24
                      # Blood moon / red circle bg
                      elif 0.60 < dist/(w*0.5) < 0.72:
                          intensity = 1 - abs(dist/(w*0.5) - 0.66)/0.06
                          r = int(r + 180*intensity)
                          g = int(g + 15*intensity)
                          b = int(b + 8*intensity)
                      # Noise grain
                      r = min(255, r + random.randint(-4, 4))
                      g = min(255, max(0, g + random.randint(-3, 3)))
                      b = min(255, max(0, b + random.randint(-2, 2)))
                      row += [r, g, b]
                  rows.append(bytes(row))
              raw = zlib.compress(b''.join(rows), 6)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = u32(w)+u32(h)+bytes([8,2,0,0,0])
              return sig+chunk(b'IHDR',ihdr)+chunk(b'IDAT',raw)+chunk(b'IEND',b'')
          with open('SV3D/Resources/Assets.xcassets/AppIcon.appiconset/icon.png','wb') as f:
              f.write(png(1024, 1024))
          print("✅ Icon generated (PUBG-style soldier silhouette)")
          PYEOF

      # ── XcodeGen ─────────────────────────────────────────────────────────────
      - name: Generate Xcode Project
        working-directory: SV3D
        run: xcodegen generate --spec project.yml --project .

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SV3D/ShadowVillage3D.xcodeproj \
            -scheme ShadowVillage3D \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || \
            (echo "=== BUILD ERRORS ===" && grep "error:" build.log | head -40 && exit 1)

      # ── Package IPA ───────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "ShadowVillage3D.app" -type d | head -1)
          [ -z "$APP" ] && echo "❌ .app not found" && grep "error:" build.log | head -25 && exit 1
          echo "✅ Found: $APP ($(du -sh "$APP" | cut -f1))"
          mkdir -p Payload; cp -r "$APP" Payload/ShadowVillage3D.app
          rm -rf Payload/ShadowVillage3D.app/_CodeSignature 2>/dev/null || true
          zip -r ShadowVillage3D-PUBG.ipa Payload
          echo "📦 IPA: $(du -sh ShadowVillage3D-PUBG.ipa | cut -f1)"

