              private func setupJoysticks() {
                  let jR = view.bounds.height * 0.13
                  
                  moveJoystick = JoystickView(radius: jR)
                  moveJoystick.center = CGPoint(x: jR + 40, y: view.bounds.height - jR - 40)
                  view.addSubview(moveJoystick)

                  aimJoystick = JoystickView(radius: jR)
                  aimJoystick.center = CGPoint(x: view.bounds.width - jR - 160, y: view.bounds.height - jR - 40)
                  view.addSubview(aimJoystick)
              }

              private func setupHUD() {
                  hudView = HUDOverlay(frame: view.bounds)
                  hudView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  
                  // Crucial fix: Let events pass to child components under overlay tracking bounds
                  hudView.isUserInteractionEnabled = false 
                  view.addSubview(hudView)
                  
                  hudView.shootBtn.addTarget(self, action: #selector(shootDown), for: .touchDown)
                  hudView.shootBtn.addTarget(self, action: #selector(shootUp), for: [.touchUpInside, .touchUpOutside, .touchCancel])
              }

              @objc private func shootDown() { isShooting = true  }
              @objc private func shootUp()   { isShooting = false }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      
                      // Check shoot button first since it overlapping layout frames
                      let convertedPt = hudView.shootBtn.convert(pt, from: view)
                      if hudView.shootBtn.point(inside: convertedPt, with: event) { continue }

                      if moveJoystick.frame.contains(pt) && moveJoystick.trackingTouch == nil {
                          moveJoystick.trackingTouch = t
                      } else if aimJoystick.frame.contains(pt) && aimJoystick.trackingTouch == nil {
                          aimJoystick.trackingTouch = t
                          aimTouch  = t
                          lastAimPt = pt
                      }
                  }
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in: view)
                      if t === moveJoystick.trackingTouch {
                          moveJoystick.moveTouch(t, in: view)
                      } else if t === aimJoystick.trackingTouch {
                          aimJoystick.moveTouch(t, in: view)
                          cameraYaw -= Float(pt.x - lastAimPt.x) * 0.0065
                          lastAimPt  = pt
                      }
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === moveJoystick.trackingTouch { moveJoystick.reset() }
                      if t === aimJoystick.trackingTouch  { aimJoystick.reset(); aimTouch = nil }
                  }
              }

              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  touchesEnded(touches, with: event)
              }

              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  guard !isGameOver else { return }
                  let dt = lastTime == 0 ? 0 : Float(min(time - lastTime, 0.05))
                  lastTime = time

                  moveAndAnimateHumanCharacter(dt: dt)
                  
                  if shakeIntensity > 0.01 {
                      let sx = Float.random(in: -1...1) * shakeIntensity
                      let sy = Float.random(in: -1...1) * shakeIntensity
                      cameraNode.position = SCNVector3(sx, 2.4 + sy, 6.5)
                      shakeIntensity *= 0.90
                  } else {
                      cameraNode.position = SCNVector3(0, 2.4, 6.5)
                  }

                  cameraArm.eulerAngles.y = cameraYaw
                  if isShooting { tryShoot(time: time) }
                  updateEnemies(time: time, dt: dt)
                  updateWaves(dt: dt)

                  DispatchQueue.main.async { [weak self] in
                      guard let s = self else { return }
                      s.hudView.update(health: s.health, maxHealth: s.maxHealth, ammo: s.ammo, totalAmmo: s.totalAmmo, score: s.score, wave: s.wave, isReloading: s.isReloading)
                      if s.health <= 0 && !s.isGameOver { s.endGame(victory: false) }
                  }
              }

              private func moveAndAnimateHumanCharacter(dt: Float) {
                  let mv  = moveJoystick.velocity
                  let len = sqrt(mv.x * mv.x + mv.y * mv.y)
                  let lerpSpeed: Float = dt * 12.0

                  guard len > 0.1 else {
                      animationTime += dt * 2.5
                      let breathe = sin(animationTime)
                      
                      currentPelvisY += ((0.95 + breathe * 0.012) - currentPelvisY) * lerpSpeed
                      pelvisNode.position.y = currentPelvisY

                      chestNode.eulerAngles.x = breathe * 0.010
                      headNode.eulerAngles.x = -breathe * 0.005
                      
                      currentLeftThighX += (0.0 - currentLeftThighX) * lerpSpeed
                      currentRightThighX += (0.0 - currentRightThighX) * lerpSpeed
                      currentLeftShinX += (0.0 - currentLeftShinX) * lerpSpeed
                      currentRightShinX += (0.0 - currentRightShinX) * lerpSpeed

                      leftThigh.eulerAngles.x = currentLeftThighX
                      rightThigh.eulerAngles.x = currentRightThighX
                      leftShin.eulerAngles.x = currentLeftShinX
                      rightShin.eulerAngles.x = currentRightShinX

                      leftArmNode.eulerAngles.x = 0; leftArmNode.eulerAngles.z = 0.05
                      rightArmNode.eulerAngles.x = -0.15; rightArmNode.eulerAngles.y = -0.05
                      
                      currentBodyAngle += (targetBodyAngle - currentBodyAngle) * lerpSpeed
                      playerBody.eulerAngles.y = currentBodyAngle
                      return
                  }

                  let travelSpeed: Float = len > 0.75 ? 8.5 : 4.2
                  let matrixFactor: Float = len > 0.75 ? 2.8 : 1.5

                  let fwd = SIMD3<Float>(-sin(cameraYaw), 0, -cos(cameraYaw))
                  let rgt = SIMD3<Float>( cos(cameraYaw), 0, -sin(cameraYaw))
                  var dir = fwd * (-mv.y) + rgt * mv.x
                  let dLen = sqrt(dir.x * dir.x + dir.y * dir.y + dir.z * dir.z)
                  if dLen > 0 { dir = dir / dLen }

                  let deltaPos = dir * travelSpeed * dt
                  var finalPos = playerNode.simdPosition + deltaPos
                  let boundary = mapHalf - 2.5
                  finalPos.x = max(-boundary, min(boundary, finalPos.x))
                  finalPos.z = max(-boundary, min(boundary, finalPos.z))
                  playerNode.simdPosition = finalPos

                  targetBodyAngle = atan2(dir.x, dir.z)
                  var angleDiff = targetBodyAngle - currentBodyAngle
                  while angleDiff < -.pi { angleDiff += .pi * 2 }
                  while angleDiff > .pi { angleDiff -= .pi * 2 }
                  currentBodyAngle += angleDiff * lerpSpeed
                  playerBody.eulerAngles.y = currentBodyAngle

                  animationTime += dt * matrixFactor * 14.0
                  let swingA = sin(animationTime)
                  let swingB = cos(animationTime)

                  currentPelvisY += ((0.95 + abs(swingA) * 0.035) - currentPelvisY) * lerpSpeed
                  pelvisNode.position.y = currentPelvisY
                  chestNode.eulerAngles.y = swingA * 0.06

                  currentLeftThighX += ((swingA * 0.65) - currentLeftThighX) * lerpSpeed
                  currentRightThighX += ((-swingA * 0.65) - currentRightThighX) * lerpSpeed
                  currentLeftShinX += ((max(0, -swingB * 0.50)) - currentLeftShinX) * lerpSpeed
                  currentRightShinX += ((max(0, swingB * 0.50)) - currentRightShinX) * lerpSpeed

                  leftThigh.eulerAngles.x = currentLeftThighX
                  rightThigh.eulerAngles.x = currentRightThighX
                  leftShin.eulerAngles.x = currentLeftShinX
                  rightShin.eulerAngles.x = currentRightShinX

                  leftArmNode.eulerAngles.x = -swingA * 0.55
                  rightArmNode.eulerAngles.x = (swingA * 0.10) - 0.30
              }

              private func tryShoot(time: TimeInterval) {
                  guard canShoot, !isReloading, time - lastShotTime > 0.18 else { return }
                  guard ammo > 0 else { executeReloadSequence(); return }
                  
                  lastShotTime = time
                  ammo -= 1

                  let wt = cameraNode.presentation.worldTransform
                  let cPos = SCNVector3(wt.m41, wt.m42, wt.m43)
                  let fLen = sqrt(wt.m31 * wt.m31 + wt.m32 * wt.m32 + wt.m33 * wt.m33)
                  let fx = -wt.m31 / fLen; let fy = -wt.m32 / fLen; let fz = -wt.m33 / fLen

                  let tracerGeo = SCNCapsule(capRadius: 0.02, height: 0.5)
                  let tracerMat = SCNMaterial()
                  tracerMat.lightingModel = .constant
                  tracerMat.diffuse.contents = UIColor(red: 0.2, green: 0.6, blue: 1.0, alpha: 1)
                  tracerMat.emission.contents = UIColor(red: 0.5, green: 0.8, blue: 1.0, alpha: 1)
                  tracerGeo.materials = [tracerMat]

                  let bulletNode = SCNNode(geometry: tracerGeo)
                  bulletNode.position = SCNVector3(cPos.x + fx * 1.2, cPos.y + fy * 1.2, cPos.z + fz * 1.2)
                  
                  let bBody = SCNPhysicsBody(type: .dynamic, shape: SCNPhysicsShape(geometry: tracerGeo, options: nil))
                  bBody.categoryBitMask = PhysicsMask.bullet
                  bBody.contactTestBitMask = PhysicsMask.enemy | PhysicsMask.wall
                  bBody.collisionBitMask = PhysicsMask.none
                  bBody.isAffectedByGravity = false
                  bBody.velocity = SCNVector3(fx * 75, fy * 75, fz * 75)
                  bulletNode.physicsBody = bBody

                  scene.rootNode.addChildNode(bulletNode)
                  bullets.append(bulletNode)

                  bulletNode.runAction(SCNAction.sequence([
                      SCNAction.wait(duration: 2.0),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              private func executeReloadSequence() {
                  guard !isReloading, totalAmmo > 0 else { return }
                  isReloading = true
                  canShoot    = false
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.2) { [weak self] in
                      guard let s = self else { return }
                      let amount = min(30 - s.ammo, s.totalAmmo)
                      s.ammo += amount
                      s.totalAmmo -= amount
                      s.isReloading = false
                      s.canShoot = true
                  }
              }

              private func updateEnemies(time: TimeInterval, dt: Float) {
                  enemies = enemies.filter { $0.parent != nil && $0.isAlive }
                  for e in enemies {
                      e.moveToward(target: playerNode.position, dt: dt)
                      if e.distanceTo(playerNode.position) < e.kind.attackRange + 0.4 && e.canAttack(at: time) {
                          e.lastAttackTime = time
                          health -= e.kind.damage
                          shakeIntensity = 0.35
                          DispatchQueue.main.async { [weak self] in self?.flashScreenImpact() }
                      }
                  }
              }

              private func updateWaves(dt: Float) {
                  if waveActive {
                      if enemies.isEmpty {
                          waveActive = false
                          waveTimer = 3.5
                          score += 1000
                          if bossSpawned { endGame(victory: true); return }
                      }
                  } else {
                      waveTimer -= Double(dt)
                      if waveTimer <= 0 { startNextPhase() }
                  }
              }

              private func startNextPhase() {
                  wave += 1
                  waveActive = true
                  
                  if wave == 5 {
                      bossSpawned = true
                      spawnEnemy(kind: .boss, at: SCNVector3(-15, 0, -15))
                      return
                  }

                  let totalSpawn = 4 + wave * 3
                  for i in 0..<totalSpawn {
                      let kind: EnemyKind = i % 4 == 0 && wave > 2 ? .brute : (i % 3 == 0 ? .runner : .walker)
                      DispatchQueue.main.asyncAfter(deadline: .now() + Double(i) * 0.35) { [weak self] in
                          self?.spawnEnemy(kind: kind)
                      }
                  }
              }

              private func spawnEnemy(kind: EnemyKind, at pos: SCNVector3? = nil) {
                  let enemy = EnemyNode(kind: kind)
                  let boundary = mapHalf - 4.0
                  enemy.position = pos ?? SCNVector3(Float.random(in: -boundary...boundary), 0, Float.random(in: -boundary...boundary))
                  scene.rootNode.addChildNode(enemy)
                  enemies.append(enemy)
              }

              func physicsWorld(_ world: SCNPhysicsWorld, didBegin contact: SCNPhysicsContact) {
                  let nA = contact.nodeA, nB = contact.nodeB
                  let mA = nA.physicsBody?.categoryBitMask ?? 0
                  let mB = nB.physicsBody?.categoryBitMask ?? 0

                  if (mA == PhysicsMask.bullet && mB == PhysicsMask.enemy) || (mB == PhysicsMask.bullet && mA == PhysicsMask.enemy) {
                      let bullet = mA == PhysicsMask.bullet ? nA : nB
                      let enemy = (mA == PhysicsMask.enemy ? nA : nB) as? EnemyNode
                      
                      createSparksAt(position: bullet.position)
                      
                      bullet.removeFromParentNode()
                      enemy?.takeDamage(35)
                      if let e = enemy, !e.isAlive { score += e.kind.scoreValue }
                  }
              }
              
              private func createSparksAt(position: SCNVector3) {
                  for _ in 0..<6 {
                      let spark = SCNNode(geometry: SCNSphere(radius: 0.04))
                      spark.geometry?.firstMaterial?.lightingModel = .constant
                      spark.geometry?.firstMaterial?.diffuse.contents = UIColor.orange
                      spark.position = position
                      scene.rootNode.addChildNode(spark)
                      
                      let vx = Float.random(in: -3...3)
                      let vy = Float.random(in: 1...5)
                      let vz = Float.random(in: -3...3)
                      
                      spark.runAction(SCNAction.sequence([
                          SCNAction.group([
                              SCNAction.moveBy(x: CGFloat(vx), y: CGFloat(vy), z: CGFloat(vz), duration: 0.25),
                              SCNAction.scale(to: 0.01, duration: 0.25)
                          ]),
                          SCNAction.removeFromParentNode()
                      ]))
                  }
              }

              private func flashScreenImpact() {
                  let overlay = UIView(frame: view.bounds)
                  overlay.backgroundColor = UIColor(red: 0.8, green: 0.1, blue: 0.1, alpha: 0.3)
                  view.addSubview(overlay)
                  UIView.animate(withDuration: 0.2, animations: { overlay.alpha = 0 }) { _ in overlay.removeFromSuperview() }
              }

              private func endGame(victory: Bool) {
                  guard !isGameOver else { return }
                  isGameOver = true
                  DispatchQueue.main.async { [weak self] in self?.showGameOverScreen(victory: victory) }
              }

              private func showGameOverScreen(victory: Bool) {
                  let screen = UIView(frame: view.bounds)
                  screen.backgroundColor = UIColor(white: 0.02, alpha: 0.95)
                  view.addSubview(screen)

                  let title = UILabel(frame: CGRect(x: 0, y: screen.bounds.height * 0.3, width: screen.bounds.width, height: 60))
                  title.text = victory ? "SURVIVED" : "TERMINATED"
                  title.font = UIFont(name: "Courier-Bold", size: 36)
                  title.textColor = victory ? .green : .red
                  title.textAlignment = .center
                  screen.addSubview(title)
              }
          }
          SWIFT_EOF

      # ── Info.plist ────────────────────────────────────────────────────────────
      - name: Info.plist
        run: |
          cat > SV3D/Resources/Info.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleDisplayName</key><string>Shadow Village 3D</string>
              <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>ShadowVillage3D</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
          </dict>
          </plist>
          PLIST_EOF

      # ── project.yml ───────────────────────────────────────────────────────────
      - name: project.yml
        run: |
          cat > SV3D/project.yml << 'YAML_EOF'
          name: ShadowVillage3D
          options:
            bundleIdPrefix: com.shadowvillage3d
            createIntermediateGroups: true
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.9"
              DEVELOPMENT_TEAM: ""
              PRODUCT_BUNDLE_IDENTIFIER: com.shadowvillage3d.game
              TARGETED_DEVICE_FAMILY: "1"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
              ENABLE_BITCODE: "NO"
              DEBUG_INFORMATION_FORMAT: dwarf
          targets:
            ShadowVillage3D:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              info:
                path: Resources/Info.plist
              sources:
                - path: Sources
              resources:
                - path: Resources
              frameworks:
                - SDK: SceneKit.framework
                - SDK: UIKit.framework
                - SDK: GameplayKit.framework
          YAML_EOF

      # ── LaunchScreen ──────────────────────────────────────────────────────────
      - name: LaunchScreen.storyboard
        run: |
          cat > SV3D/Resources/LaunchScreen.storyboard << 'XML_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701" targetRuntime="AppleCocoa Touch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES">
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21678"/>
              </dependencies>
              <scenes>
                  <scene sceneID="sc1">
                      <objects>
                          <viewController id="vc1" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="vw1">
                                  <rect key="frame" x="0.0" y="0.0" width="430" height="932"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" white="0.02" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="fb1" sceneMemberID="firstResponder"/>
                      </objects>
                  </scene>
              </scenes>
          </document>
          XML_EOF

      # ── AppIcon ───────────────────────────────────────────────────────────────
      - name: Generate AppIcon
        run: |
          cat > SV3D/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSON_EOF'
          {
            "images":[{"idiom":"universal","platform":"ios","size":"1024x1024", "filename":"icon.png","scale":"1x"}],
            "info":{"author":"xcode","version":1}
          }
          JSON_EOF
          cat > SV3D/Resources/Assets.xcassets/Contents.json << 'JSON_EOF'
          {"info":{"author":"xcode","version":1}}
          JSON_EOF
          python3 - << 'PYEOF'
          import struct, zlib
          def png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): return u32(len(d)) + t + d + u32(zlib.crc32(t+d) & 0xffffffff)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      row += [20, 22, 28]
                  rows.append(bytes(row))
              raw  = zlib.compress(b''.join(rows), 9)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = u32(w) + u32(h) + bytes([8, 2, 0, 0, 0])
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          with open('SV3D/Resources/Assets.xcassets/AppIcon.appiconset/icon.png', 'wb') as f:
              f.write(png(1024, 1024))
          PYEOF

      # ── XcodeGen Project Generation ──────────────────────────────────────────
      - name: Generate Xcode Project
        working-directory: SV3D
        run: xcodegen generate --spec project.yml --project .

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SV3D/ShadowVillage3D.xcodeproj \
            -scheme ShadowVillage3D \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            clean build 2>&1 | tee build.log | xcpretty || exit 1

      # ── Package IPA ───────────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP=$(find "${{ github.workspace }}/build/sym" -name "ShadowVillage3D.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/ShadowVillage3D.app
          zip -r ShadowVillage3D.ipa Payload

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVillage3D-HumanAndMonsters
          path: ShadowVillage3D.ipa
          retention-days: 14
