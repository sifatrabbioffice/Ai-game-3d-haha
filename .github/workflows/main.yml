              private var cameraYaw     : Float   = 0
              private let cameraPitch   : Float   = -0.18
              private weak var aimTouch : UITouch?
              private var lastAimPt     : CGPoint = .zero

              private let mapHalf: Float = 35.0

              override func viewDidLoad() {
                  super.viewDidLoad()
                  AudioManager.shared.startAmbient()
                  setupScene()
                  buildWorld()
                  spawnPlayer()
                  setupCamera()
                  setupLighting()
                  setupHUD()
                  setupJoysticks()
                  waveTimer = 3.0
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.8) { [weak self] in
                      self?.hudView.showMessage("⚔  WAVE 1 INCOMING  ⚔", color: UIColor(red:1, green:0.2, blue:0.2, alpha:1), duration:3.0)
                      AudioManager.shared.play("ui_click")
                  }
              }

              override var prefersStatusBarHidden: Bool { true }
              override var shouldAutorotate: Bool { true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { .landscape }
              override var prefersHomeIndicatorAutoHidden: Bool { true }

              // MARK: – Scene Setup
              private func setupScene() {
                  scnView = SCNView(frame:view.bounds)
                  scnView.autoresizingMask         = [.flexibleWidth, .flexibleHeight]
                  scnView.backgroundColor          = .black
                  scnView.antialiasingMode          = .multisampling4X
                  scnView.preferredFramesPerSecond  = 60
                  view.addSubview(scnView)

                  scene = SCNScene()
                  scene.background.contents          = gradientSkyTexture()
                  scene.physicsWorld.contactDelegate = self
                  scene.physicsWorld.gravity         = SCNVector3(0, -14, 0)
                  scnView.scene    = scene
                  scnView.delegate = self
                  scnView.isPlaying = true
              }

              private func gradientSkyTexture() -> UIColor {
                  return UIColor(red:0.03, green:0.02, blue:0.06, alpha:1)
              }

              // MARK: – World
              private func buildWorld() {
                  buildGround(); buildBorders(); buildBuildings()
                  buildTrees(); buildDebris(); addAtmosphere()
              }

              private func buildGround() {
                  // Use PBR texture if available
                  let geo = SCNFloor()
                  let mat = SCNMaterial()
                  if let tex = UIImage(named:"ground_diffuse") {
                      mat.diffuse.contents = tex
                      mat.diffuse.wrapS    = .repeat
                      mat.diffuse.wrapT    = .repeat
                      mat.diffuse.contentsTransform = SCNMatrix4MakeScale(12, 12, 1)
                  } else {
                      mat.diffuse.contents = UIColor(red:0.14, green:0.12, blue:0.08, alpha:1)
                  }
                  mat.roughness.contents = 0.92
                  mat.lightingModel      = .physicallyBased
                  geo.materials = [mat]
                  let node = SCNNode(geometry:geo)
                  node.physicsBody = SCNPhysicsBody(type:.static, shape:nil)
                  node.physicsBody?.categoryBitMask  = PhysicsMask.ground
                  node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy | PhysicsMask.bullet
                  scene.rootNode.addChildNode(node)
              }

              private func buildBorders() {
                  let h: Float = 10, t: Float = 2, s = mapHalf * 2
                  let walls: [(Float,Float,Float,Float,Float,Float)] = [
                      (0,h/2,-(mapHalf+t/2),s+t*2,h,t),
                      (0,h/2,(mapHalf+t/2),s+t*2,h,t),
                      (-(mapHalf+t/2),h/2,0,t,h,s),
                      ((mapHalf+t/2),h/2,0,t,h,s)
                  ]
                  for (x,y,z,w,hh,d) in walls {
                      let geo = SCNBox(width:CGFloat(w), height:CGFloat(hh), length:CGFloat(d), chamferRadius:0)
                      let mat = SCNMaterial()
                      mat.diffuse.contents = UIImage(named:"concrete_diffuse") ?? UIColor(red:0.16, green:0.12, blue:0.08, alpha:1)
                      mat.lightingModel = .physicallyBased; mat.roughness.contents = 0.88
                      geo.materials = [mat]
                      let node = SCNNode(geometry:geo); node.position = SCNVector3(x,y,z)
                      node.physicsBody = SCNPhysicsBody(type:.static, shape:nil)
                      node.physicsBody?.categoryBitMask  = PhysicsMask.wall
                      node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy | PhysicsMask.bullet
                      scene.rootNode.addChildNode(node)
                  }
              }

              private func buildBuildings() {
                  let data: [(Float,Float,Float,Float)] = [
                      (-14,-20,6,9),( 12,-18,5,7),(-10,16,7,10),
                      ( 18,10,5,8),(-20,5,5,8),(6,22,6,8),
                      (-5,-10,5,6),( 16,-5,5,7),(1,2,4,6),
                      (-24,-12,5,9),(24,-18,5,7),(8,-26,6,8),
                      (-16,24,5,7),( 0,-30,5,6),(28,8,4,7)
                  ]
                  for (x,z,w,h) in data { addBuilding(at:SCNVector3(x,0,z), w:w, h:h, d:w*0.85) }
              }

              private func addBuilding(at pos: SCNVector3, w: Float, h: Float, d: Float) {
                  let geo = SCNBox(width:CGFloat(w), height:CGFloat(h), length:CGFloat(d), chamferRadius:0.1)
                  let mat = SCNMaterial()
                  mat.diffuse.contents   = UIImage(named:"concrete_diffuse") ?? UIColor(red:CGFloat.random(in:0.14...0.22), green:CGFloat.random(in:0.10...0.15), blue:CGFloat.random(in:0.06...0.10), alpha:1)
                  mat.roughness.contents = 0.88; mat.lightingModel = .physicallyBased
                  geo.materials = [mat]
                  let node = SCNNode(geometry:geo)
                  node.position = SCNVector3(pos.x, h/2, pos.z)
                  node.physicsBody = SCNPhysicsBody(type:.static, shape:nil)
                  node.physicsBody?.categoryBitMask  = PhysicsMask.wall
                  node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy | PhysicsMask.bullet
                  scene.rootNode.addChildNode(node)

                  // Roof
                  let rh = w * 0.5
                  let roof = SCNNode(geometry: { let g = SCNPyramid(width:CGFloat(w+0.5), height:CGFloat(rh), length:CGFloat(d+0.5)); let m = SCNMaterial(); m.diffuse.contents = UIColor(red:0.07, green:0.05, blue:0.03, alpha:1); m.lightingModel = .physicallyBased; g.materials=[m]; return g }())
                  roof.position = SCNVector3(pos.x, h+rh/2, pos.z)
                  scene.rootNode.addChildNode(roof)

                  // Windows
                  if Bool.random() { addWindowGlow(at:SCNVector3(pos.x, h*0.5, pos.z - d/2 - 0.12)) }
                  if Bool.random() { addWindowGlow(at:SCNVector3(pos.x - w/2 - 0.12, h*0.6, pos.z)) }
              }

              private func addWindowGlow(at pos: SCNVector3) {
                  let geo = SCNBox(width:0.7, height:0.9, length:0.05, chamferRadius:0.05)
                  let mat = SCNMaterial()
                  let r = CGFloat.random(in:0.7...1.0), g = CGFloat.random(in:0.6...0.9), b = CGFloat.random(in:0.2...0.5)
                  mat.diffuse.contents  = UIColor(red:r, green:g, blue:b, alpha:1)
                  mat.emission.contents = UIColor(red:r*0.55, green:g*0.45, blue:b*0.2, alpha:1)
                  mat.lightingModel     = .constant; geo.materials = [mat]
                  let node = SCNNode(geometry:geo); node.position = pos
                  scene.rootNode.addChildNode(node)

                  let light = SCNLight(); light.type = .omni
                  light.color = UIColor(red:r, green:g*0.8, blue:b*0.4, alpha:1)
                  light.intensity = 100
                  light.attenuationStartDistance = 0.5; light.attenuationEndDistance = 6
                  let ln = SCNNode(); ln.light = light; ln.position = pos
                  scene.rootNode.addChildNode(ln)
                  ln.runAction(SCNAction.repeatForever(SCNAction.sequence([
                      SCNAction.run { n in n.light?.intensity = CGFloat.random(in:60...160) },
                      SCNAction.wait(duration:Double.random(in:0.05...0.2))
                  ])))
              }

              private func buildTrees() {
                  let pts: [(Float,Float)] = [
                      (-28,-28),(-14,-30),(22,-26),(30,6),(28,22),
                      (-28,20),(-30,2),(2,-32),(13,28),(-13,27),
                      (20,-24),(-22,-22),(26,-12),(-28,14),(32,-4),
                      (-32,-8),(6,-34),(24,28),(-18,32),(18,32)
                  ]
                  for (x,z) in pts { addTree(at:SCNVector3(x,0,z), scale:CGFloat.random(in:0.8...1.4)) }
              }

              private func addTree(at pos: SCNVector3, scale: CGFloat = 1) {
                  let trunk = SCNCylinder(radius:0.22*scale, height:2.8*scale)
                  let tMat = SCNMaterial(); tMat.diffuse.contents = UIColor(red:0.22, green:0.13, blue:0.06, alpha:1); tMat.lightingModel = .physicallyBased; trunk.materials = [tMat]
                  let tn = SCNNode(geometry:trunk); tn.position = SCNVector3(pos.x, Float(1.4*scale), pos.z)
                  tn.physicsBody = SCNPhysicsBody(type:.static, shape:nil)
                  tn.physicsBody?.categoryBitMask = PhysicsMask.wall; tn.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy
                  scene.rootNode.addChildNode(tn)

                  // Multi-layer canopy for depth
                  for i in 0..<3 {
                      let radius = 1.6*scale - CGFloat(i)*0.2*scale
                      let leaves = SCNSphere(radius:radius)
                      let lMat = SCNMaterial()
                      lMat.diffuse.contents = UIColor(red:CGFloat.random(in:0.04...0.08), green:CGFloat.random(in:0.10...0.18), blue:CGFloat.random(in:0.03...0.06), alpha:1)
                      lMat.lightingModel = .physicallyBased; lMat.roughness.contents = 0.95
                      leaves.materials = [lMat]
                      let ln = SCNNode(geometry:leaves)
                      ln.position = SCNVector3(pos.x, Float(2.8*scale + Double(i)*0.8*Double(scale)), pos.z)
                      scene.rootNode.addChildNode(ln)
                  }
              }

              private func buildDebris() {
                  // Scattered sandbags, barrels, crates for PUBG battlefield feel
                  let debrisPositions: [(Float,Float,String)] = [
                      (-6, -6, "crate"), (6, -6, "barrel"), (-6, 6, "sandbag"),
                      (6, 6, "crate"), (0, -14, "barrel"), (14, 0, "crate"),
                      (-14, 0, "sandbag"), (0, 14, "barrel")
                  ]
                  for (x, z, type) in debrisPositions { addDebris(at:SCNVector3(x, 0, z), type:type) }
              }

              private func addDebris(at pos: SCNVector3, type: String) {
                  let geo: SCNGeometry
                  let mat = SCNMaterial()
                  mat.lightingModel = .physicallyBased; mat.roughness.contents = 0.88

                  switch type {
                  case "barrel":
                      geo = SCNCylinder(radius:0.38, height:0.85)
                      mat.diffuse.contents = UIColor(red:0.55, green:0.28, blue:0.08, alpha:1)
                      mat.metalness.contents = 0.4
                  case "sandbag":
                      geo = SCNBox(width:1.4, height:0.55, length:0.65, chamferRadius:0.12)
                      mat.diffuse.contents = UIColor(red:0.58, green:0.50, blue:0.34, alpha:1)
                  default: // crate
                      geo = SCNBox(width:0.85, height:0.85, length:0.85, chamferRadius:0.04)
                      mat.diffuse.contents = UIColor(red:0.45, green:0.32, blue:0.18, alpha:1)
                  }
                  geo.materials = [mat]
                  let node = SCNNode(geometry:geo); node.position = SCNVector3(pos.x, 0.45, pos.z)
                  node.eulerAngles.y = Float.random(in:0...Float.pi*2)
                  node.physicsBody = SCNPhysicsBody(type:.static, shape:nil)
                  node.physicsBody?.categoryBitMask = PhysicsMask.wall
                  node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy | PhysicsMask.bullet
                  scene.rootNode.addChildNode(node)
              }

              private func addAtmosphere() {
                  scene.fogColor           = UIColor(red:0.06, green:0.05, blue:0.09, alpha:1)
                  scene.fogStartDistance   = 22; scene.fogEndDistance = 80
                  scene.fogDensityExponent = 0.55

                  // Torch / fire lights
                  let torches: [(Float,Float)] = [
                      (-12,-12),(12,-12),(-12,12),(12,12),
                      (0,-24),(0,24),(-24,0),(24,0),
                      (-18,-18),(18,-18),(-18,18),(18,18)
                  ]
                  for (tx,tz) in torches {
                      let light = SCNLight(); light.type = .omni
                      light.color = UIColor(red:1, green:0.52, blue:0.12, alpha:1)
                      light.intensity = 380
                      light.attenuationStartDistance = 1; light.attenuationEndDistance = 14
                      let node = SCNNode(); node.light = light; node.position = SCNVector3(tx, 2.8, tz)
                      scene.rootNode.addChildNode(node)
                      node.runAction(SCNAction.repeatForever(SCNAction.sequence([
                          SCNAction.run { n in n.light?.intensity = CGFloat.random(in:200...500) },
                          SCNAction.wait(duration:Double.random(in:0.04...0.15))
                      ])))
                  }
              }

              // MARK: – Player Spawn
              private func spawnPlayer() {
                  playerNode = SCNNode(); playerNode.position = SCNVector3(0, 0, 0)
                  playerChar = FBXCharacterNode()
                  playerNode.addChildNode(playerChar)

                  let shape = SCNPhysicsShape(geometry:SCNCapsule(capRadius:0.40, height:1.75), options:nil)
                  let body  = SCNPhysicsBody(type:.kinematic, shape:shape)
                  body.categoryBitMask    = PhysicsMask.player
                  body.contactTestBitMask = PhysicsMask.enemy | PhysicsMask.item
                  body.collisionBitMask   = PhysicsMask.wall | PhysicsMask.ground
                  playerNode.physicsBody  = body
                  scene.rootNode.addChildNode(playerNode)
              }

              private func setupCamera() {
                  cameraArm          = SCNNode(); cameraArm.position = SCNVector3(0, 1.85, 0)
                  playerNode.addChildNode(cameraArm)
                  cameraNode         = SCNNode()
                  let cam            = SCNCamera()
                  cam.fieldOfView    = 72; cam.zFar = 220; cam.zNear = 0.04
                  cam.motionBlurIntensity = 0.18
                  cameraNode.camera  = cam
                  cameraNode.position = SCNVector3(0, 2.6, 6.8)
                  cameraNode.eulerAngles = SCNVector3(cameraPitch, 0, 0)
                  cameraArm.addChildNode(cameraNode)
                  scnView.pointOfView = cameraNode
              }

              private func setupLighting() {
                  scnView.autoenablesDefaultLighting = false
                  let moon = SCNLight(); moon.type = .directional
                  moon.color = UIColor(red:0.52, green:0.52, blue:0.72, alpha:1)
                  moon.intensity = 700; moon.castsShadow = true
                  moon.shadowRadius = 4; moon.shadowColor = UIColor(white:0, alpha:0.75)
                  moon.shadowMapSize = CGSize(width:2048, height:2048)
                  let moonNode = SCNNode(); moonNode.light = moon; moonNode.eulerAngles = SCNVector3(-0.6, 0.45, 0)
                  scene.rootNode.addChildNode(moonNode)

                  let amb = SCNLight(); amb.type = .ambient
                  amb.color = UIColor(red:0.05, green:0.04, blue:0.08, alpha:1); amb.intensity = 180
                  let ambNode = SCNNode(); ambNode.light = amb
                  scene.rootNode.addChildNode(ambNode)
              }

              private func setupHUD() {
                  hudView = HUDOverlay(frame:view.bounds)
                  hudView.autoresizingMask    = [.flexibleWidth, .flexibleHeight]
                  hudView.isUserInteractionEnabled = true
                  view.addSubview(hudView)
                  hudView.shootBtn.addTarget(self, action:#selector(shootDown), for:.touchDown)
                  hudView.shootBtn.addTarget(self, action:#selector(shootUp),   for:[.touchUpInside,.touchUpOutside,.touchCancel])
              }

              @objc private func shootDown() { isShooting = true  }
              @objc private func shootUp()   { isShooting = false }

              private func setupJoysticks() {
                  let jR = view.bounds.height * 0.15
                  moveJoystick = JoystickView(radius:jR)
                  moveJoystick.center = CGPoint(x:jR+28, y:view.bounds.height-jR-28)
                  view.addSubview(moveJoystick)
                  aimJoystick = JoystickView(radius:jR)
                  aimJoystick.center = CGPoint(x:view.bounds.width-jR-28-106, y:view.bounds.height-jR-28)
                  view.addSubview(aimJoystick)
              }

              // MARK: – Touch
              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in:view)
                      if moveJoystick.frame.contains(pt) && moveJoystick.trackingTouch == nil {
                          moveJoystick.trackingTouch = t
                      } else if aimJoystick.frame.contains(pt) && aimJoystick.trackingTouch == nil {
                          aimJoystick.trackingTouch = t; aimTouch = t; lastAimPt = pt
                      }
                  }
              }
              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let pt = t.location(in:view)
                      if t === moveJoystick.trackingTouch { moveJoystick.moveTouch(t, in:view) }
                      else if t === aimJoystick.trackingTouch {
                          aimJoystick.moveTouch(t, in:view)
                          cameraYaw -= Float(pt.x - lastAimPt.x) * 0.0052; lastAimPt = pt
                      }
                  }
              }
              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === moveJoystick.trackingTouch { moveJoystick.reset() }
                      if t === aimJoystick.trackingTouch  { aimJoystick.reset(); aimTouch = nil }
                  }
              }
              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) { touchesEnded(touches, with:event) }

              // MARK: – Game Loop
              func renderer(_ renderer: SCNSceneRenderer, updateAtTime time: TimeInterval) {
                  guard !isGameOver else { return }
                  let dt = lastTime == 0 ? 0 : Float(min(time - lastTime, 0.05))
                  lastTime = time

                  movePlayer(dt:dt)
                  updateCamera()
                  if isShooting { tryShoot(time:time) }
                  updateEnemies(time:time, dt:dt)
                  updateWaves(dt:dt)
                  cleanBullets()

                  DispatchQueue.main.async { [weak self] in
                      guard let s = self else { return }
                      s.hudView.update(health:s.health, maxHealth:s.maxHealth, ammo:s.ammo, totalAmmo:s.totalAmmo,
                                       score:s.score, wave:s.wave, isReloading:s.isReloading, reloadProgress:s.reloadProgress)
                      if s.health <= 0 && !s.isGameOver { s.endGame(victory:false) }
                  }
              }

              private func movePlayer(dt: Float) {
                  let mv  = moveJoystick.velocity
                  let len = sqrt(mv.x*mv.x + mv.y*mv.y)
                  isMoving  = len > 0.1
                  isRunning = len > 0.72

                  playerChar.animate(isMoving:isMoving, isRunning:isRunning, isShooting:isShooting, dt:dt)

                  guard isMoving else { return }

                  let speed: Float = isRunning ? 7.8 : 3.8
                  let fwd = SIMD3<Float>(-sin(cameraYaw), 0, -cos(cameraYaw))
                  let rgt = SIMD3<Float>( cos(cameraYaw), 0, -sin(cameraYaw))
                  var dir = fwd * (-mv.y) + rgt * mv.x
                  let dLen = sqrt(dir.x*dir.x + dir.z*dir.z)
                  if dLen > 0 { dir = dir / dLen }

                  var np = playerNode.simdPosition + dir * speed * dt
                  let b  = mapHalf - 1.5
                  np.x = max(-b, min(b, np.x)); np.z = max(-b, min(b, np.z))
                  playerNode.simdPosition = np
                  playerChar.eulerAngles.y = atan2(dir.x, dir.z)

                  // Footstep sound
                  if Int(lastTime * (isRunning ? 4.0 : 2.5)) % 1 == 0 && dt > 0 {
                      if arc4random_uniform(18) == 0 { AudioManager.shared.play("footstep", volume:0.35) }
                  }
              }

              private func updateCamera() {
                  cameraArm.eulerAngles.y = cameraYaw
              }

              // MARK: – Shooting
              private func tryShoot(time: TimeInterval) {
                  guard canShoot, !isReloading, time - lastShotTime > 0.18 else {
                      if ammo == 0 && !isReloading { reload() }; return
                  }
                  guard ammo > 0 else { reload(); return }
                  lastShotTime = time; ammo -= 1

                  AudioManager.shared.play("gunshot", volume:0.9)

                  let wt   = cameraNode.presentation.worldTransform
                  let cPos = SCNVector3(wt.m41, wt.m42, wt.m43)
                  let fLen = sqrt(wt.m31*wt.m31 + wt.m32*wt.m32 + wt.m33*wt.m33)
                  let fx   = -wt.m31/fLen, fy = -wt.m32/fLen, fz = -wt.m33/fLen

                  // Muzzle flash particle
                  let muzzlePos = SCNVector3(cPos.x + fx*1.8, cPos.y + fy*1.8, cPos.z + fz*1.8)
                  ParticleManager.shared.spawnMuzzleFlash(at:muzzlePos, in:scene)

                  // Bullet tracer
                  let bGeo = SCNCapsule(capRadius:0.022, height:0.45)
                  let bMat = SCNMaterial()
                  bMat.diffuse.contents  = UIColor(red:1, green:0.92, blue:0.3, alpha:1)
                  bMat.emission.contents = UIColor(red:1, green:0.7, blue:0.15, alpha:1)
                  bMat.lightingModel     = .constant; bGeo.materials = [bMat]
                  let bullet = SCNNode(geometry:bGeo); bullet.name = "bullet"
                  bullet.position = SCNVector3(cPos.x+fx*1.5, cPos.y+fy*1.5, cPos.z+fz*1.5)
                  bullet.eulerAngles = SCNVector3(atan2(fy, sqrt(fx*fx+fz*fz)), atan2(fx, fz), 0)

                  let bBody = SCNPhysicsBody(type:.dynamic, shape:SCNPhysicsShape(geometry:SCNCapsule(capRadius:0.022, height:0.45), options:nil))
                  bBody.categoryBitMask     = PhysicsMask.bullet
                  bBody.contactTestBitMask  = PhysicsMask.enemy | PhysicsMask.wall
                  bBody.collisionBitMask    = PhysicsMask.none
                  bBody.isAffectedByGravity = false; bBody.damping = 0
                  bBody.velocity = SCNVector3(fx*62, fy*62, fz*62)
                  bullet.physicsBody = bBody
                  scene.rootNode.addChildNode(bullet); bullets.append(bullet)
                  bullet.runAction(SCNAction.sequence([
                      SCNAction.wait(duration:2.2),
                      SCNAction.run { [weak self] n in self?.bullets.removeAll { $0 === n } },
                      SCNAction.removeFromParentNode()
                  ]))
                  if ammo == 0 { reload() }
              }

              private var reloadTimer: Timer?
              private var reloadStart: Date = Date()

              private func reload() {
                  guard !isReloading, totalAmmo > 0 else {
                      if totalAmmo == 0 { AudioManager.shared.play("empty_click") }; return
                  }
                  isReloading = true; canShoot = false; reloadProgress = 0
                  reloadStart = Date()
                  AudioManager.shared.play("reload")
                  let duration = 1.6
                  reloadTimer = Timer.scheduledTimer(withTimeInterval:0.05, repeats:true) { [weak self] t in
                      guard let s = self else { t.invalidate(); return }
                      s.reloadProgress = Float(Date().timeIntervalSince(s.reloadStart) / duration)
                      if s.reloadProgress >= 1.0 {
                          t.invalidate()
                          let load = min(30 - s.ammo, s.totalAmmo)
                          s.ammo += load; s.totalAmmo -= load
                          s.isReloading = false; s.canShoot = true; s.reloadProgress = 0
                      }
                  }
              }

              private func cleanBullets() { bullets = bullets.filter { $0.parent != nil } }

              // MARK: – Enemy AI
              private func updateEnemies(time: TimeInterval, dt: Float) {
                  enemies = enemies.filter { $0.parent != nil && $0.isAlive }
                  for e in enemies {
                      e.moveToward(target:playerNode.position, dt:dt)
                      let dist = e.distanceTo(playerNode.position)
                      if dist < e.kind.attackRange + 0.6 && e.canAttack(at:time) {
                          e.lastAttackTime = time
                          health -= e.kind.damage
                          DispatchQueue.main.async { [weak self] in
                              AudioManager.shared.play("hurt", volume:0.8)
                              self?.flashScreen(color:UIColor(red:0.9, green:0, blue:0, alpha:0.30))
                          }
                      }
                  }
              }

              // MARK: – Wave System
              private func updateWaves(dt: Float) {
                  if waveActive {
                      if enemies.filter({ $0.isAlive }).isEmpty {
                          waveActive = false; waveTimer = 4.5; score += 500
                          if bossSpawned { endGame(victory:true); return }
                          DispatchQueue.main.async { [weak self] in
                              guard let s = self else { return }
                              s.hudView.showMessage("✅  WAVE CLEARED  +500", color:UIColor(red:0.2, green:1, blue:0.3, alpha:1), duration:2.5)
                              AudioManager.shared.play("wave_clear")
                              if s.wave % 2 == 0 { s.dropAmmoBox() }
                          }
                      }
                  } else {
                      waveTimer -= Double(dt)
                      if waveTimer <= 0 { spawnWave() }
                  }
              }

              private func spawnWave() {
                  wave += 1; waveActive = true
                  DispatchQueue.main.async { [weak self] in
                      guard let s = self else { return }
                      s.hudView.showMessage("⚠  WAVE \(s.wave)  ⚠", color:UIColor(red:1, green:0.2, blue:0.2, alpha:1), duration:2.5)
                      AudioManager.shared.play("ui_click")
                  }
                  if wave == 6 { spawnBoss(); return }

                  var pool: [EnemyKind] = []
                  for _ in 0..<(4 + wave*2)   { pool.append(.walker) }
                  for _ in 0..<(wave/2)        { pool.append(.brute) }
                  for _ in 0..<(wave/2)        { pool.append(.runner) }
                  if wave > 2                  { pool.append(contentsOf:Array(repeating:.cultist, count:wave/3)) }
                  if wave > 4                  { pool.append(.sniper) }

                  for (i, k) in pool.enumerated() {
                      DispatchQueue.main.asyncAfter(deadline:.now() + Double(i)*0.35) { [weak self] in
                          self?.spawnEnemy(kind:k)
                      }
                  }
              }

              private func spawnBoss() {
                  bossSpawned = true
                  DispatchQueue.main.async { [weak self] in
                      self?.hudView.showMessage("💀  EL GIGANTE AWAKENS  💀", color:UIColor(red:1, green:0, blue:0, alpha:1), duration:4.0)
                      AudioManager.shared.play("boss_roar")
                  }
                  spawnEnemy(kind:.boss, at:SCNVector3(-(mapHalf*0.55), 0, -(mapHalf*0.55)))
                  for i in 0..<6 {
                      DispatchQueue.main.asyncAfter(deadline:.now() + Double(i)*0.45) { [weak self] in
                          self?.spawnEnemy(kind:.runner)
                      }
                  }
              }

              private func spawnEnemy(kind: EnemyKind, at pos: SCNVector3? = nil) {
                  let e = EnemyNode(kind:kind)
                  e.position = pos ?? randomEdge(); e.position.y = 0
                  scene.rootNode.addChildNode(e); enemies.append(e)
              }

              private func randomEdge() -> SCNVector3 {
                  let b = mapHalf - 3
                  switch Int.random(in:0...3) {
                  case 0:  return SCNVector3(Float.random(in:-b...b), 0, -b)
                  case 1:  return SCNVector3(Float.random(in:-b...b), 0,  b)
                  case 2:  return SCNVector3(-b, 0, Float.random(in:-b...b))
                  default: return SCNVector3( b, 0, Float.random(in:-b...b))
                  }
              }

              private func dropAmmoBox() {
                  let geo = SCNBox(width:0.7, height:0.65, length:0.7, chamferRadius:0.07)
                  let mat = SCNMaterial()
                  mat.diffuse.contents  = UIColor(red:0.65, green:0.48, blue:0.12, alpha:1)
                  mat.emission.contents = UIColor(red:0.2, green:0.15, blue:0.02, alpha:1)
                  mat.roughness.contents = 0.7; mat.metalness.contents = 0.4; mat.lightingModel = .physicallyBased
                  geo.materials = [mat]
                  let node = SCNNode(geometry:geo); node.name = "ammo"
                  node.position = SCNVector3(Float.random(in:-8...8), 0.35, Float.random(in:-8...8))
                  node.runAction(SCNAction.repeatForever(SCNAction.sequence([
                      SCNAction.moveBy(x:0, y:0.32, z:0, duration:0.75),
                      SCNAction.moveBy(x:0, y:-0.32, z:0, duration:0.75)
                  ])))
                  node.runAction(SCNAction.repeatForever(SCNAction.rotateBy(x:0, y:.pi*2, z:0, duration:3)))
                  let body = SCNPhysicsBody(type:.static, shape:nil)
                  body.categoryBitMask = PhysicsMask.item; body.contactTestBitMask = PhysicsMask.player
                  body.collisionBitMask = PhysicsMask.none; node.physicsBody = body
                  scene.rootNode.addChildNode(node)
                  node.runAction(SCNAction.sequence([
                      SCNAction.wait(duration:18),
                      SCNAction.fadeOut(duration:1.5),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              // MARK: – Physics Contact
              func physicsWorld(_ world: SCNPhysicsWorld, didBegin contact: SCNPhysicsContact) {
                  let nA = contact.nodeA, nB = contact.nodeB
                  let mA = nA.physicsBody?.categoryBitMask ?? 0
                  let mB = nB.physicsBody?.categoryBitMask ?? 0

                  if (mA == PhysicsMask.bullet && mB == PhysicsMask.enemy) ||
                     (mB == PhysicsMask.bullet && mA == PhysicsMask.enemy) {
                      let bNode = mA == PhysicsMask.bullet ? nA : nB
                      let eNode = (mA == PhysicsMask.enemy ? nA : nB) as? EnemyNode
                      bNode.removeFromParentNode(); bullets.removeAll { $0 === bNode }
                      let cp = contact.contactPoint
                      ParticleManager.shared.spawnBloodSplat(at:cp, in:scene)
                      AudioManager.shared.play("bullet_impact", volume:0.55)
                      let wasDead = !(eNode?.isAlive ?? true)
                      eNode?.takeDamage(28)
                      if let e = eNode, !wasDead, !e.isAlive {
                          let pts = e.kind.scoreValue; score += pts
                          DispatchQueue.main.async { [weak self] in
                              AudioManager.shared.play("enemy_death", volume:0.65)
                              self?.hudView.addKillFeed("💀 +\(pts)  \(String(describing:e.kind).uppercased())")
                          }
                      }; return
                  }
                  if mA == PhysicsMask.bullet || mB == PhysicsMask.bullet {
                      let bNode = mA == PhysicsMask.bullet ? nA : nB
                      let cp = contact.contactPoint
                      ParticleManager.shared.spawnBulletImpact(at:cp, in:scene)
                      bNode.removeFromParentNode(); bullets.removeAll { $0 === bNode }; return
                  }
                  if (mA == PhysicsMask.player && mB == PhysicsMask.item) ||
                     (mB == PhysicsMask.player && mA == PhysicsMask.item) {
                      let item = mA == PhysicsMask.item ? nA : nB
                      item.removeFromParentNode(); totalAmmo += 30
                      DispatchQueue.main.async { [weak self] in
                          AudioManager.shared.play("ammo_pickup")
                          self?.hudView.showMessage("🎯  AMMO +30", color:UIColor(red:1, green:0.88, blue:0.2, alpha:1), duration:1.5)
                      }
                  }
              }

              // MARK: – Game Over
              private func endGame(victory: Bool) {
                  guard !isGameOver else { return }
                  isGameOver = true
                  AudioManager.shared.stopAmbient()
                  DispatchQueue.main.asyncAfter(deadline:.now() + 1.8) { [weak self] in
                      self?.showGameOverScreen(victory:victory)
                  }
              }

              private func showGameOverScreen(victory: Bool) {
                  let ov = UIView(frame:view.bounds); ov.backgroundColor = UIColor(white:0, alpha:0.88)
                  view.addSubview(ov)

                  func mf(_ sz: CGFloat, bold: Bool = true) -> UIFont {
                      UIFont(name:bold ? "Courier-Bold" : "Courier", size:sz) ?? (bold ? .boldSystemFont(ofSize:sz) : .systemFont(ofSize:sz))
                  }

                  // Background gradient simulation
                  let gl = CAGradientLayer()
                  gl.frame  = ov.bounds
                  gl.colors = victory
                      ? [UIColor(red:0.02, green:0.10, blue:0.02, alpha:0.6).cgColor, UIColor.clear.cgColor]
                      : [UIColor(red:0.15, green:0.00, blue:0.00, alpha:0.6).cgColor, UIColor.clear.cgColor]
                  ov.layer.insertSublayer(gl, at:0)

                  let tc    = victory ? UIColor(red:1, green:0.85, blue:0.1, alpha:1) : UIColor(red:0.95, green:0.05, blue:0.05, alpha:1)
                  let title = UILabel(frame:CGRect(x:0, y:ov.bounds.height*0.18, width:ov.bounds.width, height:60))
                  title.text = victory ? "🏆  MISSION COMPLETE" : "💀  YOU ARE DEAD"
                  title.textColor = tc; title.font = mf(38); title.textAlignment = .center
                  title.transform = CGAffineTransform(scaleX:0.3, y:0.3); ov.addSubview(title)
                  UIView.animate(withDuration:0.4) { title.transform = .identity }

                  let rank: String
                  switch score {
                  case ..<2000:  rank = "D  –  Trainee"
                  case ..<5000:  rank = "C  –  Soldier"
                  case ..<12000: rank = "B  –  Veteran"
                  case ..<25000: rank = "A  –  Elite"
                  default:       rank = "S  –  LEGEND"
                  }
                  let rows = ["WAVES   :  \(wave)", "KILLS   :  \(score/100)", "SCORE   :  \(score)", "RANK    :  \(rank)"]
                  for (i, s) in rows.enumerated() {
                      let l = UILabel(frame:CGRect(x:0, y:ov.bounds.height*0.38 + CGFloat(i)*44, width:ov.bounds.width, height:32))
                      l.text = s; l.textColor = UIColor(white:0.88, alpha:1); l.font = mf(22, bold:false); l.textAlignment = .center; l.alpha = 0; ov.addSubview(l)
                      UIView.animate(withDuration:0.4, delay:0.5 + Double(i)*0.22) { l.alpha = 1 }
                  }

                  let btn = UIButton(type:.custom)
                  btn.frame = CGRect(x:ov.bounds.width/2-130, y:ov.bounds.height*0.68, width:260, height:56)
                  btn.setTitle("▶   PLAY AGAIN", for:.normal)
                  btn.titleLabel?.font = mf(24); btn.backgroundColor = UIColor(red:0.55, green:0, blue:0, alpha:0.92)
                  btn.layer.cornerRadius = 14; btn.layer.borderColor = UIColor(red:0.9, green:0.1, blue:0.1, alpha:1).cgColor
                  btn.layer.borderWidth = 2.5; btn.alpha = 0
                  btn.addTarget(self, action:#selector(restartGame), for:.touchUpInside); ov.addSubview(btn)
                  UIView.animate(withDuration:0.5, delay:1.8) { btn.alpha = 1 }
              }

              @objc private func restartGame() {
                  AudioManager.shared.play("ui_click")
                  let vc = GameViewController(); vc.modalPresentationStyle = .fullScreen
                  present(vc, animated:false)
              }

              private func flashScreen(color: UIColor) {
                  let f = UIView(frame:view.bounds); f.backgroundColor = color
                  f.isUserInteractionEnabled = false; view.insertSubview(f, belowSubview:hudView)
                  UIView.animate(withDuration:0.22) { f.alpha = 0 } completion: { _ in f.removeFromSuperview() }
              }
          }
          SWIFT_EOF

