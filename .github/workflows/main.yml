              private func buildCrosshair() -> UIView {
                  let c   = UIView(frame: bounds)
                  c.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  c.isUserInteractionEnabled = false
                  let cx = bounds.width/2, cy = bounds.height/2
                  let col = UIColor(red:0.85, green:0.92, blue:0.85, alpha:0.90)
                  let g: CGFloat = 4, s: CGFloat = 16, t: CGFloat = 2
                  // 4 lines + center dot
                  for (ox, oy, w, h): (CGFloat, CGFloat, CGFloat, CGFloat) in [
                      (-s-g/2,  -t/2,  s,  t),  // left
                      ( g/2,    -t/2,  s,  t),  // right
                      (-t/2,  -s-g/2,  t,  s),  // top
                      (-t/2,   g/2,    t,  s),  // bottom
                  ] {
                      let bar = UIView(frame: CGRect(x:cx+ox, y:cy+oy, width:w, height:h))
                      bar.backgroundColor = col; c.addSubview(bar)
                  }
                  let dot = UIView(frame: CGRect(x:cx-1.5, y:cy-1.5, width:3, height:3))
                  dot.layer.cornerRadius = 1.5
                  dot.backgroundColor    = UIColor(red:1, green:0.2, blue:0.2, alpha:1)
                  c.addSubview(dot)
                  return c
              }

              func update(health: Float, maxHealth: Float, ammo: Int, totalAmmo: Int,
                          score: Int, wave: Int, isReloading: Bool, reloadProgress: Float) {
                  let ratio = CGFloat(max(0, health/maxHealth))
                  UIView.animate(withDuration:0.12) { self.hpBar.frame.size.width = 240 * ratio }
                  hpLabel.text = "\(Int(health))"
                  hpBar.backgroundColor = ratio > 0.5
                      ? UIColor(red:0.18, green:0.85, blue:0.28, alpha:1)
                      : ratio > 0.25
                      ? UIColor(red:0.95, green:0.62, blue:0.08, alpha:1)
                      : UIColor(red:0.92, green:0.10, blue:0.10, alpha:1)

                  ammoLbl.text      = ammo == 0 ? "RELOAD!" : "\(ammo) | \(totalAmmo)"
                  ammoLbl.textColor = ammo == 0 ? .red : ammo <= 7 ? .orange : .white
                  scoreLbl.text     = "SCORE  \(score)"
                  waveLbl.text      = "WAVE  \(wave)"

                  reloadBg.isHidden  = !isReloading
                  reloadBar.isHidden = !isReloading
                  if isReloading {
                      UIView.animate(withDuration:0.08) {
                          self.reloadBar.frame.size.width = 180 * CGFloat(reloadProgress)
                      }
                  }
              }

              func addKillFeed(_ text: String, color: UIColor = UIColor(red:1, green:0.88, blue:0.2, alpha:1)) {
                  let lbl = UILabel(frame: CGRect(x:0, y:CGFloat(killLabels.count)*24, width:210, height:22))
                  lbl.text      = text; lbl.textColor = color
                  lbl.font      = font(13, bold:true); lbl.textAlignment = .right
                  lbl.alpha     = 0
                  killFeedView.addSubview(lbl)
                  killLabels.append(lbl)
                  UIView.animate(withDuration:0.2) { lbl.alpha = 1 }
                  UIView.animate(withDuration:0.5, delay:2.5) { lbl.alpha = 0 } completion: { _ in
                      lbl.removeFromSuperview()
                      self.killLabels.removeAll { $0 === lbl }
                  }
              }

              func showMessage(_ text: String, color: UIColor = .white, duration: TimeInterval = 2.0) {
                  msgLbl.text = text; msgLbl.textColor = color; msgLbl.alpha = 0
                  msgLbl.transform = CGAffineTransform(scaleX:0.55, y:0.55)
                  UIView.animate(withDuration:0.22) {
                      self.msgLbl.alpha = 1; self.msgLbl.transform = .identity
                  } completion: { _ in
                      UIView.animate(withDuration:0.35, delay:duration-0.35) { self.msgLbl.alpha = 0 }
                  }
              }
          }
          SWIFT_EOF

