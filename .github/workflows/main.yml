          import SceneKit
          import UIKit

          /// High-fidelity PUBG-style procedural humanoid character.
          /// Tries to load an external USDZ/SCN first; falls back to a detailed
          /// parametric mesh that closely matches a military-geared soldier.
          class FBXCharacterNode: SCNNode {

              // MARK: – Skeleton joints (accessible for procedural animation)
              var pelvisNode   : SCNNode!
              var spineNode    : SCNNode!
              var chestNode    : SCNNode!
              var neckNode     : SCNNode!
