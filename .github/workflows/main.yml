name: 🎮 Shadow Village 3D – High-Res Third Person iOS Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build High-Res IPA
    runs-on: macos-14
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Create Directories
        run: |
          mkdir -p SV3D/Sources
          mkdir -p SV3D/Resources/Assets.xcassets/AppIcon.appiconset

      # ── AppDelegate ──────────────────────────────────────────────────────────
      - name: AppDelegate.swift
        run: |
          cat > SV3D/Sources/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = GameViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

      # ── Types ────────────────────────────────────────────────────────────────
      - name: Types.swift
        run: |
          cat > SV3D/Sources/Types.swift << 'SWIFT_EOF'
          import UIKit

          struct PhysicsMask {
              static let none:   Int = 0
              static let player: Int = 1 << 0
              static let enemy:  Int = 1 << 1
              static let bullet: Int = 1 << 2
              static let wall:   Int = 1 << 3
              static let ground: Int = 1 << 4
              static let item:   Int = 1 << 5
          }

          enum EnemyKind {
              case walker, brute, runner, cultist, boss

              var health: Float {
                  switch self {
                  case .walker:  return 120
                  case .brute:   return 450
                  case .runner:  return 70
                  case .cultist: return 110
                  case .boss:    return 2500
                  }
              }
              var speed: Float {
                  switch self {
                  case .walker:  return 2.5
                  case .brute:   return 1.4
                  case .runner:  return 4.8
                  case .cultist: return 2.2
                  case .boss:    return 1.9
                  }
              }
              var damage: Float {
                  switch self {
                  case .walker:  return 12
                  case .brute:   return 35
                  case .runner:  return 8
                  case .cultist: return 20
                  case .boss:    return 55
                  }
              }
              var attackRange: Float {
                  switch self {
                  case .walker:  return 1.2
                  case .brute:   return 1.6
                  case .runner:  return 1.0
                  case .cultist: return 1.3
                  case .boss:    return 3.0
                  }
              }
              var scoreValue: Int {
                  switch self {
                  case .walker:  return 150
                  case .brute:   return 400
                  case .runner:  return 200
                  case .cultist: return 250
                  case .boss:    return 5000
                  }
              }
              var attackInterval: TimeInterval { return self == .boss ? 0.6 : 1.1 }
              var radius: Float {
                  switch self {
                  case .walker:  return 0.38
                  case .brute:   return 0.72
                  case .runner:  return 0.28
                  case .cultist: return 0.35
                  case .boss:    return 1.50
                  }
              }
              var height: Float { return radius * 4.2 }
              
              var baseColor: UIColor {
                  switch self {
                  case .walker:  return UIColor(red: 0.15, green: 0.35, blue: 0.15, alpha: 1)
                  case .brute:   return UIColor(red: 0.55, green: 0.05, blue: 0.05, alpha: 1)
                  case .runner:  return UIColor(red: 0.60, green: 0.40, blue: 0.05, alpha: 1)
                  case .cultist: return UIColor(red: 0.30, green: 0.05, blue: 0.45, alpha: 1)
                  case .boss:    return UIColor(red: 0.05, green: 0.05, blue: 0.08, alpha: 1)
                  }
              }
          }
          SWIFT_EOF

      # ── JoystickView ─────────────────────────────────────────────────────────
      - name: JoystickView.swift
        run: |
          cat > SV3D/Sources/JoystickView.swift << 'SWIFT_EOF'
          import UIKit

          class JoystickView: UIView {
              private let ring = UIView()
              private let knob = UIView()
              let radius: CGFloat
              var velocity: SIMD2<Float> = .zero
              var isActive: Bool = false
              weak var trackingTouch: UITouch?

              init(radius: CGFloat) {
                  self.radius = radius
                  super.init(frame: CGRect(x: 0, y: 0, width: radius * 2, height: radius * 2))
                  isUserInteractionEnabled = false
                  alpha = 0.85

                  ring.frame               = bounds
                  ring.layer.cornerRadius  = radius
                  ring.backgroundColor     = UIColor(white: 0.05, alpha: 0.50)
                  ring.layer.borderColor   = UIColor(white: 1.0, alpha: 0.45) .cgColor
                  ring.layer.borderWidth   = 2.5
                  addSubview(ring)

                  let kR                   = radius * 0.40
                  knob.frame               = CGRect(x: radius - kR, y: radius - kR, width: kR * 2, height: kR * 2)
                  knob.layer.cornerRadius  = kR
                  knob.backgroundColor     = UIColor(white: 1.0, alpha: 0.60)
                  knob.layer.borderColor   = UIColor(white: 1.0, alpha: 0.85).cgColor
                  knob.layer.borderWidth   = 2
                  addSubview(knob)
              }
              required init?(coder: NSCoder) { fatalError() }

              func moveTouch(_ touch: UITouch, in parentView: UIView) {
                  let pt   = touch.location(in: parentView)
                  let cx   = frame.midX, cy = frame.midY
                  let dx   = Float(pt.x - cx), dy = Float(pt.y - cy)
                  let dist = sqrt(dx * dx + dy * dy)
                  let maxD = Float(radius)
                  let f    = dist <= maxD ? 1.0 : maxD / dist
                  knob.center = CGPoint(x: cx + CGFloat(dx * f), y: cy + CGFloat(dy * f))
                  velocity    = SIMD2<Float>(dx * f / maxD, dy * f / maxD)
                  isActive    = dist > maxD * 0.08
              }

              func reset() {
                  knob.center   = CGPoint(x: radius, y: radius)
                  velocity      = .zero
                  isActive      = false
                  trackingTouch = nil
              }
          }
          SWIFT_EOF

      # ── HUDOverlay ───────────────────────────────────────────────────────────
      - name: HUDOverlay.swift
        run: |
          cat > SV3D/Sources/HUDOverlay.swift << 'SWIFT_EOF'
          import UIKit

          class HUDOverlay: UIView {
              private let hpBg      = UIView()
              private let hpBar     = UIView()
              private let ammoLbl   = UILabel()
              private let scoreLbl  = UILabel()
              private let waveLbl   = UILabel()
              private let msgLbl    = UILabel()
              private let reloadLbl = UILabel()
              private(set) var shootBtn = UIButton(type: .custom)
              let barW: CGFloat = 220

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  isUserInteractionEnabled = false 
                  buildUI()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func monoFont(_ size: CGFloat, bold: Bool = false) -> UIFont {
                  let name  = bold ? "Courier-Bold" : "Courier"
                  return UIFont(name: name, size: size) ?? (bold ? UIFont.boldSystemFont(ofSize: size) : UIFont.systemFont(ofSize: size))
              }

              private func buildUI() {
                  hpBg.frame            = CGRect(x: 20, y: 20, width: barW + 4, height: 22)
                  hpBg.backgroundColor  = UIColor(white: 0.1, alpha: 0.6)
                  hpBg.layer.cornerRadius = 2
                  addSubview(hpBg)

                  hpBar.frame             = CGRect(x: 22, y: 22, width: barW, height: 18)
                  hpBar.backgroundColor   = UIColor(red: 0.15, green: 0.75, blue: 0.15, alpha: 1)
                  hpBar.layer.cornerRadius = 1
                  addSubview(hpBar)

                  scoreLbl.frame            = CGRect(x: 0, y: 20, width: bounds.width, height: 26)
                  scoreLbl.autoresizingMask = [.flexibleWidth]
                  scoreLbl.text             = "SCORE: 000000"
                  scoreLbl.textColor        = .white
                  scoreLbl.font             = monoFont(16, bold: true)
                  scoreLbl.textAlignment    = .center
                  addSubview(scoreLbl)

                  waveLbl.frame            = CGRect(x: 0, y: 46, width: bounds.width, height: 20)
                  waveLbl.autoresizingMask = [.flexibleWidth]
                  waveLbl.text             = "PHASE 01"
                  waveLbl.textColor        = UIColor(white: 0.7, alpha: 1)
                  waveLbl.font             = monoFont(12, bold: true)
                  waveLbl.textAlignment    = .center
                  addSubview(waveLbl)

                  ammoLbl.frame            = CGRect(x: bounds.width - 180, y: bounds.height - 80, width: 150, height: 40)
                  ammoLbl.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  ammoLbl.text             = "30/120"
                  ammoLbl.textColor        = .white
                  ammoLbl.font             = monoFont(22, bold: true)
                  ammoLbl.textAlignment    = .right
                  addSubview(ammoLbl)

                  reloadLbl.frame            = CGRect(x: bounds.width - 220, y: bounds.height - 115, width: 190, height: 26)
                  reloadLbl.autoresizingMask = [.flexibleLeftMargin, .flexibleTopMargin]
                  reloadLbl.text             = "RELOADING"
                  reloadLbl.textColor        = UIColor(red: 0.9, green: 0.1, blue: 0.1, alpha: 1)
                  reloadLbl.font             = monoFont(14, bold: true)
                  reloadLbl.textAlignment    = .right
                  reloadLbl.isHidden         = true
                  addSubview(reloadLbl)

                  msgLbl.frame            = CGRect(x: 0, y: bounds.height * 0.35, width: bounds.width, height: 50)
                  msgLbl.autoresizingMask = [.flexibleWidth, .flexibleTopMargin, .flexibleBottomMargin]
                  msgLbl.textColor        = .white
                  msgLbl.font             = monoFont(26, bold: true)
                  msgLbl.textAlignment    = .center
                  msgLbl.alpha            = 0
                  addSubview(msgLbl)

                  addSubview(makeCrosshair())

                  let sbS: CGFloat = 85
                  shootBtn.frame = CGRect(x: bounds.width - sbS - 40, y: bounds.height - sbS - 40, width: sbS, height: sbS)
                  shootBtn.autoresizingMask       = [.flexibleLeftMargin, .flexibleTopMargin]
                  shootBtn.backgroundColor        = UIColor(white: 0.12, alpha: 0.45)
                  shootBtn.layer.cornerRadius     = sbS / 2
                  shootBtn.layer.borderColor      = UIColor(white: 1.0, alpha: 0.55).cgColor
                  shootBtn.layer.borderWidth      = 1.5
                  shootBtn.setTitle("⚡", for: .normal)
                  shootBtn.titleLabel?.font       = UIFont.systemFont(ofSize: 30)
                  shootBtn.isUserInteractionEnabled = true 
                  addSubview(shootBtn)
              }

              private func makeCrosshair() -> UIView {
                  let s: CGFloat = 16, g: CGFloat = 4, t: CGFloat = 1.5
                  let w = bounds.width / 2, h = bounds.height / 2
                  let col = UIColor(white: 1.0, alpha: 0.7)
                  let container = UIView(frame: bounds)
                  container.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  container.isUserInteractionEnabled = false
                  func bar(_ f: CGRect) -> UIView {
                      let b = UIView(frame: f)
                      b.backgroundColor = col
                      return b
                  }
                  container.addSubview(bar(CGRect(x: w - s - g / 2, y: h - t / 2, width: s, height: t)))
                  container.addSubview(bar(CGRect(x: w + g / 2,     y: h - t / 2, width: s, height: t)))
                  container.addSubview(bar(CGRect(x: w - t / 2,     y: h - s - g / 2, width: t, height: s)))
                  container.addSubview(bar(CGRect(x: w - t / 2,     y: h + g / 2, width: t, height: s)))
                  return container
              }

              func update(health: Float, maxHealth: Float, ammo: Int, totalAmmo: Int, score: Int, wave: Int, isReloading: Bool) {
                  let ratio = CGFloat(max(0, health / maxHealth))
                  UIView.animate(withDuration: 0.15) { self.hpBar.frame.size.width = self.barW * ratio }
                  hpBar.backgroundColor = ratio > 0.45 
                      ? UIColor(red: 0.2, green: 0.7, blue: 0.2, alpha: 1) 
                      : UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1)
                  
                  ammoLbl.text      = String(format: "%02d/%03d", ammo, totalAmmo)
                  scoreLbl.text     = String(format: "SCORE: %06d", score)
                  waveLbl.text      = String(format: "PHASE %02d", wave)
                  reloadLbl.isHidden = !isReloading
              }

              func showMessage(_ text: String, color: UIColor = .white, duration: TimeInterval = 2.0) {
                  msgLbl.text = text.uppercased()
                  msgLbl.textColor = color
                  msgLbl.alpha = 0
                  msgLbl.transform = CGAffineTransform(scaleX: 0.9, y: 0.9)
                  UIView.animate(withDuration: 0.25) {
                      self.msgLbl.alpha = 1
                      self.msgLbl.transform = .identity
                  } completion: { _ in
                      UIView.animate(withDuration: 0.4, delay: duration - 0.4) {
                          self.msgLbl.alpha = 0
                      }
                  }
              }
          }
          SWIFT_EOF

      # ── EnemyNode (3D MONSTER MODEL ENGINE) ──────────────────────────────────
      - name: EnemyNode.swift
        run: |
          cat > SV3D/Sources/EnemyNode.swift << 'SWIFT_EOF'
          import SceneKit
          import UIKit

          class EnemyNode: SCNNode {
              let kind:    EnemyKind
              var hp:      Float
              var isAlive: Bool = true
              var lastAttackTime: TimeInterval = 0
              private var monsterBaseNode: SCNNode!
              
              // Spikes, Claws, and Joints for Procedural Monster Model
              private var leftClaw: SCNNode!
              private var rightClaw: SCNNode!
              private var lowerJaw: SCNNode!
              private var legA: SCNNode!
              private var legB: SCNNode!
              
              private var pulseTime: Float = 0.0

              init(kind: EnemyKind) {
                  self.kind = kind
                  self.hp   = kind.health
                  super.init()
                  buildProceduralMonsterMesh()
                  buildPhysics()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func buildProceduralMonsterMesh() {
                  monsterBaseNode = SCNNode()
                  addChildNode(monsterBaseNode)
                  
                  let scaleF = CGFloat(kind.radius / 0.38)

                  let organicMat = SCNMaterial()
                  organicMat.lightingModel = .physicallyBased
                  organicMat.diffuse.contents = kind.baseColor
                  organicMat.roughness.contents = 0.85
                  organicMat.metalness.contents = 0.10
                  
                  let boneMat = SCNMaterial()
                  boneMat.lightingModel = .physicallyBased
                  boneMat.diffuse.contents = UIColor(white: 0.80, alpha: 1)
                  boneMat.roughness.contents = 0.30

                  // 1. Torso/Carapace Core
                  let torsoGeo = SCNSphere(radius: 0.45 * scaleF)
                  torsoGeo.segmentCount = 36
                  torsoGeo.materials = [organicMat]
                  let torsoNode = SCNNode(geometry: torsoGeo)
                  torsoNode.position = SCNVector3(0, 0.70 * scaleF, 0)
                  monsterBaseNode.addChildNode(torsoNode)

                  // 2. Head & Mutated Gaping Jaw
                  let headGeo = SCNBox(width: 0.42 * scaleF, height: 0.38 * scaleF, length: 0.55 * scaleF, chamferRadius: 0.08)
                  headGeo.materials = [organicMat]
                  let headNode = SCNNode(geometry: headGeo)
                  headNode.position = SCNVector3(0, 0.30 * scaleF, -0.35 * scaleF)
                  torsoNode.addChildNode(headNode)

                  let jawGeo = SCNBox(width: 0.38 * scaleF, height: 0.14 * scaleF, length: 0.48 * scaleF, chamferRadius: 0.04)
                  jawGeo.materials = [organicMat]
                  lowerJaw = SCNNode(geometry: jawGeo)
                  lowerJaw.position = SCNVector3(0, -0.18 * scaleF, -0.05 * scaleF)
                  headNode.addChildNode(lowerJaw)

                  // 3. Glowing Threat Eyes
                  for side: Float in [-1, 1] {
                      let eyeGeo = SCNSphere(radius: 0.07 * scaleF)
                      let eyeMat = SCNMaterial()
                      eyeMat.lightingModel = .constant
                      eyeMat.diffuse.contents = UIColor.red
                      eyeMat.emission.contents = kind == .boss ? UIColor.purple : UIColor.red
                      eyeGeo.materials = [eyeMat]
                      
                      let eye = SCNNode(geometry: eyeGeo)
                      eye.position = SCNVector3(side * 0.16 * Float(scaleF), 0.12 * Float(scaleF), -0.26 * Float(scaleF))
                      headNode.addChildNode(eye)
                  }

                  // 4. Quadrupedal/Insectoid Armature Legs
                  let legGeo = SCNCylinder(radius: 0.07 * scaleF, height: 0.65 * scaleF)
                  legGeo.materials = [organicMat]
                  
                  legA = SCNNode(geometry: legGeo)
                  legA.pivot = SCNMatrix4MakeTranslation(0, 0.30 * Float(scaleF), 0)
                  legA.position = SCNVector3(-0.35 * Float(scaleF), 0.20 * Float(scaleF), 0)
                  legA.eulerAngles = SCNVector3(0, 0, 0.4)
                  torsoNode.addChildNode(legA)

                  legB = SCNNode(geometry: legGeo)
                  legB.pivot = SCNMatrix4MakeTranslation(0, 0.30 * Float(scaleF), 0)
                  legB.position = SCNVector3(0.35 * Float(scaleF), 0.20 * Float(scaleF), 0)
                  legB.eulerAngles = SCNVector3(0, 0, -0.4)
                  torsoNode.addChildNode(legB)

                  // 5. Hardened Spines / Tail Spikes
                  for i in 0..<4 {
                      let spineGeo = SCNCone(topRadius: 0, bottomRadius: 0.06 * scaleF, height: 0.40 * scaleF)
                      spineGeo.materials = [boneMat]
                      let spine = SCNNode(geometry: spineGeo)
                      spine.position = SCNVector3(0, 0.35 * Float(scaleF), (0.25 - Float(i) * 0.20) * Float(scaleF))
                      spine.eulerAngles = SCNVector3(-0.4 - Float(i) * 0.15, 0, 0)
                      torsoNode.addChildNode(spine)
                  }
              }

              private func buildPhysics() {
                  let geo   = SCNCapsule(capRadius: CGFloat(kind.radius), height: CGFloat(kind.height))
                  let shape = SCNPhysicsShape(geometry: geo, options: nil)
                  let body  = SCNPhysicsBody(type: .kinematic, shape: shape)
                  body.categoryBitMask    = PhysicsMask.enemy
                  body.contactTestBitMask = PhysicsMask.bullet | PhysicsMask.player
                  body.collisionBitMask   = PhysicsMask.wall | PhysicsMask.ground
                  physicsBody = body
              }

              func takeDamage(_ amount: Float) {
                  guard isAlive else { return }
                  hp -= amount
                  flashGlow()
                  if hp <= 0 { isAlive = false; die() }
              }

              private func flashGlow() {
                  let flashMat = SCNMaterial()
                  flashMat.lightingModel = .constant
                  flashMat.diffuse.contents = UIColor.white
                  monsterBaseNode.enumerateChildNodes { (node, _) in
                      node.geometry?.materials = [flashMat]
                  }
                  
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.04) { [weak self] in
                      guard let s = self else { return }
                      s.buildProceduralMonsterMesh()
                  }
              }

              private func die() {
                  physicsBody = nil
                  runAction(SCNAction.sequence([
                      SCNAction.group([
                          SCNAction.rotateBy(x: 0.8, y: 1.5, z: 2.0, duration: 0.40),
                          SCNAction.scale(to: 0.02, duration: 0.40),
                          SCNAction.fadeOut(duration: 0.40)
                      ]),
                      SCNAction.removeFromParentNode()
                  ]))
              }

              func moveToward(target: SCNVector3, dt: Float) {
                  guard isAlive else { return }
                  let dx   = target.x - position.x
                  let dz   = target.z - position.z
                  let dist = sqrt(dx * dx + dz * dz)
                  
                  // Procedural Animation System (Crawling Leg Movements)
                  pulseTime += dt * kind.speed * 3.5
                  let wave = sin(pulseTime)
                  legA.eulerAngles.x = wave * 0.45
                  legB.eulerAngles.x = -wave * 0.45
                  lowerJaw.eulerAngles.x = abs(wave) * 0.22
                  
                  guard dist > kind.attackRange * 0.85 else { return }
                  let spd = kind.speed * dt
                  position.x += dx / dist * spd
                  position.z += dz / dist * spd
                  
                  let targetAngle = atan2(dx, dz)
                  let currentAngle = eulerAngles.y
                  var diff = targetAngle - currentAngle
                  while diff < -.pi { diff += .pi * 2 }
                  while diff > .pi { diff -= .pi * 2 }
                  eulerAngles.y += diff * 0.15
              }

              func distanceTo(_ p: SCNVector3) -> Float {
                  return sqrt((position.x - p.x) * (position.x - p.x) + (position.z - p.z) * (position.z - p.z))
              }

              func canAttack(at t: TimeInterval) -> Bool {
                  return t - lastAttackTime >= kind.attackInterval
              }
          }
          SWIFT_EOF

      # ── GameViewController (HUMAN MODEL ENGINE + JOYSTICK SEPARATION) ────────
      - name: GameViewController.swift
        run: |
          cat > SV3D/Sources/GameViewController.swift << 'SWIFT_EOF'
          import UIKit
          import SceneKit

          class GameViewController: UIViewController, SCNSceneRendererDelegate, SCNPhysicsContactDelegate {

              private var scnView: SCNView!
              private var scene:   SCNScene!

              // Main Nodes
              private var playerNode: SCNNode!
              private var playerBody: SCNNode!
              private var cameraArm:  SCNNode!
              private var cameraNode: SCNNode!

              // Human Character 3D Model Joints Structure
              private var pelvisNode:   SCNNode!
              private var spineNode:    SCNNode!
              private var chestNode:    SCNNode!
              private var headNode:     SCNNode!
              private var leftThigh:    SCNNode!
              private var rightThigh:   SCNNode!
              private var leftShin:     SCNNode!
              private var rightShin:    SCNNode!
              private var leftArmNode:  SCNNode!
              private var rightArmNode: SCNNode!
              private var gunNode:      SCNNode!
              
              // Animation parameters
              private var animationTime: Float = 0.0
              private var targetBodyAngle: Float = 0.0
              private var currentBodyAngle: Float = 0.0
              private var currentLeftThighX: Float = 0.0
              private var currentRightThighX: Float = 0.0
              private var currentLeftShinX: Float = 0.0
              private var currentRightShinX: Float = 0.0
              private var currentPelvisY: Float = 0.95

              // Game variables
              private var health      : Float        = 100
              private var maxHealth   : Float        = 100
              private var ammo        : Int          = 30
              private var totalAmmo   : Int          = 120
              private var score       : Int          = 0
              private var wave        : Int          = 0
              private var isReloading : Bool         = false
              private var canShoot    : Bool         = true
              private var isGameOver  : Bool         = false
              private var waveActive  : Bool         = false
              private var bossSpawned : Bool         = false
              private var waveTimer   : TimeInterval = 3.0
              private var lastTime    : TimeInterval = 0
              private var enemies     : [EnemyNode]  = []
              private var bullets     : [SCNNode]    = []
              private var lastShotTime: TimeInterval = 0
              private var shakeIntensity: Float = 0.0

              // Separate UI Interactive Elements (Crucial fix for touch screening)
              private var moveJoystick: JoystickView!
              private var aimJoystick:  JoystickView!
              private var hudView:      HUDOverlay!
              private var isShooting:   Bool    = false
              private var cameraYaw:    Float   = 0
              private let cameraPitch:  Float   = -0.25
              private weak var aimTouch: UITouch?
              private var lastAimPt:    CGPoint = .zero

              private let mapHalf: Float = 35.0

              override func viewDidLoad() {
                  super.viewDidLoad()
                  setupScene()
                  buildWorld()
                  spawnRealisticHumanPlayer()
                  setupCamera()
                  setupAdvancedLighting()
                  
                  // Setup Hierarchy Ordering: Joysticks MUST be added AFTER/ABOVE the interactive containers
                  setupJoysticks()
                  setupHUD()
                  
                  waveTimer = 3.0
              }

              override var prefersStatusBarHidden: Bool { return true }
              override var shouldAutorotate: Bool { return true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { return .landscape }

              private func setupScene() {
                  scnView = SCNView(frame: view.bounds)
                  scnView.autoresizingMask        = [.flexibleWidth, .flexibleHeight]
                  scnView.backgroundColor         = UIColor.black
                  scnView.antialiasingMode         = .multisampling4X
                  scnView.preferredFramesPerSecond = 60
                  view.addSubview(scnView)

                  scene = SCNScene()
                  scene.physicsWorld.contactDelegate = self
                  scene.physicsWorld.gravity         = SCNVector3(0, -15, 0)
                  scnView.scene    = scene
                  scnView.delegate = self
                  scnView.isPlaying = true
              }

              private func buildWorld() {
                  buildPBRGround()
                  buildMonolithicBorders()
                  buildHighResStructures()
              }

              private func buildPBRGround() {
                  let floorGeo = SCNFloor()
                  let mat = SCNMaterial()
                  mat.lightingModel = .physicallyBased
                  mat.diffuse.contents = UIColor(white: 0.06, alpha: 1)
                  mat.roughness.contents = 0.50
                  mat.metalness.contents = 0.15
                  floorGeo.materials = [mat]
                  
                  let node = SCNNode(geometry: floorGeo)
                  node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                  node.physicsBody?.categoryBitMask  = PhysicsMask.ground
                  node.physicsBody?.collisionBitMask = PhysicsMask.player | PhysicsMask.enemy
                  scene.rootNode.addChildNode(node)
              }

              private func buildMonolithicBorders() {
                  let h: Float = 12, t: Float = 2, s = mapHalf * 2
                  let walls: [(Float, Float, Float, Float, Float, Float)] = [
                      (0, h/2, -(mapHalf+t/2), s+t*2, h, t),
                      (0, h/2,  (mapHalf+t/2), s+t*2, h, t),
                      (-(mapHalf+t/2), h/2, 0, t, h, s),
                      ( (mapHalf+t/2), h/2, 0, t, h, s)
                  ]
                  for (x, y, z, w, hh, d) in walls {
                      let geo = SCNBox(width: CGFloat(w), height: CGFloat(hh), length: CGFloat(d), chamferRadius: 0.1)
                      let mat = SCNMaterial()
                      mat.lightingModel = .physicallyBased
                      mat.diffuse.contents = UIColor(white: 0.04, alpha: 1)
                      mat.roughness.contents = 0.85
                      geo.materials = [mat]
                      let node = SCNNode(geometry: geo)
                      node.position = SCNVector3(x, y, z)
                      node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                      node.physicsBody?.categoryBitMask = PhysicsMask.wall
                      scene.rootNode.addChildNode(node)
                  }
              }

              private func buildHighResStructures() {
                  let locations: [(Float, Float, Float, Float)] = [
                      (-15, -15, 6, 10), (15, -15, 5, 8), (-10, 15, 7, 12),
                      (18, 12, 6, 9), (-20, 0, 5, 11), (0, 20, 8, 14)
                  ]
                  for (x, z, w, h) in locations {
                      let geo = SCNBox(width: CGFloat(w), height: CGFloat(h), length: CGFloat(w), chamferRadius: 0.2)
                      geo.widthSegmentCount = 8
                      geo.heightSegmentCount = 16
                      
                      let mat = SCNMaterial()
                      mat.lightingModel = .physicallyBased
                      mat.diffuse.contents = UIColor(white: 0.08, alpha: 1)
                      mat.roughness.contents = 0.40
                      mat.metalness.contents = 0.30
                      geo.materials = [mat]
                      
                      let node = SCNNode(geometry: geo)
                      node.position = SCNVector3(x, h/2, z)
                      node.physicsBody = SCNPhysicsBody(type: .static, shape: nil)
                      node.physicsBody?.categoryBitMask = PhysicsMask.wall
                      scene.rootNode.addChildNode(node)
                  }
              }

