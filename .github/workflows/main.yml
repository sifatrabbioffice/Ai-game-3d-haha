name: Build iOS IPA (Sideloadable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ios-build:
    name: iOS IPA Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          set-safe-directory: 'true'
          fetch-depth: 0 # সম্পূর্ণ হিস্ট্রি এবং সাবমডিউল ট্র্যাকিং নিশ্চিত করার জন্য

      # ১. প্রয়োজনীয় সব টুলস ইনস্টল করা
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake ninja boost glm ffmpeg sdl2 bullet freetype

      # ২. ডিপেনডেন্সি, OpenGL::GL টার্গেট এবং iOS GLES3 হেডার পাথ ম্যাপ করা
      - name: Patch Dependencies Path
        run: |
          # যদি সাবমডিউল ক্লোন হতে ব্যর্থ হয়, তবে ম্যানুয়ালি ফোর্স আপডেট করা
          git submodule update --init --recursive || true

          # রুট ডিরেক্টরির স্ট্রাকচার প্রিন্ট করে দেখা (ডিবাগিং ও সুরক্ষার জন্য)
          echo "=== Current Directory Content ==="
          ls -R . | grep "CMakeLists.txt" || true
          
          # রুট ডিরেক্টরি বা তার যেকোনো সাবফোল্ডার থেকে প্রথম CMakeLists.txt ফাইলটি খুঁজে বের করা
          MAIN_CMAKE=$(find . -name "CMakeLists.txt" -type f | head -n 1)
          
          if [ -z "$MAIN_CMAKE" ]; then
            echo "Error: No CMakeLists.txt found in the workspace or any subfolder!"
            echo "Checking if we need to fall back to root..."
            MAIN_CMAKE="./CMakeLists.txt"
            touch "$MAIN_CMAKE" # জাস্ট এরর এড়ানোর জন্য মক ফাইল তৈরি করা
          fi
          
          echo "Found main CMakeLists.txt at: $MAIN_CMAKE"
          
          # মেইন ডিরেক্টরির রিলেটিভ পাথ বের করা
          RELATIVE_MAIN_DIR=$(dirname "$MAIN_CMAKE")
          echo "RELATIVE_MAIN_DIR=$RELATIVE_MAIN_DIR" >> $GITHUB_ENV
          
          # মেইন ডিরেক্টরির অ্যাবসোলিউট পাথ পরবর্তী স্টেপের জন্য সেভ করা
          MAIN_DIR=$(pwd)/$RELATIVE_MAIN_DIR
          echo "MAIN_DIR=$MAIN_DIR" >> $GITHUB_ENV

          # বুস্ট লাইব্রেরি ফিক্স (খুঁজে পাওয়া মেইন ফাইলে অ্যাপ্লাই করা হচ্ছে)
          if [ -f "$MAIN_CMAKE" ]; then
            sed -i '' 's/find_package(Boost.*COMPONENTS.*/find_package(Boost REQUIRED)/g' "$MAIN_CMAKE" || true
            sed -i '' '/find_package(Boost REQUIRED)/a\
            set(Boost_INCLUDE_DIRS /opt/homebrew/include)\
            set(Boost_LIBRARY_DIRS /opt/homebrew/lib)\
            include_directories(${Boost_INCLUDE_DIRS})\
            link_directories(${Boost_LIBRARY_DIRS})\
            ' "$MAIN_CMAKE" || true
          fi
          
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::program_options/boost_program_options/g' {} + || true
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::system/boost_system/g' {} + || true
          find . -name "CMakeLists.txt" -exec sed -i '' 's/Boost::filesystem/boost_filesystem/g' {} + || true

          # ওপেনজিএল এবং মডার্ন OpenGL::GL ইন্টারফেস ফিক্স
          if [ -f "$MAIN_CMAKE" ] && [ "$MAIN_CMAKE" != "./CMakeLists.txt" ]; then
            sed -i '' '/find_package(OpenGL REQUIRED)/c\
            set(OPENGL_FOUND TRUE)\
            set(OPENGL_INCLUDE_DIR /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.5.sdk/System/Library/Frameworks/OpenGLES.framework/Headers)\
            set(OPENGL_LIBRARIES "-framework OpenGLES")\
            if(NOT TARGET OpenGL::GL)\
              add_library(OpenGL::GL INTERFACE IMPORTED)\
              set_target_properties(OpenGL::GL PROPERTIES INTERFACE_LINK_LIBRARIES "-framework OpenGLES")\
            endif()\
            ' "$MAIN_CMAKE" || true
          fi

          # imgui এর জন্য GLES3/gl3.h এরর ফিক্স
          find . -name "imgui_impl_opengl3.cpp" -exec sed -i '' 's/#include <GLES3\/gl3.h>/#include <OpenGLES\/ES3\/gl.h>/g' {} + || true

      # ৩. ক্রস-কম্পাইল কনফিগারেশন (সহজ এবং নিরাপদ বিল্ড পাথ দিয়ে)
      - name: Configure CMake
        run: |
          # সোর্স ডিরেক্টরি নিশ্চিত করা
          TARGET_SOURCE_DIR="${{ env.MAIN_DIR }}"
          if [ -z "$TARGET_SOURCE_DIR" ] || [ ! -f "$TARGET_SOURCE_DIR/CMakeLists.txt" ]; then
            echo "Warning: env.MAIN_DIR is invalid or missing CMakeLists.txt. Falling back to find command."
            FALLBACK_CMAKE=$(find . -name "CMakeLists.txt" -type f | head -n 1)
            if [ -n "$FALLBACK_CMAKE" ]; then
              TARGET_SOURCE_DIR=$(pwd)/$(dirname "$FALLBACK_CMAKE")
            else
              TARGET_SOURCE_DIR=$(pwd)
            fi
          fi
          
          echo "Using Source Directory: $TARGET_SOURCE_DIR"
          
          # বিল্ড ডিরেক্টরি তৈরি ও কনফিগার করা
          mkdir -p build
          cd build
          
          cmake "$TARGET_SOURCE_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="/opt/homebrew" \
            -DCMAKE_FIND_ROOT_PATH="/opt/homebrew" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_CXX_FLAGS="-I/Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.5.sdk/System/Library/Frameworks/OpenGLES.framework/Headers" \
            -DCMAKE_C_FLAGS="-I/Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS18.5.sdk/System/Library/Frameworks/OpenGLES.framework/Headers"

      # ৪. গেম কম্পাইল করা
      - name: Build Project
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}

      # ৫. আউটপুট বাইনারিকে আইফোনের জন্য সাইডলোডযোগ্য .ipa ফাইলে রূপান্তর
      - name: Package Package into Sideloadable .ipa
        run: |
          mkdir -p build/Payload/rwgame.app
          
          BIN_PATH=$(find build -name "rwgame" -type f | head -n 1)
          echo "Found Binary at: $BIN_PATH"
          
          if [ -z "$BIN_PATH" ]; then
            echo "Error: Build output 'rwgame' not found!"
            exit 1
          fi
          
          cp "$BIN_PATH" build/Payload/rwgame.app/rwgame
          
          cat << 'EOF' > build/Payload/rwgame.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.txt">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>rwgame</string>
              <key>CFBundleIdentifier</key>
              <string>org.openrw.rwgame</string>
              <key>CFBundleName</key>
              <string>OpenRW</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF
          
          cd build
          zip -r openrw-ios-sideload.ipa Payload/

      # ৬. ফাইনাল .ipa ফাইলটি আপলোড করা
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrw-ios-sideload
          path: build/openrw-ios-sideload.ipa
